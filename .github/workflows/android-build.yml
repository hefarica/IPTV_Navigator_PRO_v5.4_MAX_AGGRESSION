name: Android · build APK (ape-crystal-agent)

# Compila el daemon aplicador-puro en la nube (sin SDK local) y sube el APK como artifact.
# Debug-signed = suficiente para sideload en el Fire TV.

on:
  workflow_dispatch:
  push:
    paths:
      - 'IPTV_v5.4_MAX_AGGRESSION/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IPTV_v5.4_MAX_AGGRESSION/android/ape-crystal-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (runner preinstalled, no removed tools package)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKM" ]; then echo "sdkmanager no encontrado" >&2; exit 1; fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "SDK=$SDK"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ape-crystal-agent-debug-apk
          path: IPTV_v5.4_MAX_AGGRESSION/android/ape-crystal-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
