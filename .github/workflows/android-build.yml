name: Android · build APK (ape-crystal-agent)

# Compila el daemon aplicador-puro en la nube (sin SDK local) y sube el APK como artifact.
# Debug-signed = suficiente para sideload en el Fire TV.

on:
  workflow_dispatch:
  push:
    paths:
      - 'IPTV_v5.4_MAX_AGGRESSION/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IPTV_v5.4_MAX_AGGRESSION/android/ape-crystal-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ape-crystal-agent-debug-apk
          path: IPTV_v5.4_MAX_AGGRESSION/android/ape-crystal-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
