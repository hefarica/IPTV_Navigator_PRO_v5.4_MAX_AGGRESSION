name: APE bridge guard

# Guardia del puente APE_4K_BRIDGE_ENABLED.
#
# POR QUE EXISTE
#   El puente solo esta encendido si el pool de php-fpm tiene `env[APE_4K_BRIDGE_ENABLED] = 1`.
#   Su valor por defecto es OFF. Cualquiera de estas cosas lo apaga en silencio y la cadena
#   VPS -> ARA deja de servir sin que nada falle visiblemente:
#     - `apt upgrade` de php8.3 reescribe pool.d/www.conf
#     - alguien restaura un backup viejo de www.conf
#     - se reinstala php-fpm
#     - el deploy corre en mode=dry y nunca aplica el step que lo enciende
#
# COMO LO COMPRUEBA
#   Delega en tools/hardening/check_bridge_flag.js, que hace las nueve comprobaciones y ya esta
#   probado contra produccion (9 PASS / 0 FAIL). El workflow NO reimplementa esa logica: la
#   primera version lo hizo y fallo dos veces por como se escapan las comillas del php -r dentro
#   del YAML. Un solo sitio donde vive la verdad.
#
# QUE REPARA
#   Solo el flag de www.conf y el timer del sincronizador. Nada mas. No despliega codigo, no
#   toca el feedforward, no toca la base.
#
# Rollback: desactivar este workflow y quitar la linea env[APE_4K_BRIDGE_ENABLED] del www.conf.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      repair:
        description: 'Reponer el flag si falta (escribe en www.conf y recarga fpm)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: ape-bridge-guard
  cancel-in-progress: false

jobs:
  guard:
    name: El puente de deltas sigue encendido
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Preparar node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. el flag esta puesto en el pool de fpm
        run: |
          set -uo pipefail
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          CONF=/etc/php/8.3/fpm/pool.d/www.conf
          N=$(ssh "$TARGET" "grep -c '^env\[APE_4K_BRIDGE_ENABLED\] = 1' '$CONF' || true")
          echo "  ocurrencias del flag: $N"
          if [ "$N" = "1" ]; then echo "  PASS flag presente"; exit 0; fi
          echo "::warning::el flag NO esta puesto (encontrado: $N)"
          if [ "${{ github.event.inputs.repair || 'true' }}" != "true" ]; then
            echo "::error::flag ausente y repair=false"; exit 1
          fi
          ssh "$TARGET" "sudo -n cp -a '$CONF' '$CONF.guard_$(date -u +%Y%m%dT%H%M%SZ)'"
          ssh "$TARGET" "echo 'env[APE_4K_BRIDGE_ENABLED] = 1' | sudo -n tee -a '$CONF' >/dev/null"
          ssh "$TARGET" "sudo -n php-fpm8.3 -t" || { echo "::error::fpm no valida tras reparar"; exit 1; }
          ssh "$TARGET" "sudo -n systemctl reload php8.3-fpm"
          sleep 4
          N2=$(ssh "$TARGET" "grep -c '^env\[APE_4K_BRIDGE_ENABLED\] = 1' '$CONF' || true")
          [ "$N2" = "1" ] && echo "  REPARADO" || { echo "::error::la reparacion no prendio"; exit 1; }

      - name: 2. el gate completo (nueve comprobaciones, incluida la prueba de efecto)
        env:
          APE_VPS_HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -uo pipefail
          node tools/hardening/check_bridge_flag.js
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::el gate fallo (exit $RC) — el puente esta caido o incompleto"
            echo "  para reparar en el VPS: node tools/hardening/check_bridge_flag.js --repair"
            exit 1
          fi

      - name: 3. el timer del sincronizador sigue activo
        run: |
          set -uo pipefail
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          ST=$(ssh "$TARGET" "systemctl is-active ape-quality-sync.timer 2>&1" || true)
          echo "  estado: $ST"
          if [ "$ST" = "active" ]; then echo "  PASS"; exit 0; fi
          echo "::warning::el timer no esta activo — reintentando enable --now"
          ssh "$TARGET" "sudo -n systemctl enable --now ape-quality-sync.timer" || true
          sleep 3
          ST2=$(ssh "$TARGET" "systemctl is-active ape-quality-sync.timer 2>&1" || true)
          [ "$ST2" = "active" ] && echo "  REPARADO" || { echo "::error::el timer no arranca"; exit 1; }

      - name: Resumen
        if: always()
        run: |
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          echo "=== estado final ==="
          ssh "$TARGET" "grep -c '^env\[APE_4K_BRIDGE_ENABLED\] = 1' /etc/php/8.3/fpm/pool.d/www.conf 2>/dev/null || echo 0" | sed 's/^/  flag en www.conf: /'
          ssh "$TARGET" "systemctl is-active ape-quality-sync.timer 2>&1" | sed 's/^/  timer: /'
          ssh "$TARGET" "systemctl list-timers ape-quality-sync.timer --no-pager 2>/dev/null | head -2" || true
