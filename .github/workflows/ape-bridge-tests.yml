name: APE Isomorphic Bridge Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ape_*.py'
      - 'tools/m3u8_json_bridge.py'
      - 'tools/validate_m3u8_json.py'
      - 'tools/check_*.js'
      - 'frontend/tests/url-guard-*.test.js'
      - 'frontend/tests/lab-profile-count.test.js'
      - 'frontend/js/ape-v9/ape-lab-v8-profiles.js'
      - 'contracts/ape_*.json'
      # [2026-11-13] Paths que FALTABAN. Medido: el gate anti-degradacion escanea
      # el codigo JIT y lee el contrato y AGENTS.md, pero ninguno de esos ficheros
      # disparaba este workflow. Cambiar el motor —donde esta la degradacion de
      # audio que el gate vigila— no ejecutaba el gate. Un gate que no corre
      # cuando cambia lo que vigila es decorativo.
      - 'tools/quality/test_*.js'
      - 'contracts/anti_degradation_contract.json'
      - 'contracts/canary_*.json'
      - 'tools/lab/ape-jit/**'
      - 'IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/**'
      - 'vps_jit/**'
      - 'AGENTS.md'
      - 'docs/policies/ANTI_DEGRADATION_LAW.md'
      - 'docs/policies/CRYSTAL_4K_ENHANCEMENT_LAW.md'
      - 'docs/policies/CRYSTAL_6K_MAX_ENHANCEMENT_LAW.md'
      - '.github/workflows/ape-bridge-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python bridge / health / metadata tests
        run: |
          python3 tools/test_m3u8_bridge.py
          python3 tools/test_mpd_bridge.py
          python3 tools/test_health_enrich.py
          python3 tools/test_metadata_enrich.py
          python3 tools/test_pipeline_idempotence.py
          python3 tools/test_alexa_resolver.py
      - name: Node URL-GUARD / LAB / audio gates
        run: |
          node frontend/tests/url-guard-resolution.test.js
          node frontend/tests/url-guard-generator-runtime.test.js
          node frontend/tests/lab-profile-count.test.js
          node tools/check_audio_safe_policy.js
          node tools/check_omega_directives.js
      # [2026-11-13] La LEY ANTI-DEGRADACION es innegociable, y su gate NO lo
      # ejecutaba ningun workflow: cualquier commit podia reintroducir degradacion
      # y nada lo cazaba. Se añade aqui, junto a los otros gates de politica.
      # Primero la PRUEBA del gate (que el gate siga viendo degradacion real y no
      # castigue la documentacion), despues los gates. Si la prueba falla, el
      # gate no es fiable y el job debe parar antes de creerle.
      - name: Gate anti-degradacion (ley innegociable) + su propia prueba
        run: |
          echo "== prueba del gate: que no sea ciego ni castigue documentar =="
          node tools/quality/test_anti_degradation_gate.js
          echo "== la ley y el contrato =="
          node tools/check_anti_degradation_policy.js
          echo "== crystal 4K / 6K =="
          node tools/check_crystal_4k_law.js
          node tools/check_crystal_6k_law.js
      - name: Vocabulario de SoC identico en todos los runtimes
        run: node tools/quality/check_soc_vocabulary.js

      - name: Normalizacion del SoC real al token canonico
        run: node tools/quality/test_soc_normalization.js

      - name: Test de contrato capacidades APK <-> soc_gate del VPS
        run: node tools/quality/test_caps_contract.js

      - name: Test de seleccion de variante (resolucion manda, no el bitrate)
        run: node tools/quality/test_variant_select.js

      - name: Test de cadencia del display (Display4K no debe pisar el modo)
        run: node tools/quality/test_display_cadence.js

      # El contrato Canary-JIT se dejo al FINAL a proposito. Medido el 2026-11-21: su
      # pin esta obsoleto y el paso falla, y al estar en medio del archivo GitHub
      # SALTABA los 7 gates siguientes. Un recibo viejo no puede apagar gates que no
      # tienen nada que ver con el: se ejecutan todos y el que falle se vera al final.

      # [2026-11-21] Medido en el primer run real de este workflow (44942237425): este
      # paso moria con exit 2 «FALTA LABV24». La causa no es el test, es el contrato del
      # fichero: apunta a artifacts/LAB_CALIBRATED_FINAL_v24.0.0-6K.json, que esta en
      # .gitignore (linea 174) porque el LAB calibrado arrastra material de proveedor
      # (108 https://, 26 menciones xtream, 5 username/password). No se versiona eso.
      # Sin el artefacto el gate NO se puede computar: se declara NO_COMPUTADO y se
      # frena ahi, en vez de fingir un resultado con un fixture inventado (prohibido:
      # no mocks). En local se ejecuta pasando LABV24=<ruta al LAB real>.
      - name: 6K emulado sobre fuente MEDIDA (no asumida)
        run: |
          LAB="${GITHUB_WORKSPACE}/artifacts/LAB_CALIBRATED_FINAL_v24.0.0-6K.json"
          if [ ! -f "$LAB" ]; then
            echo "::warning::NO_COMPUTADO test_6k_source_honest — el LAB v24.0.0-6K no existe en el runner ($LAB)."
            echo "NO_COMPUTADO test_6k_source_honest :: requiere artifacts/LAB_CALIBRATED_FINAL_v24.0.0-6K.json (ignorado por git por material de proveedor). Ejecucion local: LABV24=<ruta> node tools/quality/test_6k_source_honest.js"
            exit 0
          fi
          LABV24="$LAB" node tools/quality/test_6k_source_honest.js

      - name: Politica de composicion polimorfica (tope 1080p del firmware)
        run: node tools/quality/test_composition_policy.js
      # [2026-11-21] Estas dos lineas estaban PEGADAS (name + run en el mismo renglon,
      # con 7 espacios de sangria): el YAML era invalido y GitHub registraba este
      # workflow como "Invalid workflow file" -> startup failure SIN jobs y SIN logs.
      # Medido: el run 44941757590 (push c404d054) devolvio jobs:[] y el listado de
      # workflows mostraba la RUTA como nombre. Es decir: el gate anti-degradacion,
      # los tests de puente, el contrato Canary-JIT y el resto de este archivo NO se
      # ejecutaban desde entonces. Un gate que no corre es decorativo; se repara.
      # [2026-11-21] Estos dos gates miden sobre un video de referencia que NO esta en el
      # repo: hasta hoy su default era un path personal de Windows, asi que en CI morian
      # con exit 2 y apagaban los gates siguientes. Ahora usan APE_REF_VIDEO y, sin video,
      # declaran NO_COMPUTADO con exit 3. Aqui el 3 se informa como aviso; un veredicto
      # negativo real (exit 1) sigue rompiendo el job.
      - name: Metrica de detalle HF (validada, monotona con bitrate)
        run: |
          set +e
          node tools/quality/test_hf_detail_metric.js
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::NO_COMPUTADO test_hf_detail_metric — falta el video de referencia (APE_REF_VIDEO)."
            exit 0
          fi
          exit "$rc"
      - name: Detector de bloque sobre HEVC (queda refutado, HF no)
        run: |
          set +e
          node tools/quality/test_hevc_block_detector.js
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::NO_COMPUTADO test_hevc_block_detector — falta el video de referencia (APE_REF_VIDEO)."
            exit 0
          fi
          exit "$rc"

      # [2026-11-21] El guard del reconciliador JIT distingue "la misma lista se truncó"
      # de "es otro catálogo". Sin esto el servicio abortaba cada 5 minutos comparando
      # 11 222 canales de una lista contra 21 224 de otra y congelaba la allowlist.
      - name: Guard del reconciliador JIT (identidad de lista, fail-closed)
        run: node tools/quality/test_reconcile_list_identity.js

      # CABLEADO: identidad + estructura + harness en un veredicto, sobre un FIXTURE.
      # Modo --sin-red para que el CI no dependa de la red ni del proveedor.
      # Las listas REALES se verifican con el endpoint (ape-list-probe v3) y a mano,
      # porque dependen del proveedor y cambian; ver docs/audits/LIST_GATE_*.json
      - name: Lista APTA (gate completo, fixture offline)
        run: node tools/quality/list_gate.js tests/fixtures/lista_sana_con_harness.m3u8 --sin-red

      # REGLAS DE SUPERRESOLUCION: valida lo que la metadata AFIRMA sobre SR.
      # Fuente: contracts/super_resolution_rules.json (relectura aplicada del
      # glosario de Ultralytics). Prueba en los DOS sentidos: un fixture que
      # cumple debe pasar y uno que viola las 7 debe fallar.
      - name: Reglas de superresolucion (gate + fixtures)
        run: node tools/quality/test_sr_rules_gate.js

      # REGLAS PARA LA GENERACION: el generador puede validar una declaracion
      # antes de emitirla y completarla si le falta contexto, en vez de elegir
      # entre publicar mal o no publicar.
      - name: Reglas SR en caliente (validar y completar antes de emitir)
        run: node tools/quality/test_sr_rules_para_generacion.js

      # ULTIMO a proposito: si este contrato falla, los demas gates ya se ejecutaron.
      # [2026-11-21] La revision 1 del recibo pineaba un motor que ya no era ni el del repo
      # ni el de produccion (cuatro identidades: recibo 8c1a0085, tools/lab 38c92b56,
      # vps/ape-jit a3c671a2, /opt/ape-jit 44d8bf84). Se re-baselineo a revision 2 sobre el
      # canonico medido (268bbd3a, 480976 B, union de las dos ramas) y el gate pasa 92/92.
      # Ver docs/audits/INCIDENT_JIT_ENGINE_20261121.md.
      - name: Contrato Canary-JIT (motor desplegado == lo pinado)
        run: node tools/quality/test_canary_jit_contract.js