name: APE Isomorphic Bridge Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ape_*.py'
      - 'tools/m3u8_json_bridge.py'
      - 'tools/validate_m3u8_json.py'
      - 'tools/check_*.js'
      - 'frontend/tests/url-guard-*.test.js'
      - 'frontend/tests/lab-profile-count.test.js'
      - 'frontend/js/ape-v9/ape-lab-v8-profiles.js'
      - 'contracts/ape_*.json'
      # [2026-11-13] Paths que FALTABAN. Medido: el gate anti-degradacion escanea
      # el codigo JIT y lee el contrato y AGENTS.md, pero ninguno de esos ficheros
      # disparaba este workflow. Cambiar el motor —donde esta la degradacion de
      # audio que el gate vigila— no ejecutaba el gate. Un gate que no corre
      # cuando cambia lo que vigila es decorativo.
      - 'tools/quality/test_*.js'
      - 'contracts/anti_degradation_contract.json'
      - 'contracts/canary_*.json'
      - 'tools/lab/ape-jit/**'
      - 'IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/**'
      - 'vps_jit/**'
      - 'AGENTS.md'
      - 'docs/policies/ANTI_DEGRADATION_LAW.md'
      - 'docs/policies/CRYSTAL_4K_ENHANCEMENT_LAW.md'
      - 'docs/policies/CRYSTAL_6K_MAX_ENHANCEMENT_LAW.md'
      - '.github/workflows/ape-bridge-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python bridge / health / metadata tests
        run: |
          python3 tools/test_m3u8_bridge.py
          python3 tools/test_mpd_bridge.py
          python3 tools/test_health_enrich.py
          python3 tools/test_metadata_enrich.py
          python3 tools/test_pipeline_idempotence.py
          python3 tools/test_alexa_resolver.py
      - name: Node URL-GUARD / LAB / audio gates
        run: |
          node frontend/tests/url-guard-resolution.test.js
          node frontend/tests/url-guard-generator-runtime.test.js
          node frontend/tests/lab-profile-count.test.js
          node tools/check_audio_safe_policy.js
          node tools/check_omega_directives.js
      # [2026-11-13] La LEY ANTI-DEGRADACION es innegociable, y su gate NO lo
      # ejecutaba ningun workflow: cualquier commit podia reintroducir degradacion
      # y nada lo cazaba. Se añade aqui, junto a los otros gates de politica.
      # Primero la PRUEBA del gate (que el gate siga viendo degradacion real y no
      # castigue la documentacion), despues los gates. Si la prueba falla, el
      # gate no es fiable y el job debe parar antes de creerle.
      - name: Gate anti-degradacion (ley innegociable) + su propia prueba
        run: |
          echo "== prueba del gate: que no sea ciego ni castigue documentar =="
          node tools/quality/test_anti_degradation_gate.js
          echo "== la ley y el contrato =="
          node tools/check_anti_degradation_policy.js
          echo "== crystal 4K / 6K =="
          node tools/check_crystal_4k_law.js
          node tools/check_crystal_6k_law.js
      - name: Vocabulario de SoC identico en todos los runtimes
        run: node tools/quality/check_soc_vocabulary.js

      - name: Normalizacion del SoC real al token canonico
        run: node tools/quality/test_soc_normalization.js

      - name: Test de contrato capacidades APK <-> soc_gate del VPS
        run: node tools/quality/test_caps_contract.js

      - name: Test de seleccion de variante (resolucion manda, no el bitrate)
        run: node tools/quality/test_variant_select.js

      - name: Test de cadencia del display (Display4K no debe pisar el modo)
        run: node tools/quality/test_display_cadence.js

      - name: Contrato Canary-JIT (motor desplegado == lo pinado)
        run: node tools/quality/test_canary_jit_contract.js

      - name: 6K emulado sobre fuente MEDIDA (no asumida)
        env:
          LABV24: ${{ github.workspace }}/artifacts/LAB_CALIBRATED_FINAL_v24.0.0-6K.json
        run: node tools/quality/test_6k_source_honest.js

      - name: Politica de composicion polimorfica (tope 1080p del firmware)
        run: node tools/quality/test_composition_policy.js
       - name: Metrica de detalle HF (validada, monotona con bitrate)         run: node tools/quality/test_hf_detail_metric.js
       - name: Detector de bloque sobre HEVC (queda refutado, HF no)         run: node tools/quality/test_hevc_block_detector.js
       # Candado: ninguna lista con rutas muertas se publica.       # Falla si UNA clase de ruta responde 4xx/5xx en TODAS sus muestras.       - name: Lista publicada — rutas vivas         run: node tools/quality/check_playlist_servability.js OMEGA_UPDATE/APE_OMEGA_PRODUCTION_v5.2.m3u8 2