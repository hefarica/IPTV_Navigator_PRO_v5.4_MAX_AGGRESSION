name: ape-deploy-frontend

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Despliega frontend, endpoints PHP, sincronizadores y plano de control ADB.
# No es una publicación REA estática aislada; alcance/rollback pendientes:
# docs/audits/REA_ALIGNMENT_20261108.md
#
# POR QUÉ EXISTE: deploy-vps.yml despliega los endpoints y la capa Lua/PHP, pero su manifiesto NO incluye
# m3u8-typed-arrays-ultimate.js. El generador es frontend de navegador y se sirve desde /var/www/html.
# Medido el 2026-11-03: el VPS servía 840.087 bytes con pp=ac/dr/ci ×3, scd=5 ×6 y zscale=bt1886 ×5,
# mientras el repo ya tenía esas cadenas corregidas. Las mejoras no estaban en producción.
#
# Verifica TRES cosas antes de declarar éxito:
#   1. el sha256 del fichero instalado coincide con el del repo
#   2. el fichero servido por HTTP contiene las correcciones (no solo que pese lo mismo)
#   3. el fichero servido NO contiene los patrones defectuosos
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify-only (sin instalar; usa temporales remotos) o apply (frontend, PHP y servicios)'
        required: true
        default: 'verify-only'
        type: choice
        options: [verify-only, apply]
      confirm:
        description: 'Para apply escribe exactamente: DESPLIEGO EL GENERADOR AL VPS'
        required: false
        default: ''

concurrency:
  group: ape-deploy-frontend
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      # Lista de ficheros de la APP que se sirven desde /var/www/html. Se despliegan TODOS porque el
      # generador y el panel de salida son la misma app: desplegar uno sin el otro deja la UI incoherente.
      # ape-server-profile.js es el modulo multiservidor y ape-server-profiles-data.js
      # son los perfiles MEDIDOS que ese modulo consume: si viaja el generador sin
      # ellos la capacidad por servidor cae a UNMEASURED.
      # Rutas relativas al frontend: incluye emisores legacy, worker, app y LAB.
      # El mismo inventario gobierna sintaxis, backup, instalación y hash HTTP.
      FICHEROS: >-
        js/ape-v9/m3u8-typed-arrays-ultimate.js js/ape-v9/generation-output-panel.js
        js/ape-v9/ape-profiles-config.js js/ape-v9/profile-manager-v9.js
        js/ape-v9/ape-image-recipes-bundle.js js/ape-v9/generation-controller.js
        js/ape-v9/ape-server-profile.js js/ape-v9/ape-server-profiles-data.js
        js/ape-v9/rea-processing-policy.js js/ape-v9/rea-export-finalizer.js
        js/ape-v9/rea-catalog-export.js js/ape-v9/ape-quality-prober.js
        js/ape-v9/unified-generator-integration.js js/ape-v9/m3u8-api-wrapper-integrated.js
        js/ape-lab-import-helper.js js/ape-worker.js js/m3u8-world-class-generator.js
        js/m3u8-generator-v16-elite.js export-module.js app.js
      SRC_DIR: IPTV_v5.4_MAX_AGGRESSION/frontend
      DEST_DIR: /var/www/html

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # [FIX 2026-11-06] El job abre ~50 ssh/scp. Sin reutilizar la conexion, sshd corta
          # por MaxStartups y el run muere con "kex_exchange_identification: read:
          # Connection reset by peer" ANTES de desplegar (paso el 2026-11-06 17:11).
          # ControlMaster + ControlPersist = UNA sola conexion TCP para todo el job.
          # Los % de ControlPath van escapados (%%r) porque esto es un printf.
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 300s\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n  ConnectTimeout 20\n  TCPKeepAlive yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: Los fuentes del repo compilan y tienen las correcciones
        run: |
          set -euo pipefail
          for f in $FICHEROS; do node -c "$SRC_DIR/$f"; echo "  node -c OK  $f"; done
          SRC="$SRC_DIR/js/ape-v9/m3u8-typed-arrays-ultimate.js"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo '--- correcciones presentes en el repo ---'
          # [ACTUALIZADO 2026-11-05] El generador migro de `colorspace=iall=bt709` a
          # `tools/ape-image-recipes/recipes.json`, donde el color y el escalado viven en
          # `zscale=` y la honestidad de VLC en `vlc_skipped`. Se exige el equivalente real,
          # no el literal viejo: el gate sigue protegiendo lo mismo con el codigo de hoy.
          for p in 'zscale=w=' 'strength=0.51' 'scale=w=3840:h=2160:flags=lanczos' 'vlc_skipped'; do
            n=$(grep -c -- "$p" "$SRC" || true)
            echo "  $p = $n"
            [ "$n" -gt 0 ] || { echo "::error::el repo no tiene la correccion '$p'"; exit 1; }
          done
          # Los defectos se buscan SOLO en lineas de codigo: los comentarios que EXPLICAN el defecto
          # contienen el nombre del defecto a proposito y no deben contar como si siguiera vivo.
          echo '--- defectos ausentes en el CODIGO del repo (sin comentarios) ---'
          for p in 'pp=ac/dr/ci' ':scd=5' 'zscale=transfer=bt1886'; do
            n=$(grep -v -E '^\s*(//|\*|#)' "$SRC" | grep -c -- "$p" || true)
            echo "  $p = $n"
            [ "$n" -eq 0 ] || { echo "::error::el repo aun tiene '$p' en codigo"; exit 1; }
          done
          sha256sum "$SRC" | tee local.sha

      - name: Estado del VPS (solo lectura)
        run: |
          set -euo pipefail
          for f in $FICHEROS; do
            SAFE_F=${f//\//_}
            echo "--- $f en el VPS ---"
            ssh "$TARGET" "sudo -n stat -c '%n %s bytes %y' '$DEST_DIR/$f' 2>&1 || echo AUSENTE"
            ssh "$TARGET" "sudo -n sha256sum '$DEST_DIR/$f' 2>&1 || true"
            echo "--- $f por HTTP ---"
            curl -sS -o "/tmp/servido-$SAFE_F" -w '  http=%{http_code} bytes=%{size_download}\n' \
              "https://iptv-ape.duckdns.org/$f" || true
            echo "  sha servido: $(sha256sum "/tmp/servido-$SAFE_F" 2>/dev/null | cut -d' ' -f1)"
            for p in 'pp=ac/dr/ci' ':scd=5' 'zscale=transfer=bt1886'; do
              echo "  defecto servido $p = $(grep -v -E '^\s*(//|\*|#)' "/tmp/servido-$SAFE_F" 2>/dev/null | grep -c -- "$p" || true)"
            done
          done

      - name: DIAGNOSTICO — donde vive cada copia y que ruta usa nginx
        run: |
          set -uo pipefail
          echo '=== TODAS las copias del panel y del generador en el VPS ==='
          ssh "$TARGET" "sudo -n find /var/www /usr/share /opt -name 'generation-output-panel.js' -o -name 'm3u8-typed-arrays-ultimate.js' 2>/dev/null | head -20 | while read p; do sudo -n stat -c '%n %s %y' \"\$p\"; done"
          echo
          echo '=== locations de nginx que mencionan ape-v9 o js ==='
          ssh "$TARGET" "sudo -n grep -nE 'location|alias|root' /etc/nginx/sites-enabled/default | grep -iE 'js|ape-v9|/var/www' | head -20"
          echo
          echo '=== hay .gz hermanos? ==='
          ssh "$TARGET" "sudo -n ls -l /var/www/html/js/ape-v9/*.gz 2>&1 || echo 'sin .gz en ape-v9'"
          echo
          echo '=== el fichero servido ahora mismo ==='
          curl -sS -o /tmp/diag.js -w '  http=%{http_code} bytes=%{size_download}\n' \
            "https://iptv-ape.duckdns.org/js/ape-v9/generation-output-panel.js"
          echo "  sha servido: $(sha256sum /tmp/diag.js | cut -d' ' -f1)"
          echo "  etag servido: $(curl -sSI 'https://iptv-ape.duckdns.org/js/ape-v9/generation-output-panel.js' | grep -i etag || true)"

      - name: Exigir la confirmacion literal
        if: inputs.mode == 'apply'
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_CONFIRMATION" != "DESPLIEGO EL GENERADOR AL VPS" ]; then
            echo '::error::falta la confirmacion literal. No se escribe nada.'
            printf '  recibido: %s\n' "$DEPLOY_CONFIRMATION"
            exit 1
          fi
          echo 'confirmacion literal presente'

      - name: Backup y despliegue
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          # Un fichero NUEVO no tiene nada que respaldar: `cp -a $DEST $BAK` falla y
          # abortaba el deploy ENTERO (paso el 2026-11-06 al anadir ape-server-profile.js:
          # los 6 existentes se instalaron y el 7o mato el run). Ahora el backup es
          # condicional y el rollback BORRA lo nuevo en vez de restaurar un backup que
          # no existe. Asi el workflow soporta crear ficheros, no solo actualizarlos.
          rollback_f() {
            if [ "${NUEVO:-0}" = "1" ]; then
              ssh "$TARGET" "sudo -n rm -f '$DEST'" && echo "  rollback: BORRADO $f (era nuevo)"
            else
              ssh "$TARGET" "sudo -n cp -a '$BAK' '$DEST'" && echo "  rollback: restaurado $f desde $BAK"
            fi
          }
          for f in $FICHEROS; do
            SRC="$SRC_DIR/$f"; DEST="$DEST_DIR/$f"; BAK="$DEST.bak_$STAMP"
            echo "=== $f ==="
            NUEVO=0
            if ssh "$TARGET" "sudo -n test -f '$DEST'"; then
              if ! ssh "$TARGET" "sudo -n cp -a '$DEST' '$BAK'"; then
                echo "::error::fallo el backup de $f. No se toca nada."; exit 1
              fi
              echo "  backup: $BAK"
            else
              NUEVO=1
              echo "  fichero NUEVO (sin backup: el rollback lo borra)"
            fi
            scp -q "$SRC" "$TARGET:/tmp/ape-new.js"
            if ! ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-new.js '$DEST'"; then
              echo "::error::fallo la instalacion de $f. Restaurando."
              rollback_f; exit 1
            fi
            REMOTO=$(ssh "$TARGET" "sudo -n sha256sum '$DEST' | cut -d' ' -f1")
            LOCAL=$(sha256sum "$SRC" | cut -d' ' -f1)
            if [ "$REMOTO" != "$LOCAL" ]; then
              echo "::error::el sha instalado de $f no coincide. RESTAURANDO."
              rollback_f; exit 1
            fi
            echo "  sha OK ($LOCAL)"
            # EL .gz MANDA: gzip_static sirve el hermano comprimido si existe, y ese .gz puede ser la
            # generacion anterior. Instalar el .js con sha correcto no cambia lo que el cliente recibe.
            # Es el mismo mecanismo que dejo la lista en 8 bytes.
            if ssh "$TARGET" "sudo -n test -f '$DEST.gz'"; then
              ssh "$TARGET" "sudo -n sh -c 'gzip -9 -c \"$DEST\" > /tmp/ape-gz && chown www-data:www-data /tmp/ape-gz && install -m 0644 -o www-data -g www-data /tmp/ape-gz \"$DEST.gz\"'"
              GZOK=$(ssh "$TARGET" "sudo -n sh -c 'zcat \"$DEST.gz\" | sha256sum | head -c 64'")
              if [ "$GZOK" != "$LOCAL" ]; then
                echo "::error::el .gz de $f descomprime a otro contenido. RESTAURANDO."
                rollback_f; exit 1
              fi
              echo "  .gz OK (descomprime al mismo contenido)"
            fi
            if [ "$NUEVO" = "1" ]; then
              echo "PARA REVERTIR $f (nuevo): sudo rm -f $DEST"
            else
              echo "PARA REVERTIR $f: sudo cp -a $BAK $DEST"
            fi
          done
          echo 'TODOS LOS FICHEROS DESPLEGADOS'

          # ── RELOAD, no restart ──────────────────────────────────────────────────────────────
          # Medido el 2026-11-03: instalar el .js con sha correcto no cambia lo que nginx sirve.
          # nginx mantiene descriptores de fichero abiertos (open_file_cache) y sigue entregando la
          # generacion anterior con su Last-Modified viejo hasta que la cache expira o el worker se
          # recarga. Un reload NO reinicia el servicio y NO corta conexiones: relee config y descarta
          # esos descriptores. Un restart si cortaria, y no se usa.
          echo '--- nginx -t antes de recargar ---'
          if ! ssh "$TARGET" 'sudo -n nginx -t'; then
            echo '::error::nginx -t falla. NO se recarga. Los ficheros quedan instalados pero sin servir.'
            exit 1
          fi
          ssh "$TARGET" 'sudo -n nginx -s reload'
          sleep 3
          echo 'reload hecho; descriptores de fichero descartados'

      - name: Publicar fuente del resolver (solo lectura, NO ejecutable)
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          # El endpoint de paridad necesita LEER el resolver para extraer sus tags. En el VPS
          # solo habia un stub de 6 KB (0 tags) y un backup de mayo (218 tags): el resolver real
          # nunca se desplego. Se publica como .txt para que sea INERTE - nginx no lo ejecuta,
          # solo se lee. No sustituye al resolver de produccion ni cambia comportamiento.
          SRC="IPTV_v5.4_MAX_AGGRESSION/backend/resolve_quality_unified.php"
          DEST="/var/www/html/prisma/api/_resolver-source.php.txt"
          echo "=== fuente del resolver (solo lectura) ==="
          scp -q "$SRC" "$TARGET:/tmp/ape-resolver-src"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-resolver-src '$DEST'"
          REMOTO=$(ssh "$TARGET" "sudo -n sha256sum '$DEST' | cut -d' ' -f1")
          LOCAL=$(sha256sum "$SRC" | cut -d' ' -f1)
          if [ "$REMOTO" != "$LOCAL" ]; then
            echo "::error::sha de la fuente del resolver no coincide"; exit 1
          fi
          echo "  sha OK ($LOCAL)"
          APE=$(ssh "$TARGET" "sudo -n grep -c '#EXT-X-APE-' '$DEST' || true")
          echo "  lineas con #EXT-X-APE-: $APE"

      - name: Gate anti pisado de variable de estado
        # Dos veces seguidas (a2a798a2, dc983153) el nivel de realce salio 0 en produccion
        # porque una asignacion posterior borraba el calculo. php -l no lo ve: la sintaxis es
        # valida y el programa corre. Este gate lee el codigo y falla ANTES de desplegar.
        run: |
          set -uo pipefail
          echo '=== url2-cartridge.php: ninguna variable de decision puede pisarse ==='
          node tools/check_single_assignment.js IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/url2-cartridge.php
          echo '=== canary-resolve: idem si existe ==='
          if [ -f IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/canary-resolve.php ]; then
            node tools/check_single_assignment.js IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/canary-resolve.php
          else
            echo '  (no existe, se omite)'
          fi

      - name: Instalar PHP (para php -l)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Desplegar endpoints PHP (paridad + url2 dinamico)
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)   # cada run: es un shell distinto
          SRC="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/ape-parity-tags.php"
          # url2-cartridge.php: el cartucho dinamico por device. Se valida con php -l antes
          # de instalar; si el lint falla NO se despliega (mejor un 500 claro que un PHP roto).
          SRC2="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/url2-cartridge.php"
          DEST2="/var/www/html/prisma/api/url2-cartridge.php"
          echo "=== url2-cartridge.php (lint) ==="
          php -l "$SRC2" || { echo "::error::url2-cartridge.php no pasa php -l"; exit 1; }
          if ssh "$TARGET" "sudo -n test -f '$DEST2'"; then
            ssh "$TARGET" "sudo -n cp -a '$DEST2' '$DEST2.bak_$STAMP'"
            echo "  backup: $DEST2.bak_$STAMP"
          fi
          # qoe-peek.php: ventana de lectura para la prueba de zapping en vivo.
          SRC4="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/qoe-peek.php"
          DEST4="/var/www/html/prisma/api/qoe-peek.php"
          echo "=== qoe-peek.php (lint) ==="
          php -l "$SRC4" || { echo "::error::qoe-peek.php no pasa php -l"; exit 1; }
          scp -q "$SRC4" "$TARGET:/tmp/ape-qoe-peek.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-qoe-peek.php '$DEST4'"
          R4=$(ssh "$TARGET" "sudo -n sha256sum '$DEST4' | cut -d' ' -f1")
          L4=$(sha256sum "$SRC4" | cut -d' ' -f1)
          if [ "$R4" != "$L4" ]; then echo "::error::sha de qoe-peek no coincide"; exit 1; fi
          echo "  qoe-peek OK ($L4)"

          # ape-last.php: devuelve que cartucho se sirvio, para leerlo con un curl.
          # No expone URLs de canal (solo id, nombre, perfil, nivel, bps, seed).
          SRC5="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/ape-last.php"
          DEST5="/var/www/html/prisma/api/ape-last.php"
          php -l "$SRC5" || { echo "::error::ape-last.php no pasa php -l"; exit 1; }
          # qoe-flush.php: escribe qoe-last-flush.json (via 2 del realce). NUNCA estuvo en el
          # workflow, asi que el cambio que publica el JSON jamas llego a produccion.
          SRC6="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/qoe-flush.php"
          DEST6="/var/www/html/prisma/api/qoe-flush.php"
          if [ -f "$SRC6" ]; then
            php -l "$SRC6" || { echo "::error::qoe-flush.php no pasa php -l"; exit 1; }
            if ssh "$TARGET" "sudo -n test -f '$DEST6'"; then
              ssh "$TARGET" "sudo -n cp -a '$DEST6' '$DEST6.bak_$STAMP'"
            fi
            scp -q "$SRC6" "$TARGET:/tmp/ape-qoe-flush.php"
            ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-qoe-flush.php '$DEST6'"
            echo "  qoe-flush instalado"
          fi

          scp -q "$SRC5" "$TARGET:/tmp/ape-last.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-last.php '$DEST5'"
          # garantir que www-data puede escribir el registro
          ssh "$TARGET" "sudo -n mkdir -p /var/cache/ara && sudo -n chown -R www-data:www-data /var/cache/ara && sudo -n chmod 775 /var/cache/ara"
          echo "  ape-last instalado"

          scp -q "$SRC2" "$TARGET:/tmp/ape-url2-cart.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-url2-cart.php '$DEST2'"
          R2=$(ssh "$TARGET" "sudo -n sha256sum '$DEST2' | cut -d' ' -f1")
          L2=$(sha256sum "$SRC2" | cut -d' ' -f1)
          if [ "$R2" != "$L2" ]; then echo "::error::sha de url2-cartridge no coincide"; exit 1; fi
          echo "  sha OK ($L2)"

          # ── pulse.php: clasificador multifacetico del upstream ───────────────────────
          # MOTIVO: pulse.php estaba en tools/cicd/vps_deploy_map.json pero NINGUN workflow
          # lo desplegaba, asi que los arreglos del proxy de canal (incluido el
          # "Loaded playlist has unexpected type") no llegaban nunca a produccion.
          # Es el fichero mas critico de esta lista: si el proxy de canal se rompe, no se ve
          # nada. Por eso: php -l + backup + sha verificada + smoke REAL + rollback automatico.
          SRC7="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/pulse.php"
          DEST7="/var/www/html/prisma/api/pulse.php"
          BAK7="$DEST7.bak_$STAMP"
          echo "=== pulse.php (lint) ==="
          php -l "$SRC7" || { echo "::error::pulse.php no pasa php -l"; exit 1; }
          if ssh "$TARGET" "sudo -n test -f '$DEST7'"; then
            ssh "$TARGET" "sudo -n cp -a '$DEST7' '$BAK7'"
            echo "  backup: $BAK7"
          fi
          scp -q "$SRC7" "$TARGET:/tmp/ape-pulse.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-pulse.php '$DEST7'"
          R7=$(ssh "$TARGET" "sudo -n sha256sum '$DEST7' | cut -d' ' -f1")
          L7=$(sha256sum "$SRC7" | cut -d' ' -f1)
          if [ "$R7" != "$L7" ]; then echo "::error::sha de pulse.php no coincide"; exit 1; fi
          echo "  pulse OK ($L7)"

          # SMOKE A (positivo, independiente del proveedor): master publico -> el proxy debe
          # resolver la mejor variante y devolver MEDIA playlist. Prueba master->media.
          # SMOKE B (negativo): upstream inexistente -> 502 JSON que CONSTRUYE el clasificador
          # nuevo. Si no aparece "format", el fichero instalado NO es el nuevo.
          sleep 2
          SHA_MASTER="https%3A%2F%2Fstorage.googleapis.com%2Fshaka-demo-assets%2Fbbb-dark-truths-hls%2Fhls.m3u8"
          SM_A_FILE=$(mktemp)
          SM_B_FILE=$(mktemp)
          SM_A_STATUS=$(curl -sS --max-time 15 -o "$SM_A_FILE" -w '%{http_code}' "https://iptv-ape.duckdns.org/pulse/9001.m3u8?u=$SHA_MASTER&p=P0&id=9001&m=proxy" || true)
          SM_B_STATUS=$(curl -sS --max-time 15 -o "$SM_B_FILE" -w '%{http_code}' "https://iptv-ape.duckdns.org/pulse/9002.m3u8?u=http%3A%2F%2Fupstream.invalid%2Fx.m3u8&p=P0&id=9002&m=proxy" || true)
          SM_A=$(cat "$SM_A_FILE")
          SM_B=$(cat "$SM_B_FILE")
          rm -f "$SM_A_FILE" "$SM_B_FILE"
          OK_A=0; OK_B=0
          # Todas las condiciones son obligatorias: un master tambien empieza por EXTM3U.
          if [ "$SM_A_STATUS" = "200" ] \
            && [[ "$SM_A" == '#EXTM3U'$'\n'* || "$SM_A" == '#EXTM3U'$'\r\n'* ]] \
            && grep -Eq '^#EXT-X-TARGETDURATION:[1-9][0-9]*[[:space:]]*$' <<< "$SM_A" \
            && grep -Eq '^#EXTINF:[0-9]+([.][0-9]+)?,' <<< "$SM_A" \
            && grep -Eq '^[^#[:space:]][^[:space:]]*[[:space:]]*$' <<< "$SM_A" \
            && ! grep -Eq '^#EXT-X-(STREAM-INF|I-FRAME-STREAM-INF):' <<< "$SM_A"; then
            OK_A=1
          fi
          if [ "$SM_B_STATUS" = "502" ] \
            && python3 -c 'import json,sys; p=json.load(sys.stdin); sys.exit(not (isinstance(p,dict) and p.get("ok") is False and isinstance(p.get("format"),str)))' <<< "$SM_B" 2>/dev/null; then
            OK_B=1
          fi
          echo "  SMOKE A (master publico -> media): OK_A=$OK_A"
          echo "  SMOKE B (502 con clasificacion):   OK_B=$OK_B"
          echo "  SMOKE B body: $SM_B"
          if [ "$OK_A" != "1" ] || [ "$OK_B" != "1" ]; then
            echo "::error::smoke de pulse.php fallo — restaurando backup"
            if ssh "$TARGET" "sudo -n test -f '$BAK7'"; then
              ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data '$BAK7' '$DEST7'"
              echo "  ROLLBACK aplicado desde $BAK7"
            fi
            exit 1
          fi
          echo "  smoke OK: media 200 + clasificador nuevo visible en el 502"

          # ── index-v4.html: cache-buster ?v= ──────────────────────────────────────────
          # MOTIVO: generation-output-panel.js y generation-controller.js cambiaron el
          # 2026-11-06 pero su ?v= seguia en 20261103 / 20261105. Con ?v= viejo el navegador
          # del operador ejecuta el panel ANTERIOR (el del doble disparo) aunque el disco
          # tenga el nuevo. Ningun workflow desplegaba el indice: se tocaba a mano.
          SRC8="IPTV_v5.4_MAX_AGGRESSION/frontend/index-v4.html"
          DEST8="/var/www/html/index-v4.html"
          BAK8="$DEST8.bak_$STAMP"
          if ssh "$TARGET" "sudo -n test -f '$DEST8'"; then
            ssh "$TARGET" "sudo -n cp -a '$DEST8' '$BAK8'"
            echo "  backup index: $BAK8"
          fi
          scp -q "$SRC8" "$TARGET:/tmp/ape-index.html"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-index.html '$DEST8'"
          R8=$(ssh "$TARGET" "sudo -n sha256sum '$DEST8' | cut -d' ' -f1")
          L8=$(sha256sum "$SRC8" | cut -d' ' -f1)
          if [ "$R8" != "$L8" ]; then echo "::error::sha de index-v4 no coincide"; exit 1; fi
          echo "  index OK ($L8)"
          # El hash se calcula sobre el archivo HTTP: command substitution perderia
          # los saltos de linea finales y no permitiria comparar bytes con el repo.
          IDX_FILE=$(mktemp)
          IDX_STATUS=$(curl -sS --max-time 25 -o "$IDX_FILE" -w '%{http_code}' "https://iptv-ape.duckdns.org/index-v4.html" || true)
          OK_I=0
          if [ "$IDX_STATUS" = "200" ] \
            && grep -Fq 'generation-output-panel.js?v=' "$IDX_FILE" \
            && grep -Fq 'generation-controller.js?v=' "$IDX_FILE" \
            && grep -Fq '</html>' "$IDX_FILE" \
            && [ "$(sha256sum "$IDX_FILE" | cut -d' ' -f1)" = "$L8" ]; then
            OK_I=1
          fi
          rm -f "$IDX_FILE"
          echo "  SMOKE index (HTTP 200, scripts y sha del repo): OK_I=$OK_I"
          if [ "$OK_I" != "1" ]; then
            echo "::error::el index servido no coincide con el repo o esta incompleto — restaurando"
            if ssh "$TARGET" "sudo -n test -f '$BAK8'"; then
              ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data '$BAK8' '$DEST8'"
              echo "  ROLLBACK index desde $BAK8"
            fi
            exit 1
          fi
          DEST="/var/www/html/prisma/api/ape-parity-tags.php"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "=== ape-parity-tags.php ==="
          ssh "$TARGET" "sudo -n mkdir -p /var/www/html/prisma/api"
          if ssh "$TARGET" "sudo -n test -f '$DEST'"; then
            ssh "$TARGET" "sudo -n cp -a '$DEST' '$DEST.bak_$STAMP'"
            echo "  backup: $DEST.bak_$STAMP"
          fi
          scp -q "$SRC" "$TARGET:/tmp/ape-parity-tags.php"
          if ! ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-parity-tags.php '$DEST'"; then
            echo "::error::fallo la instalacion del endpoint de paridad"; exit 1
          fi
          REMOTO=$(ssh "$TARGET" "sudo -n sha256sum '$DEST' | cut -d' ' -f1")
          LOCAL=$(sha256sum "$SRC" | cut -d' ' -f1)
          if [ "$REMOTO" != "$LOCAL" ]; then
            echo "::error::sha del endpoint de paridad no coincide"; exit 1
          fi
          echo "  sha OK ($LOCAL)"
          php -l "$SRC" >/dev/null 2>&1 && echo "  php -l OK" || echo "  (php -l no disponible en el runner)"
          echo "  endpoint: https://iptv-ape.duckdns.org/prisma/api/ape-parity-tags.php"

      - name: Desplegar la matriz de calidad por device (lib + cli)
        # Las 3 directivas (AISR / AIPQ / MEMC) homologadas por SoC viven en lib/. El CLI
        # push_pq_profile.php las consume con fallback: si el SoC no se reconoce, sigue
        # usando el perfil anterior. Riesgo contenido a proposito:
        #   - php -l de los DOS ficheros antes de instalar; si uno falla, no se toca nada
        #   - backup del destino con stamp antes de sobrescribir
        #   - lectura posterior del hash para confirmar que quedo lo que se subio
        #   - el CLI no lo llama nada del pipeline: es una herramienta manual, sin trafico
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          LIB_SRC="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/lib/ape_device_quality.php"
          LIB_DST="/var/www/html/prisma/lib/ape_device_quality.php"
          CLI_SRC="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/cli/push_pq_profile.php"
          CLI_DST="/var/www/html/prisma/cli/push_pq_profile.php"
          echo "=== lint de los dos ficheros ==="
          php -l "$LIB_SRC" || { echo "::error::ape_device_quality.php no pasa php -l"; exit 1; }
          php -l "$CLI_SRC" || { echo "::error::push_pq_profile.php no pasa php -l"; exit 1; }
          echo "=== backup previo ==="
          ssh "$TARGET" "sudo -n cp -a '$LIB_DST' '$LIB_DST.bak_$STAMP' 2>/dev/null && echo '  backup lib ok' || echo '  lib no existia'"
          ssh "$TARGET" "sudo -n cp -a '$CLI_DST' '$CLI_DST.bak_$STAMP' 2>/dev/null && echo '  backup cli ok' || echo '  cli no existia'"
          echo "=== instalacion ==="
          scp -q "$LIB_SRC" "$TARGET:/tmp/ape-adeq.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-adeq.php '$LIB_DST'"
          scp -q "$CLI_SRC" "$TARGET:/tmp/ape-ppq.php"
          ssh "$TARGET" "sudo -n install -m 0644 -o www-data -g www-data /tmp/ape-ppq.php '$CLI_DST'"
          echo "=== verificacion de lo instalado ==="
          L1=$(sha256sum "$LIB_SRC" | cut -d' ' -f1)
          R1=$(ssh "$TARGET" "sudo -n sha256sum '$LIB_DST' | cut -d' ' -f1")
          [ "$L1" = "$R1" ] && echo "  lib sha OK ($L1)" || { echo "::error::sha lib no coincide"; exit 1; }
          L2=$(sha256sum "$CLI_SRC" | cut -d' ' -f1)
          R2=$(ssh "$TARGET" "sudo -n sha256sum '$CLI_DST' | cut -d' ' -f1")
          [ "$L2" = "$R2" ] && echo "  cli sha OK ($L2)" || { echo "::error::sha cli no coincide"; exit 1; }
          echo "  el CLI NO se ejecuta aqui: es manual y sin trafico."

      - name: Desplegar el sincronizador de calidad (CLI + timer)
        # Conecta el heartbeat del ARA con la matriz homologada. Riesgo contenido:
        #   - el CLI es NUEVO: no modifica endpoints, ni el SSE, ni ape_mesh.php
        #   - la PRIMERA ejecucion de este deploy es con --dry: si el dry falla, el timer
        #     no se habilita y no se escribe ni un delta
        #   - el timer solo arranca si el dry devuelve exit 0
        #   - desactivarlo es `systemctl disable --now ape-quality-sync.timer`
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          CLI_SRC="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/cli/ape-quality-sync.php"
          CLI_DST="/var/www/html/prisma/cli/ape-quality-sync.php"
          SVC_SRC="IPTV_v5.4_MAX_AGGRESSION/vps/systemd/ape-quality-sync.service"
          TMR_SRC="IPTV_v5.4_MAX_AGGRESSION/vps/systemd/ape-quality-sync.timer"
          echo "=== lint ==="
          php -l "$CLI_SRC" || { echo "::error::ape-quality-sync.php no pasa php -l"; exit 1; }
          echo "=== instalacion del CLI ==="
          ssh "$TARGET" "sudo -n cp -a '$CLI_DST' '$CLI_DST.bak_$STAMP' 2>/dev/null && echo '  backup cli ok' || echo '  cli no existia'"
          scp -q "$CLI_SRC" "$TARGET:/tmp/ape-qsync.php"
          ssh "$TARGET" "sudo -n install -m 0755 -o www-data -g www-data /tmp/ape-qsync.php '$CLI_DST'"
          LC=$(sha256sum "$CLI_SRC" | cut -d' ' -f1)
          RC=$(ssh "$TARGET" "sudo -n sha256sum '$CLI_DST' | cut -d' ' -f1")
          [ "$LC" = "$RC" ] && echo "  cli sha OK ($LC)" || { echo "::error::sha cli no coincide"; exit 1; }
          echo "=== DRY RUN antes de habilitar nada ==="
          ssh "$TARGET" "sudo -n -u www-data php '$CLI_DST' --dry"
          DRY=$?
          if [ "$DRY" -ne 0 ]; then
            echo "::error::el dry run fallo (exit $DRY) — NO se habilita el timer"
            exit 1
          fi
          echo "  dry OK: no se habilita nada que no haya pasado el dry"
          echo "=== unidades systemd ==="
          scp -q "$SVC_SRC" "$TARGET:/tmp/ape-qsync.service"
          scp -q "$TMR_SRC" "$TARGET:/tmp/ape-qsync.timer"
          ssh "$TARGET" "sudo -n install -m 0644 -o root -g root /tmp/ape-qsync.service /etc/systemd/system/ape-quality-sync.service"
          ssh "$TARGET" "sudo -n install -m 0644 -o root -g root /tmp/ape-qsync.timer /etc/systemd/system/ape-quality-sync.timer"
          ssh "$TARGET" "sudo -n systemctl daemon-reload"
          ssh "$TARGET" "sudo -n systemctl enable ape-quality-sync.timer"
          echo "  timer habilitado (arranca en <=5 min)"
          ssh "$TARGET" "systemctl list-timers ape-quality-sync.timer --no-pager 2>/dev/null | head -3"

      - name: Desplegar ape_mesh.php (amazon levers) con rollback automatico
        # EL FICHERO MAS DELICADO DEL DESPLIEGUE. 45 KB compartidos por seis endpoints:
        # url2-cartridge, ape-parity-tags, ape-last, qoe-flush, events-sse, feedforward.
        # Un error de sintaxis los tumba TODOS. Por eso esta secuencia y no otra:
        #   1. php -l en el runner ANTES de tocar nada
        #   2. backup con stamp en /var/backups/ape-deploy/
        #   3. install
        #   4. php -l EN EL DESTINO (no basta el del runner)
        #   5. curl a los SEIS endpoints: si cualquiera no da 200 y no es 403, RESTORE
        #   6. el restore usa el backup de ESTE step, no uno viejo
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SRC="IPTV_v5.4_MAX_AGGRESSION/vps/prisma/lib/ape_mesh.php"
          DST="/var/www/html/prisma/lib/ape_mesh.php"
          BK="/var/backups/ape-deploy/$STAMP"
          echo "=== 1. lint en el runner ==="
          php -l "$SRC" || { echo "::error::ape_mesh.php no pasa php -l en el runner"; exit 1; }
          echo "=== 2. backup en el VPS ==="
          ssh "$TARGET" "sudo -n mkdir -p '$BK' && sudo -n cp -a '$DST' '$BK/ape_mesh.php' && echo '  backup: $BK/ape_mesh.php'"
          HASH_ANTES=$(ssh "$TARGET" "sudo -n sha256sum '$DST' | head -c 64")
          echo "  hash antes: $HASH_ANTES"
          echo "=== 3. install ==="
          scp -q "$SRC" "$TARGET:/tmp/ape-mesh-new.php" || { echo "::error::scp fallo"; exit 1; }
          ssh "$TARGET" "sudo -n install -m 0644 -o root -g root /tmp/ape-mesh-new.php '$DST'" || { echo "::error::install fallo"; exit 1; }
          echo "=== 4. lint en el DESTINO ==="
          if ! ssh "$TARGET" "php -l '$DST'" ; then
            echo "::error::el fichero instalado NO compila — RESTAURANDO"
            ssh "$TARGET" "sudo -n cp -a '$BK/ape_mesh.php' '$DST'"
            exit 1
          fi
          echo "=== 5. los SEIS endpoints ==="
          FALLO=0
          U="http%3A%2F%2Fline.tivi-ott.net%2Flive%2F3JHFTC%2FU56BDP%2F3.m3u8"
          for E in "url2-cartridge.php?u=$U&p=P3&n=T&id=3" "ape-parity-tags.php" "ape-last.php" "qoe-flush.php" "ape-feedforward-stream.php?device=probe&iv=3&dur=1" "qoe-peek.php"; do
            N="${E%%\?*}"
            C=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://iptv-ape.duckdns.org/prisma/api/$E" || echo "000")
            echo "  $N -> HTTP $C"
            # 403 es correcto para qoe-peek (sin token). 000 = no responde = roto.
            if [ "$C" != "200" ] && [ "$C" != "403" ]; then FALLO=1; fi
          done
          if [ "$FALLO" -ne 0 ]; then
            echo "::error::un endpoint no responde — RESTAURANDO ape_mesh.php"
            ssh "$TARGET" "sudo -n cp -a '$BK/ape_mesh.php' '$DST'"
            ssh "$TARGET" "php -l '$DST'"
            echo "  restaurado. La rama queda como antes de este step."
            exit 1
          fi
          HASH_DESPUES=$(ssh "$TARGET" "sudo -n sha256sum '$DST' | head -c 64")
          LHASH=$(sha256sum "$SRC" | head -c 64)
          echo "=== 6. veredicto ==="
          [ "$HASH_DESPUES" = "$LHASH" ] && echo "  sha OK ($LHASH)" || { echo "::error::sha no coincide — RESTAURANDO"; ssh "$TARGET" "sudo -n cp -a '$BK/ape_mesh.php' '$DST'"; exit 1; }
          echo "  los seis endpoints responden y el fichero compila."
          echo "  rollback manual: ssh TARGET sudo cp -a $BK/ape_mesh.php $DST"

      - name: Activar el puente de deltas (APE_4K_BRIDGE_ENABLED=1)
        # El feedforward emitia solo 3 device_settings porque este flag estaba OFF (default seguro).
        # Con el encendido, ape_ff_device_settings_from_delta() suma el ultimo delta del VPS -
        # que ya incluye los 6 levers de Amazon - sobre los 3 base, con dedup por clave.
        # Reversible: quitar la linea de www.conf y recargar fpm. Vuelve a 3.
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          CONF=/etc/php/8.3/fpm/pool.d/www.conf
          echo "=== backup de www.conf ==="
          ssh "$TARGET" "sudo -n cp -a '$CONF' '$CONF.bak_$STAMP' && echo '  backup: $CONF.bak_$STAMP'"
          echo "=== ya esta el flag? ==="
          TIENE=$(ssh "$TARGET" "grep -c APE_4K_BRIDGE_ENABLED '$CONF' || true")
          if [ "$TIENE" = "0" ]; then
            echo "  añadiendo env[APE_4K_BRIDGE_ENABLED] = 1"
            ssh "$TARGET" "echo 'env[APE_4K_BRIDGE_ENABLED] = 1' | sudo -n tee -a '$CONF' >/dev/null"
          else
            echo "  ya presente, no se duplica"
          fi
          echo "=== php-fpm -t y reload ==="
          ssh "$TARGET" "sudo -n php-fpm8.3 -t" || { echo "::error::la config de fpm no valida — restaurando"; ssh "$TARGET" "sudo -n cp -a '$CONF.bak_$STAMP' '$CONF'"; exit 1; }
          ssh "$TARGET" "sudo -n systemctl reload php8.3-fpm"
          sleep 4
          echo "=== el feedforward ahora emite mas de 3? ==="
          N=$(curl -sS --max-time 15 "https://iptv-ape.duckdns.org/prisma/api/ape-feedforward-stream.php?device=firestick-cali&iv=3&dur=2" | grep -o "device_settings" | wc -l)
          echo "  bloques con device_settings: $N"
          if [ "$N" -lt 1 ]; then
            echo "::error::el feedforward no responde — restaurando el flag"
            ssh "$TARGET" "sudo -n cp -a '$CONF.bak_$STAMP' '$CONF' && sudo -n systemctl reload php8.3-fpm"
            exit 1
          fi
          echo "  puente activo."

      - name: Leer registro de zapping
        # Minimal a proposito: un solo comando por bloque, sin pipes que puedan enmascarar
        # la salida. Si algo no existe, se ve el error tal cual.
        run: |
          set +e
          echo '=== /var/cache/ara ==='
          ssh "$TARGET" 'ls -la /var/cache/ara/ 2>&1'
          echo '=== ape-last-served.json ==='
          ssh "$TARGET" 'cat /var/cache/ara/ape-last-served.json 2>&1'
          echo ''
          echo '=== historial (ultimas 10) ==='
          ssh "$TARGET" 'tail -10 /var/cache/ara/ape-served-history.jsonl 2>&1'
          echo '=== qoe-last-flush.json ==='
          ssh "$TARGET" 'cat /var/cache/ara/qoe-last-flush.json 2>&1'
          echo ''
          echo '=== cola de wake ==='
          ssh "$TARGET" 'ls -la /dev/shm/ape_wake_queue 2>&1; tail -5 /dev/shm/ape_wake_queue 2>&1'

      - name: Limpiar endpoints retirados del VPS
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          # El deploy COPIA ficheros; no borra los que salieron del repo. Un endpoint retirado
          # se queda huerfano en el VPS y responde 500 si alguien lo llama. Esta lista los borra.
          # Solo rutas explicitas: nunca globs, para no tocar nada que no este declarado.
          for f in \
            /var/www/html/prisma/api/canary-resolve.php \
            ; do
            if ssh "$TARGET" "sudo -n test -f '$f'"; then
              ssh "$TARGET" "sudo -n rm -f '$f'" && echo "  retirado: $f" || echo "  no se pudo retirar: $f"
            fi
          done
          echo "  limpieza completada"

      - name: Verificar lo que sirve HTTP (contenido, no solo tamano)
        run: |
          set -uo pipefail
          sleep 3
          ok=1
          for f in $FICHEROS; do
            SAFE_F=${f//\//_}
            curl -f -sS -o "/tmp/s-$SAFE_F" -w "  $f http=%{http_code} bytes=%{size_download}\n" \
              "https://iptv-ape.duckdns.org/$f" || ok=0
            L=$(sha256sum "$SRC_DIR/$f" | cut -d' ' -f1)
            R=$(sha256sum "/tmp/s-$SAFE_F" | cut -d' ' -f1)
            echo "    local=$L"
            echo "    servido=$R"
            [ "$L" = "$R" ] || { echo "::error::lo servido de $f no es el fichero del repo"; ok=0; }
          done
          # Las correcciones y los defectos solo se buscan en el generador; el panel no los lleva.
          G=/tmp/s-js_ape-v9_m3u8-typed-arrays-ultimate.js
          echo '--- el generador servido TIENE las correcciones ---'
          # [ACTUALIZADO 2026-11-05] El generador migro de `colorspace=iall=bt709` a
          # `tools/ape-image-recipes/recipes.json`, donde el color y el escalado viven en
          # `zscale=` y la honestidad de VLC en `vlc_skipped`. Se exige el equivalente real,
          # no el literal viejo: el gate sigue protegiendo lo mismo con el codigo de hoy.
          for p in 'zscale=w=' 'strength=0.51' 'scale=w=3840:h=2160:flags=lanczos' 'vlc_skipped'; do
            n=$(grep -c -- "$p" "$G" || true); echo "  $p = $n"
            [ "$n" -gt 0 ] || { echo "::error::lo servido no tiene '$p'"; ok=0; }
          done
          echo '--- el generador servido NO tiene los defectos en codigo ---'
          for p in 'pp=ac/dr/ci' ':scd=5' 'zscale=transfer=bt1886'; do
            n=$(grep -v -E '^\s*(//|\*|#)' "$G" | grep -c -- "$p" || true); echo "  $p = $n"
            [ "$n" -eq 0 ] || { echo "::error::lo servido aun tiene '$p'"; ok=0; }
          done
          # El guard del delta: debe preguntar por el SUELO, no solo por el techo.
          P=/tmp/s-js_ape-v9_generation-output-panel.js
          echo '--- el panel servido lleva el guard corregido ---'
          grep -q 'activeFloorMbps' "$P" || { echo '::error::el panel servido no tiene activeFloorMbps'; ok=0; }
          grep -q 'canStart' "$P" || { echo '::error::el panel servido no distingue canStart'; ok=0; }
          # El bloqueo debe ofrecer auto-ajuste con la teoria despejada, no solo negarse.
          grep -q 'sugerirAjuste'    "$P" || { echo '::error::el panel servido no tiene sugerirAjuste'; ok=0; }
          grep -q 'ape-buf-sugerencia' "$P" || { echo '::error::el panel servido no tiene el bloque de sugerencia'; ok=0; }
          grep -q 'deltaMax'         "$P" || { echo '::error::el panel servido no calcula deltaMax'; ok=0; }
          grep -q 'ape-sug-aprobar'  "$P" || { echo '::error::el panel servido no ofrece aprobar'; ok=0; }
          grep -q 'ape-sug-denegar'  "$P" || { echo '::error::el panel servido no ofrece denegar'; ok=0; }
          grep -q 'ape-sug-forzar'   "$P" || { echo '::error::el panel servido no ofrece forzar'; ok=0; }
          grep -q 'mejorEscenario'   "$P" || { echo '::error::el panel servido no tiene mejorEscenario'; ok=0; }
          # El config debe poblar el suelo desde el LAB: sin esto el panel vuelve a la tabla de respaldo.
          C=/tmp/s-js_ape-v9_ape-profiles-config.js
          echo '--- el config servido puebla bandwidth_floor ---'
          grep -q '_ensureBandwidthFloor' "$C" || { echo '::error::el config servido no tiene _ensureBandwidthFloor'; ok=0; }
          grep -q 'bandwidth_floor' "$C" || { echo '::error::el config servido no menciona bandwidth_floor'; ok=0; }
          # El gestor de perfiles no puede volver a recortar el piso contra un bitrate roto.
          M=/tmp/s-js_ape-v9_profile-manager-v9.js
          echo '--- el gestor servido no recorta contra bitrate absurdo ---'
          grep -q 'bitrateUtil' "$M" || { echo '::error::el gestor servido no tiene bitrateUtil'; ok=0; }
          grep -q 'Nunca 0,24' "$M" || { echo '::error::el gestor servido no tiene la correccion del 0,24'; ok=0; }
          [ "$ok" = '1' ] || exit 1
          echo 'LO SERVIDO ES EL FICHERO DEL REPO Y LLEVA LAS CORRECCIONES'

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # PLANO DE CONTROL DE DISPOSITIVOS
  #
  # Publica el endpoint + el worker ADB + su unidad systemd + el manifiesto de version corregido.
  # Permite reconocer e instalar/actualizar/reinstalar/desinstalar ONN 4K, Fire TV Stick 4K y
  # CUALQUIER otro Android desde la UI.
  #
  # POR QUE ES UN JOB APARTE: no toca los ficheros de la APP. Si el plano de control falla, el
  # despliegue del generador ya esta hecho y no se revierte por un fallo ajeno.
  #
  # POR QUE EL WORKER ES ROOT: la clave RSA que los dispositivos ya autorizaron es
  # /root/.android/adbkey. www-data tiene otra y su "allow debugging" no la cubre.
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  plano-control-dispositivos:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    needs: desplegar

    env:
      EP_SRC: IPTV_v5.4_MAX_AGGRESSION/vps/prisma/api/ara-device.php
      EP_DEST: /var/www/html/prisma/api/ara-device.php
      WK_SRC: IPTV_v5.4_MAX_AGGRESSION/vps/prisma/adb/ara-device-worker.sh
      WK_DEST: /opt/prisma-adb/ara-device-worker.sh
      SV_SRC: IPTV_v5.4_MAX_AGGRESSION/vps/prisma/adb/ara-device-worker.service
      SV_DEST: /etc/systemd/system/ara-device-worker.service
      VJ_SRC: IPTV_v5.4_MAX_AGGRESSION/vps/ara/version.json
      VJ_DEST: /var/www/html/ara/version.json
      GATE_SRC: tools/ara/check_ara_dist_coherence.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 300s\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n  ConnectTimeout 20\n  TCPKeepAlive yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: Exigir la confirmacion literal
        if: inputs.mode == 'apply'
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_CONFIRMATION" != "DESPLIEGO EL GENERADOR AL VPS" ]; then
            echo '::error::falta la confirmacion literal. No se escribe nada.'
            printf '  recibido: %s\n' "$DEPLOY_CONFIRMATION"
            exit 1
          fi
          echo 'confirmacion literal presente'

      - name: GATES de sintaxis EN EL VPS antes de tocar nada
        run: |
          set -uo pipefail
          # Se valida con el toolchain REAL del destino (PHP 8.3.6 / bash / node 20),
          # no con el del runner: un `php -l` verde en otra version no prueba nada.
          # OJO: el origen es el fichero del REPO y el destino es el VPS. NO existe
          # copia local en /tmp del runner — confundir ambos lados produjo un falso
          # "sha no coincide" el 2026-11-07 que disparo el rollback sin motivo.
          fail=0
          for pair in "$EP_SRC:/tmp/ara-device.php.new" \
                      "$WK_SRC:/tmp/ara-device-worker.sh.new" \
                      "$SV_SRC:/tmp/ara-device-worker.service.new" \
                      "$VJ_SRC:/tmp/ara-version.json.new" \
                      "$GATE_SRC:/tmp/check_ara_dist_coherence.js"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            if scp -q "$src" "$TARGET:$dst"; then
              echo "  copiado  $src -> $dst"
            else
              echo "::error::no se pudo copiar $src al VPS"
              fail=1
            fi
          done

          echo '--- php -l ---'
          ssh "$TARGET" "php -l /tmp/ara-device.php.new" || fail=1
          echo '--- bash -n ---'
          ssh "$TARGET" "bash -n /tmp/ara-device-worker.sh.new && echo BASH_SYNTAX_OK" || fail=1
          echo '--- JSON del manifiesto ---'
          ssh "$TARGET" "node -e 'JSON.parse(require(\"fs\").readFileSync(\"/tmp/ara-version.json.new\",\"utf8\"));console.log(\"JSON_OK\")'" || fail=1

          if [ "$fail" != '0' ]; then
            echo '::error::alguna validacion de sintaxis fallo. NO se despliega nada.'
            ssh "$TARGET" 'rm -f /tmp/ara-device.php.new /tmp/ara-device-worker.sh.new /tmp/ara-device-worker.service.new /tmp/ara-version.json.new /tmp/check_ara_dist_coherence.js' || true
            exit 1
          fi
          echo 'GATES DE SINTAXIS OK'

      - name: Desplegar el plano de control (rollback automatico)
        if: inputs.mode == 'apply'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)

          # install_one <local_src_repo> <remote_tmp_vps> <dest> <perm> <owner> <label>
          # El sha local se calcula sobre el fichero del REPO; el remoto sobre el
          # fichero ya instalado. Comparar dos espacios distintos fue el bug previo.
          install_one() {
            local src="$1" rtmp="$2" dest="$3" perm="$4" owner="$5" label="$6" bak nuevo=0 rem loc
            bak="$dest.bak_$STAMP"
            echo "=== $label -> $dest ==="
            if ssh "$TARGET" "sudo -n test -f '$dest'"; then
              ssh "$TARGET" "sudo -n cp -a '$dest' '$bak'" || { echo "::error::backup fallo en $label"; return 1; }
              echo "  backup: $bak"
            else
              nuevo=1
              echo "  fichero NUEVO (el rollback lo borra)"
            fi
            if ! ssh "$TARGET" "sudo -n mkdir -p '$(dirname "$dest")' && sudo -n install -m $perm -o ${owner%%:*} -g ${owner##*:} '$rtmp' '$dest'"; then
              echo "::error::instalacion fallo en $label"
              if [ "$nuevo" = "1" ]; then ssh "$TARGET" "sudo -n rm -f '$dest'" || true; else ssh "$TARGET" "sudo -n cp -a '$bak' '$dest'" || true; fi
              return 1
            fi
            rem=$(ssh "$TARGET" "sudo -n sha256sum '$dest' | cut -d' ' -f1")
            loc=$(sha256sum "$src" | cut -d' ' -f1)
            if [ "$rem" != "$loc" ]; then
              echo "::error::sha instalado no coincide en $label (repo=$loc instalado=$rem)"
              if [ "$nuevo" = "1" ]; then ssh "$TARGET" "sudo -n rm -f '$dest'" || true; else ssh "$TARGET" "sudo -n cp -a '$bak' '$dest'" || true; fi
              return 1
            fi
            echo "  sha OK ($loc)"
            return 0
          }

          rc=0
          install_one "$EP_SRC" /tmp/ara-device.php.new          "$EP_DEST" 0644 "www-data:www-data" "endpoint PHP"   || rc=1
          install_one "$WK_SRC" /tmp/ara-device-worker.sh.new    "$WK_DEST" 0755 "root:root"         "worker ADB"     || rc=1
          install_one "$VJ_SRC" /tmp/ara-version.json.new        "$VJ_DEST" 0644 "www-data:www-data" "manifiesto"     || rc=1
          install_one "$SV_SRC" /tmp/ara-device-worker.service.new "$SV_DEST" 0644 "root:root"       "unidad systemd" || rc=1

          if [ "$rc" != '0' ]; then
            echo '::error::despliegue del plano de control fallo. Revisa los backups arriba.'
            exit 1
          fi
          echo 'FICHEROS DEL PLANO DE CONTROL INSTALADOS'

          # ── Servicio ────────────────────────────────────────────────────────────────────────
          echo '--- systemd ---'
          ssh "$TARGET" 'sudo -n systemctl daemon-reload'
          ssh "$TARGET" 'sudo -n systemctl enable ara-device-worker.service' || true
          # `restart` no `start`: en un redeploy el proceso viejo sigue con el codigo anterior.
          ssh "$TARGET" 'sudo -n systemctl restart ara-device-worker.service'
          sleep 4
          echo -n 'is-active: '
          ssh "$TARGET" 'sudo -n systemctl is-active ara-device-worker.service' || true
          ssh "$TARGET" 'sudo -n journalctl -u ara-device-worker -n 15 --no-pager' || true
          # El directorio de cola debe pertenecer a www-data o php-fpm no puede encolar.
          ssh "$TARGET" 'sudo -n chown www-data:www-data /dev/shm/ape_device_jobs 2>/dev/null; sudo -n chmod 0775 /dev/shm/ape_device_jobs 2>/dev/null; sudo -n ls -ld /dev/shm/ape_device_jobs' || true

          ssh "$TARGET" 'rm -f /tmp/ara-device.php.new /tmp/ara-device-worker.sh.new /tmp/ara-device-worker.service.new /tmp/ara-version.json.new' || true

      - name: Smoke real por HTTPS + coherencia del manifiesto
        run: |
          set -uo pipefail
          ok=1
          echo '--- /prisma/api/ara-device.php?action=version ---'
          curl -sS -m 15 -o /tmp/dv.json -w 'http=%{http_code}\n' \
            'https://iptv-ape.duckdns.org/prisma/api/ara-device.php?action=version' || ok=0
          cat /tmp/dv.json || true
          grep -q '"ok":true' /tmp/dv.json || { echo '::error::action=version no devuelve ok:true'; ok=0; }
          grep -q '"coherent":true' /tmp/dv.json || { echo '::error::el manifiesto NO es coherente con el APK servido'; ok=0; }

          echo '--- /prisma/api/ara-device.php?action=devices ---'
          curl -sS -m 15 -o /tmp/dd.json -w 'http=%{http_code}\n' \
            'https://iptv-ape.duckdns.org/prisma/api/ara-device.php?action=devices' || ok=0
          cat /tmp/dd.json || true
          grep -q '"ok":true' /tmp/dd.json || { echo '::error::action=devices no devuelve ok:true'; ok=0; }
          grep -q '"devices"' /tmp/dd.json || { echo '::error::action=devices no trae la lista'; ok=0; }

          echo '--- gate de coherencia contra el APK REAL del VPS ---'
          ssh "$TARGET" 'node /tmp/check_ara_dist_coherence.js --manifest /var/www/html/ara/version.json --apk /var/www/html/ara/agent.apk' || ok=0
          ssh "$TARGET" 'rm -f /tmp/check_ara_dist_coherence.js' || true

          echo '--- el index servido lleva el panel DISPOSITIVO ---'
          curl -sS -m 20 'https://iptv-ape.duckdns.org/index-v4.html' -o /tmp/idx.html || ok=0
          grep -q 'apeDeviceCard' /tmp/idx.html || { echo '::error::el index servido no tiene el panel DISPOSITIVO'; ok=0; }
          grep -q 'ara-device.php' /tmp/idx.html || { echo '::error::el index servido no apunta al endpoint'; ok=0; }

          [ "$ok" = '1' ] || { echo '::error::SMOKE DEL PLANO DE CONTROL FALLO'; exit 1; }
          echo 'PLANO DE CONTROL DESPLEGADO Y VERIFICADO EN VIVO'
