name: ape-detector-listas-rotas

# ─────────────────────────────────────────────────────────────────────────────────────────────
# DETECTOR E — invariante permanente: contenido registrado contra bytes servidos.
#
# POR QUÉ EXISTE: el 2026-11-03 `finalize_upload.php` dejó el `.m3u8` vivo en 8 bytes porque abre
# con fopen(..., 'wb') —que trunca— antes de saber si puede terminar. El `.gz` sano quedó 8,3 s
# anterior, así que nginx siguió sirviendo lo bueno y nadie lo notó hasta que se desactivó la
# compresión en vuelo.
#
# Este workflow SÓLO LEE. No repara, no escribe, no toca nginx.
#
# Hallazgo del primer barrido (2026-11-03): la tabla `registered_lists` NO EXISTE en el VPS y
# `/opt/netshield/data/ape_lists.db` tampoco. La base real es `/var/www/html/prisma/db/ape_lists.db`.
# Por eso el paso E.0 vuelca el esquema: el invariante necesita saber contra qué tabla medir.
# ─────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      db:
        description: 'Ruta de la base de registro'
        required: true
        default: '/var/www/html/prisma/db/ape_lists.db'
      lists_dir:
        description: 'Directorio de listas vivas'
        required: true
        default: '/var/www/html/lists'

jobs:
  detector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"
          echo "DB=${{ inputs.db }}" >> "$GITHUB_ENV"
          echo "LISTS=${{ inputs.lists_dir }}" >> "$GITHUB_ENV"

      - name: "E.0 - esquema real de la base"
        run: |
          set -uo pipefail
          echo '=== existe la base? ==='
          ssh "$TARGET" "sudo -n ls -la '$DB' 2>&1 || echo AUSENTE" || true
          echo
          echo '=== TABLAS ==='
          ssh "$TARGET" "sudo -n sqlite3 '$DB' '.tables' 2>&1 || echo SIN_TABLAS" || true
          echo
          echo '=== ESQUEMA ==='
          ssh "$TARGET" "sudo -n sqlite3 '$DB' '.schema' 2>&1 | head -60" || true
          echo
          echo '=== otras bases candidatas ==='
          ssh "$TARGET" "sudo -n find /opt /var/www -maxdepth 6 -name 'ape_*.db' 2>/dev/null | head -10" || true

      - name: "E.1 - la lista del incidente"
        run: |
          set -uo pipefail
          echo '=== tamano real en disco ==='
          ssh "$TARGET" "sudo -n stat -c '%n size=%s mtime=%y' '$LISTS/APE_LISTA_1793589060441.m3u8' '$LISTS/APE_LISTA_1793589060441.m3u8.gz' 2>&1" || true
          echo
          echo '=== ficheros del VPS que mencionan registros de listas ==='
          ssh "$TARGET" "sudo -n grep -RIl -E 'registered_lists|ape_lists' /var/www/html 2>/dev/null | head -10" || true

      - name: "E.2 - quien escribe el m3u8 vivo"
        run: |
          set -uo pipefail
          echo '=== finalize/upload instalados (tamano y fecha) ==='
          ssh "$TARGET" "sudo -n ls -la --time-style=full-iso /var/www/html/finalize_upload.php /var/www/html/upload.php 2>&1 || echo AUSENTES" || true
          echo
          echo '=== el wb del VPS: abre en escritura sin atomico? ==='
          ssh "$TARGET" "sudo -n grep -n \"fopen(\\\$outputPath\\|rename(\\|tmp\" /var/www/html/finalize_upload.php 2>&1 | head -12" || true

      - name: "E.3 - barrido: toda lista por debajo del suelo de 1 KB"
        run: |
          set -uo pipefail
          echo '=== listas .m3u8 en disco, con su tamano ==='
          ssh "$TARGET" "sudo -n find '$LISTS' -maxdepth 1 -name '*.m3u8' -printf '%s %p\n' 2>/dev/null | sort -n | head -20" || true
          echo
          echo '=== RESUMEN ==='
          ssh "$TARGET" "sudo -n sh -c 'tot=0; rot=0; for f in \"\$(find \"$LISTS\" -maxdepth 1 -name \"*.m3u8\" 2>/dev/null)\"; do tot=\$((tot+1)); s=\$(stat -c %s \"\$f\" 2>/dev/null || echo 0); if [ \"\$s\" -lt 1024 ]; then rot=\$((rot+1)); echo \"ROTO m3u8=\$s \$f\"; fi; done; echo \"listas=\$tot rotas=\$rot\"'" || true
