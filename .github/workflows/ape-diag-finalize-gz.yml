name: ape-diag-finalize-gz

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Diagnóstico read-only para responder dos preguntas sin consultar al operador:
#
#   P1 · ¿cuál `finalize_upload.php` es la fuente de verdad: el del repo (5388 B) o el del VPS (6149 B)?
#   P2 · ¿la divergencia `.m3u8`/`.gz` es cosmética o de contenido?
#
# P1 se responde descargando el del VPS y diffenando contra el del repo.
# P2 se responde comparando el sha256 del `.m3u8` contra el sha256 de `zcat .gz`.
#     Si coinciden, el `.gz` sólo es otra compresión del MISMO contenido: la divergencia es de mtime,
#     no de bytes, y regenerarlo es opcional. Si no coinciden, el `.gz` sirve contenido viejo y hay
#     que regenerar.
#
# SÓLO LEE: no escribe, no repara, no toca nginx.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: "C - las tres comprobaciones del contrato HTTP"
        run: |
          set -uo pipefail
          L=/var/www/html/lists/APE_LISTA_1793589060441.m3u8
          echo '=== 1 · Vary y cabeceras con y sin gzip ==='
          echo '--- CON Accept-Encoding: gzip ---'
          ssh "$TARGET" "curl -sSI -H 'Accept-Encoding: gzip' http://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | grep -iE 'vary|content-length|content-encoding|HTTP/'" || true
          echo '--- SIN Accept-Encoding ---'
          ssh "$TARGET" "curl -sSI http://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | grep -iE 'vary|content-length|content-encoding|HTTP/'" || true
          echo
          echo '=== 2 · modo real de gzip_static en el config VIVO ==='
          ssh "$TARGET" "sudo -n nginx -T 2>/dev/null | grep -nE 'gzip_static|gzip on|gzip off|gzip_types' | head -20" || echo SIN_DATOS
          echo
          echo '=== 3 · extremo a extremo, las dos rutas ==='
          a=$(ssh "$TARGET" "curl -sS --compressed http://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | wc -c")
          b=$(ssh "$TARGET" "curl -sS http://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | wc -c")
          echo "  con --compressed : $a  (esperado 604593696)"
          echo "  sin compresion   : $b"
          echo
          echo '=== 4 · estado en disco: mtimes y tamanos ==='
          ssh "$TARGET" "sudo -n stat -c '%n size=%s mtime=%Y' /var/www/html/lists/APE_LISTA_1793589060441.m3u8 /var/www/html/lists/APE_LISTA_1793589060441.m3u8.gz" || true
          echo
          echo '=== 5 · los .bak que consumen disco ==='
          ssh "$TARGET" "sudo -n du -shc /var/www/html/lists/*.bak_* 2>/dev/null | tail -3" || true
          echo
          echo '=== 6 · primero 8 bytes del m3u8 (es el placeholder?) ==='
          ssh "$TARGET" "sudo -n head -c 16 /var/www/html/lists/APE_LISTA_1793589060441.m3u8 | od -c | head -2" || true