name: ape-diag-finalize-gz

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Diagnóstico read-only para responder dos preguntas sin consultar al operador:
#
#   P1 · ¿cuál `finalize_upload.php` es la fuente de verdad: el del repo (5388 B) o el del VPS (6149 B)?
#   P2 · ¿la divergencia `.m3u8`/`.gz` es cosmética o de contenido?
#
# P1 se responde descargando el del VPS y diffenando contra el del repo.
# P2 se responde comparando el sha256 del `.m3u8` contra el sha256 de `zcat .gz`.
#     Si coinciden, el `.gz` sólo es otra compresión del MISMO contenido: la divergencia es de mtime,
#     no de bytes, y regenerarlo es opcional. Si no coinciden, el `.gz` sirve contenido viejo y hay
#     que regenerar.
#
# SÓLO LEE: no escribe, no repara, no toca nginx.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: "P1 - LEER el finalize del VPS linea por linea (sin modificar)"
        run: |
          set -uo pipefail
          ssh "$TARGET" "sudo -n cat /var/www/html/finalize_upload.php" > /tmp/vps.php 2>/dev/null || { echo SIN_DESCARGA; exit 0; }
          tr -d '\r' < /tmp/vps.php > /tmp/vps.lf.php
          tr -d '\r' < IPTV_v5.4_MAX_AGGRESSION/vps/finalize_upload.php > /tmp/repo.lf.php
          echo "=== lineas: repo=$(wc -l < /tmp/repo.lf.php) vps=$(wc -l < /tmp/vps.lf.php) ==="
          echo
          echo "=== SOLO las lineas que difieren (repo -> vps) ==="
          diff -u /tmp/repo.lf.php /tmp/vps.lf.php | sed -n '/^@@/,$p' | head -120 || echo SIN_DIFERENCIAS
          echo
          echo "=== TODO el flujo de escritura del VPS, en orden ==="
          grep -n -E "fopen|fwrite|fclose|shell_exec|gzip|rename|unlink|chmod|chown|file_put_contents|copy\(|filesize|file_exists|totalSize|outputPath" /tmp/vps.lf.php || true

      - name: "P1b - entorno del finalize: como se invoca y con que"
        run: |
          set -uo pipefail
          echo '=== nginx: la location exacta ==='
          ssh "$TARGET" "sudo -n sed -n '90,110p;284,300p' /etc/nginx/sites-available/m3u8 2>&1" || true
          echo
          echo '=== upload.php: quien llama a finalize y como ==='
          ssh "$TARGET" "sudo -n grep -n -E 'finalize|chunks|part|chunk' /var/www/html/upload.php 2>&1 | head -25" || true
          echo
          echo '=== el cliente: que manda gateway-manager ==='
          grep -n -E "finalize|upload_id|chunk" IPTV_v5.4_MAX_AGGRESSION/frontend/js/gateway-manager.js 2>/dev/null | head -20 || echo SIN_LOCAL