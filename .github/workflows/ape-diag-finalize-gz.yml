name: ape-diag-finalize-gz

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Diagnóstico read-only para responder dos preguntas sin consultar al operador:
#
#   P1 · ¿cuál `finalize_upload.php` es la fuente de verdad: el del repo (5388 B) o el del VPS (6149 B)?
#   P2 · ¿la divergencia `.m3u8`/`.gz` es cosmética o de contenido?
#
# P1 se responde descargando el del VPS y diffenando contra el del repo.
# P2 se responde comparando el sha256 del `.m3u8` contra el sha256 de `zcat .gz`.
#     Si coinciden, el `.gz` sólo es otra compresión del MISMO contenido: la divergencia es de mtime,
#     no de bytes, y regenerarlo es opcional. Si no coinciden, el `.gz` sirve contenido viejo y hay
#     que regenerar.
#
# SÓLO LEE: no escribe, no repara, no toca nginx.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: "C - contrato HTTP CORREGIDO (con Host, el anterior medía el 404 del vhost por defecto)"
        run: |
          set -uo pipefail
          U=/lists/APE_LISTA_1793589060441.m3u8
          H='-H Host:iptv-ape.duckdns.org'
          echo '=== 1 · cabeceras CON Accept-Encoding: gzip ==='
          ssh "$TARGET" "curl -sSI $H -H 'Accept-Encoding: gzip' http://127.0.0.1$U | grep -iE '^(HTTP|vary|content-length|content-encoding)'" || true
          echo
          echo '=== 1b · cabeceras SIN Accept-Encoding ==='
          ssh "$TARGET" "curl -sSI $H http://127.0.0.1$U | grep -iE '^(HTTP|vary|content-length|content-encoding)'" || true
          echo
          echo '=== 3 · extremo a extremo CON Host ==='
          a=$(ssh "$TARGET" "curl -sS $H --compressed http://127.0.0.1$U | wc -c")
          b=$(ssh "$TARGET" "curl -sS $H http://127.0.0.1$U | wc -c")
          echo "  con --compressed : $a   (esperado 604593696)"
          echo "  sin compresion   : $b"
          echo
          echo '=== 3b · el placeholder original: que serviria sin gzip si fuera 8 bytes ==='
          echo '  (hoy el m3u8 mide 604593696 por la reparacion, no 8)'
          echo
          echo '=== 7 · el .gz mas viejo que el .m3u8? (decide si gzip_static lo ignora) ==='
          ssh "$TARGET" "sudo -n stat -c '%n mtime=%Y' /var/www/html/lists/APE_LISTA_1793589060441.m3u8 /var/www/html/lists/APE_LISTA_1793589060441.m3u8.gz; m=\$(stat -c %Y /var/www/html/lists/APE_LISTA_1793589060441.m3u8); g=\$(stat -c %Y /var/www/html/lists/APE_LISTA_1793589060441.m3u8.gz); if [ \$g -ge \$m ]; then echo 'VEREDICTO gz>=m3u8 (nginx usaria el .gz)'; else echo 'VEREDICTO gz<m3u8 (nginx IGNORA el .gz y sirve el m3u8)'; fi" || true