name: ape-diag-finalize-gz

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Diagnóstico read-only para responder dos preguntas sin consultar al operador:
#
#   P1 · ¿cuál `finalize_upload.php` es la fuente de verdad: el del repo (5388 B) o el del VPS (6149 B)?
#   P2 · ¿la divergencia `.m3u8`/`.gz` es cosmética o de contenido?
#
# P1 se responde descargando el del VPS y diffenando contra el del repo.
# P2 se responde comparando el sha256 del `.m3u8` contra el sha256 de `zcat .gz`.
#     Si coinciden, el `.gz` sólo es otra compresión del MISMO contenido: la divergencia es de mtime,
#     no de bytes, y regenerarlo es opcional. Si no coinciden, el `.gz` sirve contenido viejo y hay
#     que regenerar.
#
# SÓLO LEE: no escribe, no repara, no toca nginx.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: "R - se puede reproducir la URL hoy? end to end real"
        run: |
          set -uo pipefail
          H='-H Host:iptv-ape.duckdns.org'
          U=https://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8
          echo '=== A · como lo ve un player CON gzip (lo que hacen VLC/Exo/TiviMate) ==='
          ssh "$TARGET" "curl -sSk $H --compressed $U | head -3" || true
          echo
          echo '=== B · cuantas lineas y cuantos canales entrega ==="
          n=$(ssh "$TARGET" "curl -sSk $H --compressed $U | wc -l")
          c=$(ssh "$TARGET" "curl -sSk $H --compressed $U | grep -c '^#EXTINF'")
          echo "  lineas=$n  #EXTINF=$c"
          echo
          echo '=== C · la primera URL de canal (para probar reproduccion) ==='
          ssh "$TARGET" "curl -sSk $H --compressed $U | grep -m1 '^http' | cut -c1-160" || true
          echo
          echo '=== D · Range/206 sobre la URL con gzip (rompe o no?) ==='
          ssh "$TARGET" "curl -sSk $H -H 'Accept-Encoding: gzip' -r 0-1023 -o /dev/null -D - $U 2>&1 | grep -iE '^(HTTP|content-range|content-length|content-encoding)'" || true
          echo '--- y sin gzip ---'
          ssh "$TARGET" "curl -sSk $H -r 0-1023 -o /dev/null -D - $U 2>&1 | grep -iE '^(HTTP|content-range|content-length|content-encoding)'" || true
          echo
          echo '=== E · las 4 listas y su tamanio servido (con gzip) ==='
          ssh "$TARGET" "for f in /var/www/html/lists/*.m3u8; do b=\$(basename \$f); s=\$(stat -c %s \$f); g=0; [ -e \$f.gz ] && g=\$(stat -c %s \$f.gz); echo \"\$b m3u8=\$s gz=\$g\"; done" || true