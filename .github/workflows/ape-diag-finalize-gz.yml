name: ape-diag-finalize-gz

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Diagnóstico read-only para responder dos preguntas sin consultar al operador:
#
#   P1 · ¿cuál `finalize_upload.php` es la fuente de verdad: el del repo (5388 B) o el del VPS (6149 B)?
#   P2 · ¿la divergencia `.m3u8`/`.gz` es cosmética o de contenido?
#
# P1 se responde descargando el del VPS y diffenando contra el del repo.
# P2 se responde comparando el sha256 del `.m3u8` contra el sha256 de `zcat .gz`.
#     Si coinciden, el `.gz` sólo es otra compresión del MISMO contenido: la divergencia es de mtime,
#     no de bytes, y regenerarlo es opcional. Si no coinciden, el `.gz` sirve contenido viejo y hay
#     que regenerar.
#
# SÓLO LEE: no escribe, no repara, no toca nginx.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adb-generic-visual-enhancement-installer

      - name: Preparar SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          echo "TARGET=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> "$GITHUB_ENV"

      - name: "I - invariante por maquina de estados contra produccion"
        run: |
          set -uo pipefail
          scp -q tools/ops/check_lists_invariant.sh "$TARGET:/tmp/cli.sh"
          ssh "$TARGET" "cd /tmp && sed -i 's/\r$//' cli.sh && sh cli.sh /var/www/html/lists" || echo "INVARIANTE_EXIT=$?"
          echo
          echo '=== el .gz esta mas viejo que el m3u8? (decide si gzip_static lo ignora) ==='
          ssh "$TARGET" "m=\$(stat -c %Y /var/www/html/lists/APE_LISTA_1793589060441.m3u8); g=\$(stat -c %Y /var/www/html/lists/APE_LISTA_1793589060441.m3u8.gz); echo \"m3u8=\$m gz=\$g\"; [ \$g -ge \$m ] && echo 'gz>=m3u8: nginx SIRVE el .gz' || echo 'gz<m3u8: nginx IGNORA el .gz'"
          echo
          echo '=== extremo a extremo por HTTPS (el http redirige 302) ==='
          H='-H Host:iptv-ape.duckdns.org'
          a=$(ssh "$TARGET" "curl -sSk $H --compressed https://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | wc -c")
          b=$(ssh "$TARGET" "curl -sSk $H https://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | wc -c")
          echo "  con --compressed : $a  (esperado 604593696)"
          echo "  sin compresion   : $b"
          echo
          echo '=== cabeceras por HTTPS ==='
          ssh "$TARGET" "curl -sSkI $H -H 'Accept-Encoding: gzip' https://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | grep -iE '^(HTTP|vary|content-length|content-encoding)'" || true
          echo '--- sin gzip ---'
          ssh "$TARGET" "curl -sSkI $H https://127.0.0.1/lists/APE_LISTA_1793589060441.m3u8 | grep -iE '^(HTTP|vary|content-length|content-encoding)'" || true