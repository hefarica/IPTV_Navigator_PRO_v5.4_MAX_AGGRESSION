name: ape-parse gates

# Los validadores de parseo (parse_defects.js, validate_exthttp.js) existian como
# herramientas manuales desde hace rondas y no corrian en ningun workflow.
#
# Peor: sus exit codes estaban invertidos. Los dos hacian `process.exit(0)` sin mirar
# el veredicto, asi que el informe podia decir DEFECTOS mientras el proceso devolvia
# exito, y el unico camino a un exit distinto de cero era no poder leer el fichero.
# Un validador que no puede fallar no valida: solo escribe JSON.
#
# Contrato corregido, y que este workflow ancla: 0 = limpio - 4 = defectos - 5 = no se pudo leer.

on:
  push:
    paths:
      - 'tools/ape-parse-defects/**'
      - '.github/workflows/ape-parse-gates.yml'
  pull_request:
    paths:
      - 'tools/ape-parse-defects/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Exit codes reflejan el veredicto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de los validadores
        run: |
          set -euo pipefail
          node -c tools/ape-parse-defects/parse_defects.js
          node -c tools/ape-parse-defects/validate_exthttp.js

      - name: parse_defects devuelve 0 con la lista limpia
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/parse_defects.js tools/ape-parse-defects/fixtures/parse_clean.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 0 ] || { echo "::error::lista limpia con exit $code, se esperaba 0"; exit 1; }
          echo "$out" | grep -q '"veredicto": "LIMPIO"' || { echo '::error::veredicto distinto de LIMPIO'; exit 1; }

      - name: parse_defects devuelve 4 con URI duplicada (falsificacion)
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/parse_defects.js tools/ape-parse-defects/fixtures/parse_dup.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          # Si este caso devolviera 0, el validador habria vuelto a ser incapaz de fallar.
          [ "$code" -eq 4 ] || { echo "::error::URI duplicada con exit $code, se esperaba 4"; exit 1; }
          echo "$out" | grep -q 'URIs duplicadas' || { echo '::error::no reporto la URI duplicada'; exit 1; }

      - name: validate_exthttp devuelve 0 con EXTHTTP JSON valido
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/validate_exthttp.js tools/ape-parse-defects/fixtures/exthttp_ok.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 0 ] || { echo "::error::EXTHTTP valido con exit $code, se esperaba 0"; exit 1; }
          echo "$out" | grep -q '"json_invalido": 0' || { echo '::error::reporto JSON invalido en un fixture valido'; exit 1; }

      - name: validate_exthttp devuelve 4 con EXTHTTP que no es JSON (falsificacion)
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/validate_exthttp.js tools/ape-parse-defects/fixtures/exthttp_bad.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 4 ] || { echo "::error::EXTHTTP invalido con exit $code, se esperaba 4"; exit 1; }
          echo "$out" | grep -q '"json_invalido": 2' || { echo '::error::no conto los 2 bloques invalidos'; exit 1; }

      - name: Un fichero ausente devuelve 5, no 4
        run: |
          set -uo pipefail
          for tool in parse_defects validate_exthttp audio_contradictions; do
            set +e
            node "tools/ape-parse-defects/$tool.js" tools/ape-parse-defects/fixtures/no_existe.m3u8 >/dev/null 2>&1; code=$?
            set -e
            echo "$tool -> exit=$code"
            # 5 y 4 tienen que ser distinguibles: "no pude leer" no es "lei y tiene defectos".
            # Con un unico codigo, un fichero ausente se reportaba como lista defectuosa.
            [ "$code" -eq 5 ] || { echo "::error::$tool devolvio $code para un fichero ausente, se esperaba 5"; exit 1; }
          done

      - name: audio_contradictions detecta el plano de audio contradictorio
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/audio_contradictions.js tools/ape-parse-defects/fixtures/audio_contradicciones.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          # El fixture es un bloque de canal REAL extraido de la lista de referencia, que
          # declara Atmos/DTS/TrueHD/EAC3 como false en KODIPROP y ENABLED=true en la capa APE.
          [ "$code" -eq 4 ] || { echo "::error::no detecto las contradicciones del bloque real (exit $code)"; exit 1; }
          echo "$out" | grep -q '"C1_booleano_opuesto": 4' || { echo '::error::no conto las 4 propiedades con valor opuesto'; exit 1; }
          echo "$out" | grep -q '"C4_passthrough_imposible": 1' || { echo '::error::no detecto el passthrough imposible sin EXT-X-MEDIA'; exit 1; }

      - name: audio_contradictions calla cuando la lista es coherente
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/audio_contradictions.js tools/ape-parse-defects/fixtures/parse_clean.m3u8 2>&1); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          # Falsificacion inversa: una lista sin tags de audio contradictorios debe dar 0.
          # Sin esta mitad, el detector podria estar devolviendo 4 por cualquier cosa.
          [ "$code" -eq 0 ] || { echo "::error::lista coherente con exit $code, se esperaba 0"; exit 1; }
          echo "$out" | grep -q '"total": 0' || { echo '::error::reporto contradicciones en una lista limpia'; exit 1; }

      - name: tag_variance distingue un tag que mide de uno constante
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/tag_variance.js tools/ape-parse-defects/fixtures/variance_varia.m3u8); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 0 ] || { echo "::error::tag_variance devolvio $code, se esperaba 0"; exit 1; }
          # El fixture tiene 3 canales con RESOLUTION-SUPREMACY distinta y un tag que no cambia.
          python3 - "$out" <<'PY'
          import json, sys
          j = json.loads(sys.argv[1])
          clases = {f['tag']: (f['clase'], f['valores_distintos']) for f in j['constante'] + j['varia'] + j['parcial'] + j['raro']}
          def exigir(tag, clase):
              got = clases.get(tag)
              if not got:
                  sys.exit(f'::error::{tag} no aparece en el censo')
              if got[0] != clase:
                  sys.exit(f'::error::{tag} clasificado {got[0]} ({got[1]} valores), se esperaba {clase}')
              print(f'  OK {tag} -> {got[0]} ({got[1]} valores)')
          exigir('EXT-X-APE-RESOLUTION-SUPREMACY', 'VARIA')
          exigir('EXT-X-APE-HDR-TRANSFER', 'CONSTANTE')
          PY

      - name: tag_variance no inventa varianza ni la esconde
        run: |
          set -uo pipefail
          set +e
          out=$(node tools/ape-parse-defects/tag_variance.js tools/ape-parse-defects/fixtures/variance_constante.m3u8); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 0 ] || { echo "::error::tag_variance devolvio $code, se esperaba 0"; exit 1; }
          python3 - "$out" <<'PY'
          import json, sys
          j = json.loads(sys.argv[1])
          # Si TODOS los tags son constantes, el censo debe decir exactamente eso:
          # contar la varianza como constante es tan grave como no verla.
          if j['resumen']['VARIA'] != 0:
              sys.exit(f"::error::lista de 3 canales identicos reporta {j['resumen']['VARIA']} tags VARIA")
          print(f"  OK {j['resumen']['CONSTANTE']} constantes, 0 VARIA")
          PY

      - name: reconcile_audio cierra las dos auditorias de audio
        run: |
          set -uo pipefail
          FIX=tools/ape-parse-defects/fixtures/audio_reconcile.m3u8
          OUT=/tmp/audio_out.m3u8

          echo '=== ANTES: las dos auditorias deben fallar ==='
          set +e
          node tools/ape-parse-defects/kodiprop_key_audit.js "$FIX" > /tmp/isa_before.json 2>/dev/null; c1=$?
          node tools/ape-parse-defects/audio_contradictions.js "$FIX" > /tmp/ac_before.json 2>/dev/null; c2=$?
          set -e
          echo "kodiprop_key_audit exit=$c1 (esperado 4) · audio_contradictions exit=$c2 (esperado 4)"
          [ "$c1" -eq 4 ] || { echo "::error::el fixture deberia tener claves inventadas"; exit 1; }
          [ "$c2" -eq 4 ] || { echo "::error::el fixture deberia tener contradicciones de audio"; exit 1; }

          echo '=== TRANSFORMACION ==='
          node tools/ape-parse-defects/reconcile_audio.js "$FIX" "$OUT" > /tmp/rec.json 2>/tmp/rec.err
          echo "exit=$?"; cat /tmp/rec.err

          echo '=== DESPUES: las dos auditorias deben pasar ==='
          set +e
          node tools/ape-parse-defects/kodiprop_key_audit.js "$OUT" > /tmp/isa_after.json 2>/dev/null; c3=$?
          node tools/ape-parse-defects/audio_contradictions.js "$OUT" > /tmp/ac_after.json 2>/dev/null; c4=$?
          set -e
          echo "kodiprop_key_audit exit=$c3 · audio_contradictions exit=$c4 (esperado 0 en ambos salvo deprecadas)"
          [ "$c4" -eq 0 ] || { echo "::error::quedan contradicciones de audio tras la reconciliacion"; exit 1; }

          python3 - <<'PY'
          import json, sys
          b = json.load(open('/tmp/isa_before.json'))['resumen']
          a = json.load(open('/tmp/isa_after.json'))['resumen']
          acb = json.load(open('/tmp/ac_before.json'))['resumen']
          aca = json.load(open('/tmp/ac_after.json'))['resumen']
          rec = json.load(open('/tmp/rec.json'))['cuentas']

          fallos = []
          # 1) Las claves inventadas deben desaparecer por completo.
          print(f"  INVENTADA {b['INVENTADA']} -> {a['INVENTADA']}")
          if b['INVENTADA'] == 0: fallos.append('el fixture no tenia claves inventadas: la prueba no probaria nada')
          if a['INVENTADA'] != 0: fallos.append(f"quedan {a['INVENTADA']} claves inventadas")
          # 2) Las contradicciones deben ir a cero.
          print(f"  contradicciones {acb['total']} -> {aca['total']}")
          if acb['total'] == 0: fallos.append('el fixture no tenia contradicciones: la prueba no probaria nada')
          if aca['total'] != 0: fallos.append(f"quedan {aca['total']} contradicciones")
          # 3) Los conteos de la transformacion deben cuadrar con las lineas.
          for k in ['R1_passthrough_corregido','R2_kodiprop_audio_borradas','R3_extvlcopt_audio_channels_borradas']:
              if rec[k] == 0: fallos.append(f'{k} = 0: esa regla no se ejercito')
          lineas_ok = rec['lineas_salida'] == rec['lineas_entrada'] - rec['R2_kodiprop_audio_borradas'] - rec['R3_extvlcopt_audio_channels_borradas']
          print(f"  lineas {rec['lineas_entrada']} -> {rec['lineas_salida']} (cuadre: {lineas_ok})")
          if not lineas_ok: fallos.append('el conteo de lineas no cuadra con las reglas aplicadas')
          # 4) Ninguna linea ajena debe haberse perdido: las REAL_VIGENTE/otras intactas.
          print(f"  claves distintas {b['claves_distintas']} -> {a['claves_distintas']}")
          for f in fallos:
              print(f'::error::{f}')
          sys.exit(1 if fallos else 0)
          PY

      - name: reconcile_audio es idempotente
        run: |
          set -uo pipefail
          # Aplicar la reconciliacion dos veces debe dar el MISMO fichero y no cambiar nada.
          # Si la segunda pasada cambia bytes o vuelve a contar reglas, la transformacion no converge.
          node tools/ape-parse-defects/reconcile_audio.js tools/ape-parse-defects/fixtures/audio_reconcile.m3u8 /tmp/a1.m3u8 >/dev/null 2>&1
          node tools/ape-parse-defects/reconcile_audio.js /tmp/a1.m3u8 /tmp/a2.m3u8 > /tmp/rec2.json 2>/dev/null
          sha1=$(sha256sum /tmp/a1.m3u8 | cut -d' ' -f1)
          sha2=$(sha256sum /tmp/a2.m3u8 | cut -d' ' -f1)
          echo "  sha pasada 1: $sha1"
          echo "  sha pasada 2: $sha2"
          [ "$sha1" = "$sha2" ] || { echo '::error::la segunda pasada cambia el fichero: no es idempotente'; exit 1; }
          python3 - <<'PY'
          import json, sys
          c = json.load(open('/tmp/rec2.json'))['cuentas']
          total = c['R1_passthrough_corregido'] + c['R2_kodiprop_audio_borradas'] + c['R3_extvlcopt_audio_channels_borradas']
          print(f"  reglas aplicadas en la 2a pasada: {total}")
          if total != 0:
              sys.exit(f'::error::la 2a pasada volvio a aplicar {total} reglas: no converge')
          PY

      - name: lab_calibration_check no inventa violaciones ni las esconde
        run: |
          set -uo pipefail
          # Direccion 1: dos knobs fuera de su bound -> exit 4 y contados.
          set +e
          out=$(node tools/ape-parse-defects/lab_calibration_check.js tools/ape-parse-defects/fixtures/lab_bounds_out.m3u8); code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$code" -eq 4 ] || { echo "::error::fixture fuera de rango con exit $code, se esperaba 4"; exit 1; }
          python3 - "$out" <<'PY'
          import json, sys
          j = json.loads(sys.argv[1])
          if j['resumen']['violaciones'] != 2:
              sys.exit(f"::error::esperaba 2 violaciones, reporto {j['resumen']['violaciones']}")
          nombres = {v['knob'] for v in j['violaciones']}
          if nombres != {'buffer_seconds', 'live_delay_seconds'}:
              sys.exit(f"::error::violaciones inesperadas: {sorted(nombres)}")
          print('  OK 2 violaciones, knobs exactos')
          PY

          # Direccion 2: todos los knobs en rango -> exit 0 y cero violaciones. Sin esta mitad,
          # un checker que siempre devuelve 4 se veria verde sobre la lista real.
          set +e
          out2=$(node tools/ape-parse-defects/lab_calibration_check.js tools/ape-parse-defects/fixtures/lab_bounds_ok.m3u8); code2=$?
          set -e
          echo "$out2"; echo "exit=$code2"
          [ "$code2" -eq 0 ] || { echo "::error::fixture en rango con exit $code2, se esperaba 0"; exit 1; }
          python3 - "$out2" <<'PY'
          import json, sys
          j = json.loads(sys.argv[1])
          if j['resumen']['violaciones'] != 0:
              sys.exit(f"::error::reporto {j['resumen']['violaciones']} violaciones en un fixture coherente")
          print('  OK 0 violaciones en fixture coherente')
          PY

          # Direccion 3: un fichero ausente sigue siendo 5, distinto de "hay defectos" (4).
          set +e
          node tools/ape-parse-defects/lab_calibration_check.js tools/ape-parse-defects/fixtures/no_existe.m3u8 >/dev/null 2>&1; code3=$?
          set -e
          echo "ausente exit=$code3"
          [ "$code3" -eq 5 ] || { echo "::error::fichero ausente con exit $code3, se esperaba 5"; exit 1; }
