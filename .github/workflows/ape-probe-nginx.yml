# ═══════════════════════════════════════════════════════════════════════════
# ape-probe-nginx.yml · SONDA READ-ONLY de la configuración nginx del VPS
#
# POR QUÉ EXISTE
# El fix del HTTP 206 (Range) vive en el bloque `location ~* \.m3u8$` de
# /etc/nginx/sites-available/default. Medido: ese archivo tiene sha256
# ce0901350a021608139b5639cf4ccd7717bef8c3a9e4f79031eb46386b67b03f y NINGÚN
# .conf del repositorio hashea a él. Por tanto NO se puede sobrescribir a
# ciegas: hay que traerlo byte-exacto antes de parchear.
#
# QUÉ HACE
#   · `nginx -t` sin sudo y con sudo -n, con su exit code real
#   · sha256 y volcado del bloque m3u8
#   · listado de conf.d y sites-enabled
#   · sube el archivo vivo como artefacto para parchearlo localmente
#
# QUÉ NO HACE (por diseño)
#   · NO escribe, NO recarga, NO reinicia, NO toca ningún archivo del VPS
#   · NO se dispara con push: SOLO workflow_dispatch manual
#   · NO sustituye al pipeline de deploy
# ═══════════════════════════════════════════════════════════════════════════
name: APE probe nginx (read-only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la sonda (queda en el log)'
        required: false
        default: 'evidencia para el fix del 206'

concurrency:
  group: ape-probe-nginx
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  probe:
    name: sonda nginx (solo lectura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sonda (sin escribir nada)
        run: |
          set -uo pipefail
          TARGET="${{ secrets.VPS_USER }}@$VPS_HOST"
          mkdir -p probe-out
          echo "motivo: ${{ inputs.reason }}"
          ssh "$TARGET" 'bash -s' > probe-out/nginx-probe.txt 2>&1 <<'EOS'
          echo "=== identidad ==="
          id
          hostname
          nginx -v 2>&1 || true
          echo
          echo "=== nginx -t SIN sudo ==="
          nginx -t 2>&1; echo "EXIT_SIN_SUDO=$?"
          echo
          echo "=== nginx -t CON sudo -n ==="
          sudo -n nginx -t 2>&1; echo "EXIT_CON_SUDO=$?"
          echo
          echo "=== hashes ==="
          sha256sum /etc/nginx/sites-available/default /etc/nginx/nginx.conf 2>&1
          echo
          echo "=== conf.d ==="
          ls -la /etc/nginx/conf.d/ 2>&1
          echo
          echo "=== sites-enabled ==="
          ls -la /etc/nginx/sites-enabled/ 2>&1
          echo
          echo "=== inclusión de conf.d / sites-enabled en nginx.conf ==="
          grep -n -E 'include' /etc/nginx/nginx.conf 2>&1 || echo NINGUNO
          echo
          echo "=== bloques m3u8 / lists ==="
          grep -n -E 'location[[:space:]]+.*(m3u8|lists)' /etc/nginx/sites-available/default 2>&1 || echo SIN_MATCH
          echo
          echo "=== gzip_static / gunzip / Accept-Ranges / gzip ==="
          grep -n -E 'gzip_static|gunzip|Accept-Ranges|^[[:space:]]*gzip[[:space:]]' /etc/nginx/sites-available/default 2>&1 || echo NINGUNO
          echo
          echo "=== tamano y lineas ==="
          wc -lc /etc/nginx/sites-available/default 2>&1
          EOS
          echo "--- probe-out/nginx-probe.txt ---"
          cat probe-out/nginx-probe.txt

      - name: Traer el archivo vivo byte-exacto (sin modificarlo)
        run: |
          set -euo pipefail
          TARGET="${{ secrets.VPS_USER }}@$VPS_HOST"
          scp -q "$TARGET:/etc/nginx/sites-available/default" probe-out/sites-available-default.conf
          echo "sha256 local:"
          sha256sum probe-out/sites-available-default.conf
          echo "esperado del VPS: ce0901350a021608139b5639cf4ccd7717bef8c3a9e4f79031eb46386b67b03f"

      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: nginx-live-default
          path: probe-out/
          if-no-files-found: error
