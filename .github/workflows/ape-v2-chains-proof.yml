name: ape-v2-chains-proof

# Prueba EMPIRICA de las cadenas V2 propuestas por el operador, en ffmpeg real.
#
# El operador pide "APLICA TU ESTOS VIDEOFILTERS". Antes de aplicarlas a 10.573 canales hay que
# saber dos cosas que solo se saben ejecutandolas:
#
#   1. Que CADA cadena sea VALIDA: que existan los filtros y los parametros con esos nombres.
#      Una cadena invalida no falla en la lista: falla en el reproductor.
#   2. Que el resultado sea la RESOLUCION DECLARADA. La cadena dice "P5 · 854x480 -> 1920x1080";
#      se comprueba midiendo el frame de salida, no leyendo la intencion.
#
# Las cadenas viven en tools/ape-image-recipes/v2_chains.txt (versionadas, sin editar) para que este
# workflow no tenga que llevar heredocs, que rompen la indentacion de YAML.
#
# Sin VPS. Sin tocar produccion. ffmpeg del runner.

on:
  push:
    paths:
      - '.github/workflows/ape-v2-chains-proof.yml'
      - 'tools/ape-image-recipes/v2_chains.txt'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg disponible y con que filtros
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -version | head -2
          echo '--- filtros que usan las cadenas ---'
          for f in bwdif zscale format hqdn3d pp unsharp gradfun cas minterpolate; do
            if ffmpeg -hide_banner -h filter=$f >/dev/null 2>&1; then echo "  OK      $f"; else echo "  FALTA   $f"; fi
          done
          echo '--- libplacebo (solo V3) ---'
          if ffmpeg -hide_banner -h filter=libplacebo >/dev/null 2>&1; then echo '  OK      libplacebo'; else echo '  FALTA   libplacebo'; fi

      - name: Medir cada cadena V2 contra su resolucion declarada
        run: |
          set -uo pipefail
          mkdir -p /tmp/out
          CHAINS=tools/ape-image-recipes/v2_chains.txt

          falls=0
          : > /tmp/resultado.txt
          while IFS='|' read -r nombre origen destino cadena; do
            case "$nombre" in ''|'#'*) continue;; esac
            echo "=== $nombre · $origen -> $destino ==="
            set +e
            err=$(ffmpeg -hide_banner -loglevel error -nostdin \
                    -f lavfi -i "testsrc2=size=${origen}:rate=60:duration=0.2" \
                    -vf "$cadena" -frames:v 1 -y "/tmp/out/${nombre}.png" 2>&1)
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "  FALLA exit=$rc"
              echo "$err" | head -4 | sed 's/^/    /'
              echo "$nombre|FALLA|$rc|$(echo "$err" | head -1)" >> /tmp/resultado.txt
              falls=$((falls+1))
              continue
            fi
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "/tmp/out/${nombre}.png")
            echo "  exit=0 · salida real: ${dims} (declarada: ${destino})"
            if [ "$dims" = "$destino" ]; then
              echo "$nombre|OK|0|$dims" >> /tmp/resultado.txt
            else
              echo "$nombre|RESOLUCION_DISTINTA|0|$dims != $destino" >> /tmp/resultado.txt
              falls=$((falls+1))
            fi
          done < "$CHAINS"

          echo
          echo '=== RESUMEN ==='
          column -t -s'|' /tmp/resultado.txt
          echo
          echo "cadenas con problema: $falls"
          if [ "$falls" -ne 0 ]; then
            echo '::error::al menos una cadena V2 no produce la resolucion declarada o no ejecuta'
            exit 1
          fi
          echo 'Todas las cadenas probadas ejecutan y producen EXACTAMENTE la resolucion declarada'

      - name: Que ninguna cadena declarada haga downscale
        run: |
          set -uo pipefail
          CHAINS=tools/ape-image-recipes/v2_chains.txt
          fallos=0
          while IFS='|' read -r nombre origen destino cadena; do
            case "$nombre" in ''|'#'*) continue;; esac
            ow=${origen%x*}; oh=${origen#*x}; dw=${destino%x*}; dh=${destino#*x}
            if [ "$dw" -lt "$ow" ] || [ "$dh" -lt "$oh" ]; then
              echo "  DOWNSCALE $nombre: $origen -> $destino"
              fallos=$((fallos+1))
            else
              echo "  OK $nombre: $origen -> $destino (factor $(awk -v a=$dw -v b=$ow 'BEGIN{printf "%.2f", a/b}')x)"
            fi
          done < "$CHAINS"
          [ "$fallos" -eq 0 ] || { echo '::error::alguna cadena declarada hace downscale'; exit 1; }

      - name: P0 y P1 quedan NO EVALUADAS por presupuesto de memoria
        run: |
          set -euo pipefail
          # Se declara explicitamente lo que NO se prueba, para que el silencio no se lea como exito.
          echo 'No evaluadas en este job:'
          echo '  P1  3840x2160 -> 6144x3456 (salida 12-bit)'
          echo '  P0  7680x4320 -> 11520x6480 (entrada 4:4:4 16-bit ~100 MB/frame + intermedio 24 MP)'
          echo 'Motivo: memoria del runner, NO un fallo de la cadena. Quedan pendientes de un host con GPU/RAM.'
