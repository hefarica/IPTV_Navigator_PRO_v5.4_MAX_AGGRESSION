name: CI · validate (doctrine + syntax)

# Validation ONLY. This workflow never contacts the VPS and needs no secrets.
# The actual deploy (CD) is operator-triggered locally via tools/cicd/deploy_vps.ps1.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only "$BASE" HEAD \
              | grep -E '\.(js|php|py|sh|json|m3u8)$' \
              | grep -vE 'node_modules/|/vendor/|backup_master' || true)
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run doctrine + syntax gate
        run: |
          chmod +x tools/cicd/validate_local.sh
          mapfile -t F < <(printf '%s\n' "${{ steps.changed.outputs.files }}" | awk 'NF')
          if [ ${#F[@]} -eq 0 ]; then
            echo "No changed source files — validating generator trio (default)."
            bash tools/cicd/validate_local.sh
          else
            echo "Validating ${#F[@]} changed file(s)."
            bash tools/cicd/validate_local.sh "${F[@]}"
          fi

      - name: Validate deploy manifest is well-formed JSON
        run: python -m json.tool tools/cicd/vps_deploy_map.json > /dev/null && echo "manifest OK"

      # [R9 2026-11-21] GATE CONTRA LA COPIA EQUIVOCADA.
      # En el arbol hay CUATRO server.js y solo uno es el motor
      # (IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/server.js; sha historico 268bbd3a…, pin
      #  vigente tras R11: ad37d894…). El contrato de rutas
      # (tools/quality/test_jit_routes_contract.js) vigila que el canonico conserve sus 61
      # rutas; NO vigilaba QUE FICHERO SE DESPLIEGA. Este paso comprueba que la fuente del
      # manifiesto es el canonico, que ningun workflow instala otra copia, y compara con el
      # pin del recibo canary.
      #   exit 0 -> PASS · exit 1 -> FALLA (bloquea) · exit 2 -> NO COMPUTADO (avisa, no finge verde)
      - name: Gate de paridad de despliegue del motor JIT
        run: |
          set +e
          node tools/quality/check_jit_deploy_parity.js
          RC=$?
          echo "exit=$RC"
          if [ "$RC" -eq 1 ]; then
            echo "::error::paridad de despliegue del motor JIT: una copia NO canonica se desplegaria (ver arriba)"
            exit 1
          fi
          if [ "$RC" -eq 2 ]; then
            echo "::warning::paridad del motor JIT NO COMPUTADA: el recibo canary no atestigua los bytes actuales. Re-emitir el recibo contra el canonico. No se declara verde"
          fi
          exit 0
