name: deploy-streaming-contract

# Manual only. Production environment approval is required.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Write APPLY to authorize the JIT + headers deployment'
        required: true
        type: string
      patch_lists_cache:
        description: 'Also force /lists/*.m3u8 to no-store in nginx'
        type: boolean
        default: true
      # [2026-11-21] El motor que corre en /opt/ape-jit pesa 15x mas que su fuente en el
      # repo. Este input es la unica forma de autorizar un reemplazo que ENCOGE el motor.
      confirm_shrink:
        description: 'Solo para reemplazos que encogen el motor: escribe REEMPLAZO EL MOTOR JIT'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-streaming-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://iptv-ape.duckdns.org
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload JIT server
        env:
          CONFIRM_SHRINK: ${{ inputs.confirm_shrink }}
        run: |
          set -euo pipefail
          TARGET="$VPS_USER@$VPS_HOST"
          # [2026-11-21] FUENTE CANONICA: IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/server.js
          # vps_jit/server.js es el programa LEGACY (5 rutas: capabilities/catalog/crystal/
          # health/playlist; su propio /capabilities.json declara processing_domain
          # "vps_jit_legacy"). Instalarlo encima del motor de imagen borraba 56 rutas.
          # [2026-11-21] GATE ANTI-DEGRADACION DEL MOTOR. Medido ese dia sobre el VPS:
          #   vps_jit/server.js (este, la fuente)   662 lineas /   29624 B / e400fa19 (commit 2026-11-02)
          #   /opt/ape-jit/server.js (EN EJECUCION) 9801 lineas / 480253 B / 44d8bf84
          # El motor de produccion es 15x mas grande y NO existe en ninguna copia del repo:
          # tiene 105 lineas que solo viven en el VPS (POST /image/streaming-health-llm,
          # objetivo del 2026-11-16). Instalar este fichero encima seria reemplazar el motor
          # real por un stub y reiniciar el servicio. Hasta que se decida que artefacto es
          # canonico, este paso SE NIEGA a instalar algo que encoge el motor a menos de la
          # mitad. Para forzarlo hay que aportar la confirmacion literal en el input.
          LOCAL_BYTES=$(stat -c %s "IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/server.js")
          REMOTE_BYTES=$(ssh "$TARGET" "sudo -n stat -c %s /opt/ape-jit/server.js 2>/dev/null || echo 0")
          echo "  fuente local: $LOCAL_BYTES B | motor desplegado: $REMOTE_BYTES B"
          if [ "${REMOTE_BYTES:-0}" -gt 0 ] && [ "$LOCAL_BYTES" -lt $((REMOTE_BYTES / 2)) ]; then
            if [ "$CONFIRM_SHRINK" != "REEMPLAZO EL MOTOR JIT" ]; then
              echo "::error::la fuente ($LOCAL_BYTES B) es menos de la mitad del motor que corre ($REMOTE_BYTES B). No se instala. Si es intencional, dispara el workflow con confirm_shrink='REEMPLAZO EL MOTOR JIT'."
              exit 1
            fi
            echo "  AVISO: encogimiento confirmado por el operador (confirm_shrink)"
          fi
          scp "IPTV_v5.4_MAX_AGGRESSION/vps/ape-jit/server.js" "$TARGET:/tmp/ape-jit-server.js"
          ssh "$TARGET" 'set -euo pipefail
            # [2026-11-21] El restart ya no deja el motor a medias: si /health no responde
            # en 20 s, se reinstala el backup y se vuelve a arrancar. Antes el paso moria
            # con curl -f y el servicio quedaba con el fichero nuevo y sin verificar.
            BAK=/root/ape-jit-server.$(date -u +%Y%m%dT%H%M%SZ).bak
            cp -a /opt/ape-jit/server.js "$BAK"
            install -m 0644 /tmp/ape-jit-server.js /opt/ape-jit/server.js
            systemctl restart ape-jit
            ok=0
            for i in $(seq 1 20); do
              sleep 1
              if curl -fsS -m 3 http://127.0.0.1:3099/health >/tmp/ape-health.json 2>/dev/null; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "::error::/health no respondio en 20 s. ROLLBACK a $BAK"
              install -m 0644 "$BAK" /opt/ape-jit/server.js
              systemctl restart ape-jit
              sleep 2
              curl -fsS -m 3 http://127.0.0.1:3099/health || echo "rollback tampoco responde: revision manual"
              exit 1
            fi
            echo "health OK: $(cat /tmp/ape-health.json)"' 

      - name: Patch nginx streaming headers
        run: |
          set -euo pipefail
          TARGET="$VPS_USER@$VPS_HOST"
          ssh "$TARGET" "PATCH_LISTS='${{ inputs.patch_lists_cache }}' bash -s" <<'REMOTE'
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          cp -a /etc/nginx/snippets/ape-jit.conf "/root/ape-jit.conf.$stamp.bak"
          if ! grep -q 'add_header Keep-Alive' /etc/nginx/snippets/ape-jit.conf; then
            python3 - <<'PY'
          p='/etc/nginx/snippets/ape-jit.conf'
          s=open(p).read()
          s=s.replace('    add_header Cache-Control "no-store" always;', '    add_header Cache-Control "no-store" always;\n    add_header Keep-Alive "timeout=5, max=100" always;')
          open(p,'w').write(s)
          PY
          fi
          if [ "$PATCH_LISTS" = "true" ]; then
            cp -a /etc/nginx/sites-enabled/default "/root/nginx-default.$stamp.bak"
            python3 - <<'PY'
          p='/etc/nginx/sites-enabled/default'
          s=open(p).read()
          old='        add_header Cache-Control "public, max-age=300" always;\n        expires 5m;'
          new='        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0" always;\n        add_header Pragma "no-cache" always;\n        add_header Expires "0" always;\n        add_header Vary "*" always;'
          if old in s:
              s=s.replace(old,new)
              open(p,'w').write(s)
          PY
          fi
          nginx -t
          systemctl reload nginx
          REMOTE

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify 200/206/302 and headers
        run: |
          node tools/certify_http_200_206_302.js
          node tools/verify_streaming_headers.js
