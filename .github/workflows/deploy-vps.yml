# ═══════════════════════════════════════════════════════════════════════════
# deploy-vps.yml · [t90] CI/CD del VPS — TODO despliegue pasa por aquí
#
# POR QUÉ EXISTE: la lista 4K se subió A MANO y está viva. Nadie revisó el VPS
# antes, no hubo backup y no hubo vuelta atrás posible. Esto lo sustituye.
#
# REGLA: disparo MANUAL. `dry-run` es el DEFAULT. `deploy` exige la aprobación
# del Environment `production` (required reviewers), que se configura en GitHub.
#
# Orquesta el pipeline ya existente en `_vps_stage/deploy/`:
#   inventory → preflight → dry-run → validate → deploy → verify → rollback
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = solo revisa (por defecto). deploy = aplica de verdad.'
        type: choice
        options: [dry-run, staging, deploy]
        default: dry-run
        required: true

# Un despliegue a la vez. Nunca dos contra el mismo VPS.
concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  # [t92] dry-run ⇒ verify solo exige endpoints de lectura
  APE_DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
  # [t92] clave efímera del CI (lib.sh la usa si existe)
  APE_SSH_KEY: /home/runner/.ssh/id_ed25519
  DEPLOY_DIR: _vps_stage/deploy
  # Ruta de la lista viva en el VPS y el marcador de 8 bytes que la acompaña.
  LISTS_DIR: /var/www/lists
  MARKER_BYTES: 8

jobs:
  # ── 1 · INVENTARIO (read-only) ───────────────────────────────────────────
  inventory:
    name: 1 · inventory (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Inventario del VPS (no escribe)
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          bash "$DEPLOY_DIR/inventory.sh"
      - name: Guardar inventario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: |
            _vps_stage/deploy/out/inventory*
            _vps_stage/deploy/out/stamp*
          if-no-files-found: warn
          retention-days: 14

  # ── 2 · PREFLIGHT + DRY-RUN (read-only) ──────────────────────────────────
  dry-run:
    name: 2 · preflight + dry-run (read-only)
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Comprobaciones previas
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          bash "$DEPLOY_DIR/preflight.sh"
      - name: Diff exacto repo ↔ VPS
        run: |
          set -euo pipefail
          bash "$DEPLOY_DIR/dry-run.sh"
      - name: Publicar el diff para revisión
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-diff
          path: _vps_stage/deploy/out/
          if-no-files-found: warn
          retention-days: 14

  # ── 3 · VALIDACIÓN SINTÁCTICA (read-only) ────────────────────────────────
  validate:
    name: 3 · validate (luac -p / php -l / nginx -t)
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Validar sintaxis en el VPS (sin escribir destino)
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          bash "$DEPLOY_DIR/validate.sh"

  # ── 4 · DEPLOY (solo con mode=deploy + aprobación del Environment) ───────
  # ── 3b · STAGING (8089) · NO toca produccion ─────────────────────────────
  staging:
    name: 3b · staging 8089 (APROBACIÓN REQUERIDA)
    needs: validate
    if: ${{ inputs.mode == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://iptv-ape.duckdns.org
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Fotografiar produccion ANTES (sha256 intocable)
        run: |
          set -euo pipefail
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF' | tee before.sha
          set -euo pipefail
          sha256sum /etc/nginx/conf.d/50-ape-meta-plane.conf 2>/dev/null || echo "AUSENTE  50-ape-meta-plane.conf"
          sha256sum /etc/nginx/lua/ape_gateway.lua 2>/dev/null || echo "AUSENTE  ape_gateway.lua"
          EOF
          cat before.sha
      - name: Instalar conf de staging (nombre DISTINTO) + nginx -t + reload
        run: |
          set -euo pipefail
          CONF=_vps_stage/nginx/ape-meta-staging.conf
          [ -f "$CONF" ] || { echo "::error::falta $CONF"; exit 1; }
          scp "$CONF" "${{ secrets.VPS_USER }}@$VPS_HOST:/tmp/ape-meta-staging.conf"
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          sudo install -m 644 /tmp/ape-meta-staging.conf /etc/nginx/conf.d/99-ape-meta-staging.conf
          sudo nginx -t
          sudo nginx -s reload
          EOF
      - name: Health del 8089
        run: |
          set -euo pipefail
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8089/staging/health || true)
            [ "$code" = "200" ] && { echo "staging health=200"; exit 0; }
            sleep 2
          done
          echo "::error::el 8089 no responde su health"
          exit 1
          EOF
      - name: MUESTRA 10 canales 8088 vs 8089 (SECUENCIAL, 1 conexion)
        run: |
          set -euo pipefail
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          CH="177683 177690 177691 177692 177693 177694 177695 177696 177697 177698"
          printf '%-8s %-6s %-10s %-6s %-10s %s\n' CH 8088 lat 8089 lat manifiesto
          for c in $CH; do
            t0=$(date +%s%N)
            a=$(curl -s -o /tmp/a.$$ -m 12 -w '%{http_code}' "http://127.0.0.1:8088/cdn/line.tivi-ott.net/live/3JHFTC/U56BDP/$c.m3u8" || echo ERR)
            t1=$(date +%s%N)
            b_man=$(head -c 7 /tmp/a.$$ 2>/dev/null | grep -c '#EXTM3U' || true)
            rm -f /tmp/a.$$
            t2=$(date +%s%N)
            b=$(curl -s -o /tmp/b.$$ -m 12 -w '%{http_code}' "http://127.0.0.1:8089/cdn/line.tivi-ott.net/live/3JHFTC/U56BDP/$c.m3u8" || echo ERR)
            t3=$(date +%s%N)
            b_man2=$(head -c 7 /tmp/b.$$ 2>/dev/null | grep -c '#EXTM3U' || true)
            rm -f /tmp/b.$$
            printf '%-8s %-6s %-10s %-6s %-10s %s\n' "$c" "$a" "$(( (t1-t0)/1000000 ))ms" "$b" "$(( (t3-t2)/1000000 ))ms" "$b_man2"
            sleep 1.5
          done
          EOF
      - name: Verificar que produccion NO cambio (aborta si cambia)
        run: |
          set -euo pipefail
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF' | tee after.sha
          set -euo pipefail
          sha256sum /etc/nginx/conf.d/50-ape-meta-plane.conf 2>/dev/null || echo "AUSENTE  50-ape-meta-plane.conf"
          sha256sum /etc/nginx/lua/ape_gateway.lua 2>/dev/null || echo "AUSENTE  ape_gateway.lua"
          EOF
          echo "--- comparacion antes/despues:"
          diff before.sha after.sha && echo "PRODUCCION INTACTA" || { echo "::error::produccion cambio; abortando"; exit 1; }
      - name: ROLLBACK del staging (siempre)
        if: always()
        run: |
          set -euo pipefail
          ssh "${{ secrets.VPS_USER }}@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          if [ -f /etc/nginx/conf.d/99-ape-meta-staging.conf ]; then
            sudo rm -f /etc/nginx/conf.d/99-ape-meta-staging.conf
            sudo nginx -t && sudo nginx -s reload
            echo "staging retirado; nginx recargado (sin restart)"
          else
            echo "no habia conf de staging (nada que retirar)"
          fi
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence
          path: |
            before.sha
            after.sha
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: 4 · deploy (APROBACIÓN REQUERIDA)
    needs: validate
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production          # required reviewers se configuran en GitHub
      url: https://iptv-ape.duckdns.org
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Deploy atómico con backup
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          bash "$DEPLOY_DIR/deploy.sh" --apply --yes | tee deploy.log
      - name: Recordar el stamp del backup
        id: stamp
        run: |
          set -euo pipefail
          STAMP="$(grep -oE '[0-9]{8}T[0-9]{6}Z' deploy.log | tail -1 || true)"
          if [ -z "$STAMP" ]; then
            echo "::error::deploy.sh no reportó stamp; el rollback no podrá apuntar a esta corrida"
            exit 1
          fi
          echo "value=${STAMP}" >> "$GITHUB_OUTPUT"      # <- lo consume el job rollback
          echo "DEPLOY_STAMP=${STAMP}" >> "$GITHUB_ENV"  # <- pasos siguientes de este job
          printf '%s\n' "$STAMP" > deploy-stamp.txt      # <- artefacto para revisiones
          echo "backup stamp = ${STAMP}"
      - name: Publicar el stamp (por si el job pierde el contexto)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-stamp
          path: deploy-stamp.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          retention-days: 30

  # ── 5 · VERIFY (smoke, solo GET) ─────────────────────────────────────────
  verify:
    name: 5 · verify (smoke read-only)
    needs: deploy
    # t91: corre TAMBIÉN en dry-run (línea base del VPS antes de tocar nada).
    # Con `always()` no se salta porque `deploy` esté skipped; solo se abstiene
    # si el deploy falló, porque entonces manda el rollback.
    if: always() && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # [t113] GATE DE PARIDAD sha256 — tras el checkout (necesita el árbol del repo).
      - name: PARIDAD sha256 repo vs manifiesto (deploy_parity_assert)
        run: |
          set -euo pipefail
          node _vps_stage/tests/deploy_parity_assert.js
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Smoke del VPS
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          bash "$DEPLOY_DIR/verify.sh"

  # ── 6 · ROLLBACK (solo si deploy o verify fallan, en mode=deploy) ────────
  # t91: este job había perdido su id al eliminar el antiguo job de publicación
  # de lista (quedaba una cabecera `name:` huérfana en el nivel de `jobs`).
  # Recupera id y comentario. Las listas se publican desde la APP, no aquí.
  rollback:
    name: 6 · rollback (automático si deploy/verify fallan)
    needs: [deploy, verify]
    if: always() && inputs.mode == 'deploy' && (needs.deploy.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # [t113] GATE DE PARIDAD sha256 (tras checkout: necesita el árbol del repo).
      # El deploy no puede declarar success si lo instalado no es lo del repo.
      - name: PARIDAD sha256 repo vs manifiesto (deploy_parity_assert)
        run: |
          set -euo pipefail
          node _vps_stage/tests/deploy_parity_assert.js
      - name: Preparar SSH (llave efímera desde secretos)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Revertir al backup
        run: |
          set -euo pipefail
          chmod +x "$DEPLOY_DIR"/*.sh
          # t91: el stamp llega del job `deploy` (output + artefacto). Si no
          # llega, NO se adivina el "backup más reciente": se avisa y se para.
          STAMP="${{ needs.deploy.outputs.stamp }}"
          if [ -z "$STAMP" ]; then
            echo "::warning::sin stamp de esta corrida; se intenta el artefacto deploy-stamp"
            if gh run download "$GITHUB_RUN_ID" -n deploy-stamp -D /tmp/dt >/dev/null 2>&1; then
              STAMP="$(tr -d '[:space:]' < /tmp/dt/deploy-stamp.txt || true)"
            fi
          fi
          if [ -z "$STAMP" ]; then
            echo "::error::NO se revierte a ciegas: falta el stamp de esta corrida."
            echo "Backups disponibles en el VPS (elige uno y lanza rollback.sh a mano):"
            ssh "${{ secrets.VPS_USER }}@$VPS_HOST" 'ls -1d /var/backups/ape-deploy/*/ 2>/dev/null | xargs -r -n1 basename | sed "s/^/  - /"' || true
            exit 1
          fi
          echo "revirtiendo al stamp $STAMP (el de ESTA corrida)"
          bash "$DEPLOY_DIR/rollback.sh" "$STAMP" --yes
