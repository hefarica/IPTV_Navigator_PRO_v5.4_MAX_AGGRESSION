name: verify-streaming-headers

on:
  push:
    paths:
      - 'vps_jit/server.js'
      - 'tools/certify_http_200_206_302.js'
      - 'tools/verify_streaming_headers.js'
      - '.github/workflows/streaming-headers.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Certify 200/206/302
        run: node tools/certify_http_200_206_302.js
      - name: Verify critical streaming headers
        run: node tools/verify_streaming_headers.js
