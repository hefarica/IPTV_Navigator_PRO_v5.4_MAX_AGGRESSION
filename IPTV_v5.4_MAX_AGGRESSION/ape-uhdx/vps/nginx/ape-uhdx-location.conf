# ═══════════════════════════════════════════════════════════════════
# APE UHDX — Nginx locations  (incluir dentro del server{} 443 existente)
#   include /etc/nginx/snippets/ape-uhdx-location.conf;
# Nginx SOLO publica estado/manifest JSON. NO ejecuta adb ni comandos root.
# ═══════════════════════════════════════════════════════════════════

# Estado y manifiestos (estaticos, solo lectura)
location ^~ /ape-uhdx/ {
    alias /var/www/ape-uhdx/;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    limit_except GET HEAD OPTIONS { deny all; }
    autoindex off;
    try_files $uri =404;
}

# Heartbeat de entrada (opcional, solo si se usa PHP-FPM). Sin adb, sin root.
location = /ape-uhdx/heartbeat.php {
    add_header X-Content-Type-Options "nosniff" always;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/ape-uhdx/heartbeat.php;
    # Recomendado: restringir POST a origenes confiables / token en PHP.
}
