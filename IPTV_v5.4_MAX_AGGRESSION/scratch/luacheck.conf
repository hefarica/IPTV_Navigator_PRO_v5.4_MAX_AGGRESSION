include /etc/nginx/modules-enabled/*.conf;
pid /tmp/luacheck.pid;
error_log /tmp/luacheck.err;
events { worker_connections 16; }
http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    init_by_lua_block {
        local files = {
            "/tmp/f1stage/qoe_server_side_observer.lua",
            "/tmp/f1stage/qoe_flush_worker.lua",
            "/tmp/f1stage/lab_config.lua",
        }
        for _, f in ipairs(files) do
            local fn, err = loadfile(f)
            if not fn then
                error("LUA_SYNTAX_FAIL " .. f .. " :: " .. tostring(err))
            end
        end
        io.stderr:write("LUA_SYNTAX_OK all 3 files\n")
    }
}
