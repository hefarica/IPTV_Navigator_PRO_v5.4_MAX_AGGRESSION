include /etc/nginx/modules-enabled/*.conf;
pid /tmp/luacheck_f5.pid;
error_log /tmp/luacheck_f5.err;
events { worker_connections 16; }
http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    init_by_lua_block {
        local files = {
            "/tmp/f5stage/decision_engine.lua",
            "/tmp/f5stage/qoe_server_side_observer.lua",
            "/tmp/f5stage/qoe_flush_worker.lua",
        }
        for _, f in ipairs(files) do
            local fn, err = loadfile(f)
            if not fn then error("LUA_SYNTAX_FAIL " .. f .. " :: " .. tostring(err)) end
        end
    }
}
