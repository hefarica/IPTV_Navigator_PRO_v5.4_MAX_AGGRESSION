[package]
name = "hotpath-injector"
version = "0.1.0"
edition = "2021"
description = "Inyector de headers en hot-path para listas .m3u8 — streaming, O(1) por canal, EXTHTTP cap 8KB (truth-guarded)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-core = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
