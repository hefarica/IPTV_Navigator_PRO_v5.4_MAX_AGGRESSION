# APE PRISMA v2.0 — limit_conn zone for SSE stream endpoints
# ═══════════════════════════════════════════════════════════════════════
# CONTEXT: HTTP — must be loaded at HTTP context (placed under /etc/nginx/conf.d/).
# Companion: /etc/nginx/snippets/prisma-conviva-stream.conf consumes this zone.
#
# PURPOSE: Cap concurrent SSE connections per client IP to prevent DoS via
#          long-lived streams. 4/IP allows up to 4 dashboard tabs per device.
#
# 8m = 8 MiB shared memory ≈ 128k IPs tracked (more than enough for our scale).
# ═══════════════════════════════════════════════════════════════════════

limit_conn_zone $binary_remote_addr zone=prisma_stream_per_ip:8m;
