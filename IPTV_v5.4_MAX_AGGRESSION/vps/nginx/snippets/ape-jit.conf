# ═══════════════════════════════════════════════════════════════════════════════
# ape-jit.conf — PERÍMETRO PÚBLICO DEL MOTOR JIT (propuesta t42, NO aplicada)
#
# Include inside the HTTPS server for iptv-ape.duckdns.org
#   /etc/nginx/sites-enabled/default:72 → include snippets/ape-jit.conf;
#
# MOTIVO: medido el 2026-11-21 (t40), `location ^~ /jit/ { proxy_pass …:3099/; }`
# publicaba las 61 rutas del motor sin allowlist y 21 de ellas ESCRIBEN sin token
# (/jit/image/*, /jit/api/config, /jit/resolve, /jit/tune, /jit/signal, …).
# Este fichero publica SÓLO lo que un reproductor consume y devuelve 404 al resto.
#
# PRECEDENCIA NGINX (la clave del diseño):
#   1. `location =`  (coincidencia exacta)  — máxima prioridad
#   2. `location ^~` (prefijo) → si casa, NO se evalúan regex
#   3. `location ~`  (regex)                — gana al prefijo normal
#   4. `location /…` (prefijo normal)       — último recurso
# Por eso el cierre final es `location /jit/` SIN `^~`: así los regex de §3
# (playlist-calidad-<sufijo>, lists/<n>) siguen funcionando y lo demás cae en 404.
#
# ⚠️ REGLA APRENDIDA A LA MALA (2026-11-21, incidente en producción, 404 en las
#    listas durante ~2 min hasta el rollback): `proxy_pass …:3099/;` con barra
#    final SÓLO quita el prefijo cuando el `location` es el prefijo `/jit/`. En
#    un `location =` o en un `location ~` el path casado se reemplaza ENTERO por
#    `/`, y el motor recibe `/` → su 404 `not found` (9 B). Por eso TODAS las
#    locations de este fichero hacen `rewrite ^/jit/(.*)$ /$1 break;` y pasan el
#    proxy SIN URI. Verificado con nginx -t + medición desde fuera antes de dar
#    por bueno cualquier cambio.
#
# NOTA: `proxy_pass http://127.0.0.1:3099/;` con barra final QUITA el prefijo
# `/jit`, que es lo que el motor espera (sus rutas son `/recipe`, `/live/...`).
#
# [2026-11-14] contexto original: las dos rutas del menú «REA · Catálogo JIT»
# daban 404 porque el prefijo iba al motor y los catálogos no se habían generado.
# Se resolvió sirviendo la lista cableada estática; eso se conserva en §1.
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1 · Las dos listas del menú «REA · Catálogo JIT» (estáticas, ya en prod) ───
# Se conservan TAL CUAL: no van al motor y el operador las pega en OTT/TiviMate.
location = /jit/playlist-calidad.m3u8 {
    alias /var/www/html/lists/ape_jit_latest.m3u8;
    add_header Content-Type "application/vnd.apple.mpegurl" always;
    add_header Cache-Control "no-store" always;
    add_header Keep-Alive "timeout=5, max=100" always;
    add_header X-APE-Jit-Source "lista cableada (ape-jit-latest)" always;
    add_header Access-Control-Allow-Origin "*" always;
    gzip_static on;
}

location = /jit/playlist-resolver.m3u8 {
    alias /var/www/html/lists/ape_jit_latest.m3u8;
    add_header Content-Type "application/vnd.apple.mpegurl" always;
    add_header Cache-Control "no-store" always;
    add_header Keep-Alive "timeout=5, max=100" always;
    add_header X-APE-Jit-Source "lista cableada (ape-jit-latest)" always;
    add_header Access-Control-Allow-Origin "*" always;
    gzip_static on;
}

# ── 2 · Listas y metadatos que SÍ sirve el motor y SÍ consume el cliente ───────
# Evidencia de consumo (repo):
#   frontend/js/ape-v9/generation-output-panel.js:1266  → /jit/playlist.m3u8
#   frontend/js/ape-v9/generation-output-panel.js:136   → /jit/catalog.json
#   frontend/js/ape-v9/generation-output-panel.js:1276  → /jit/capabilities.json
#   frontend/js/ape-v9/m3u8-typed-arrays-ultimate.js:3279 → /jit/live/{id}/manifest.mpd
# Rutas del motor: server.js:6442 (/playlist.m3u8), 6470 (shim), 6418 (idempotente),
# 6403 (playlist-calidad-<sufijo>), 6522 (/lists/<n>.m3u8), 9610/9636 (/live/…).
location = /jit/playlist.m3u8 { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; proxy_send_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/playlist-shim.m3u8 { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; proxy_send_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/playlist-idempotente.m3u8 { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; proxy_send_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/APE_JIT_LIST_IDEMPOTENTE.m3u8 { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; proxy_send_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/catalog.json { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/capabilities.json { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/crystal.json { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/health { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 15s; add_header Access-Control-Allow-Origin "*" always; }

location = /jit/recipe { rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Keep-Alive; proxy_read_timeout 65s; add_header Access-Control-Allow-Origin "*" always; }

# ── 3 · Catálogos con sufijo y listas del motor (regex) ───────────────────────
# Ganan al `location /jit/` final porque un prefijo NORMAL no bloquea las regex.
#
# [CORRECCIÓN 2026-11-21 · nginx -t lo rechazó] En un `location ~` (regex)
# `proxy_pass` NO puede llevar parte URI: nginx aborta con
#   "proxy_pass" cannot have URI part in location given by regular expression
# La forma válida es reescribir el prefijo y pasar el proxy SIN URI: el
# `rewrite … break` deja el URI ya normalizado (/playlist-… en vez de /jit/…).
location ~ ^/jit/(playlist-calidad-[A-Za-z0-9_-]+\.m3u8)$ {
    rewrite ^/jit/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Keep-Alive;
    proxy_read_timeout 65s;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~ ^/jit/(lists/[A-Za-z0-9._-]+\.m3u8)$ {
    rewrite ^/jit/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Keep-Alive;
    proxy_read_timeout 65s;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── 4 · LIVE: manifiestos y segmentos del canal (prefijo ^~) ─────────────────
# Cubre /jit/live/<id>/manifest.json, master.m3u8, index.m3u8, manifest.mpd,
# media_N.m3u8, init-*.m4s y chunk-*. El `^~` evita que otras regex lo capturen.
location ^~ /jit/live/ {
    rewrite ^/jit/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Keep-Alive;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── 5 · CIERRE: todo lo demás de /jit/ NO se publica ─────────────────────────
# Aquí caen, entre otras, las 21 rutas que escriben sin token:
#   /jit/image/*, /jit/api/config, /jit/resolve, /jit/tune, /jit/signal,
#   /jit/go/*, /jit/jit/*, /jit/meta/*, /jit/upscale, /jit/serial
# 404 explícito y con texto propio (no el 404 genérico del motor) para que la
# verificación desde fuera distinga «cerrado por nginx» de «no existe».
# SIN `^~`: así las regex de §3 se evalúan antes que este prefijo.
location /jit/ {
    add_header Cache-Control "no-store" always;
    return 404 "jit: ruta no publicada\n";
}

# ── 6 · ADMINISTRACIÓN (OPCIONAL, DESACTIVADA) ───────────────────────────────
# Si el operador necesita /jit/image/* y /jit/api/* desde SU IP, descomentar y
# poner sus direcciones. Sin esto, la administración se hace por SSH/localhost:
# el motor escucha en 127.0.0.1:3099 y no hace falta pasar por nginx 443.
