# ═══════════════════════════════════════════════════════════════════════════════
# APE LANDING · PARTE A — clasificación de User-Agent  [contexto http{}]
# ═══════════════════════════════════════════════════════════════════════════════
# `map` SÓLO es válido en http{} (no en server{} ni en location{}).
# Incluir este archivo UNA vez dentro de http{}:
#
#     http {
#         include /etc/nginx/snippets/ape-landing-map.conf;
#         ...
#     }
#
# El endpoint (location) vive en ape-landing.conf y va dentro del server{}.
# Esta partición no es una preferencia: nginx rechaza `map` fuera de http{} y
# `location` fuera de server{}. Ver docs/rea/17_LANDING_INTENT.md §2.
#
# Regla de decisión: navegador => HTML de landing. Player => 302 a un manifiesto
# mínimo con un frame estático que pide abrir el navegador. NUNCA se sirve HTML
# como si fuera vídeo (un player que recibe text/html falla el parseo del manifest).
# ═══════════════════════════════════════════════════════════════════════════════

map $http_user_agent $ape_ua_class {
    default                 "browser";   # UA vacío/desconocido => navegador (conservador)

    # Players nativos y librerías de reproducción (más específico primero).
    "~*TiviMate"            "player";
    "~*OTT\s*Navigator"     "player";
    "~*OTTNavigator"        "player";
    "~*IPTV\s*Smarters"     "player";
    "~*ExoPlayer"           "player";
    "~*okhttp"              "player";    # UA por defecto de ExoPlayer/OkHttp
    "~*Kodi"                "player";
    "~*Lavf"                "player";    # libavformat (ffmpeg/VLC interno)
    "~*VLC"                 "player";
    "~*libmpv"              "player";
    "~*mpv"                 "player";
    "~*stagefright"         "player";    # MediaPlayer de Android
}
