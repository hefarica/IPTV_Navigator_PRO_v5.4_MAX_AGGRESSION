# ═══════════════════════════════════════════════════════════════════════════════
# APE LANDING · PARTE B — endpoint /ape/install  [contexto server{}]
# ═══════════════════════════════════════════════════════════════════════════════
# Incluir DENTRO del server{} que ya sirve el plano de metadata:
#
#     server {
#         include /etc/nginx/snippets/ape-landing.conf;
#     }
#
# REQUISITO: `ape-landing-map.conf` ya incluido en http{} (define $ape_ua_class).
# Sin ese map, `if ($ape_ua_class = player)` nunca coincide y todos reciben HTML
# (el player rompería). Verificar con `nginx -t` antes de recargar.
#
# Mapeo de ficheros (repo -> host):
#   IPTV_v5.4_MAX_AGGRESSION/vps/landing/            -> /var/www/html/ape/
#   (misma raíz que el APK ya publicado: prisma-ara-dist.conf:22 /var/www/html/ara/)
#
# Este snippet NO expone rutas internas: no hay autoindex, no hay listado, no se
# emiten rutas del filesystem y no se proxya nada.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Endpoint principal: 1 sola URL para navegador y player ─────────────────────
location = /ape/install {
    # `if` + `return` es la forma SEGURA de `if` en nginx (no hay fase de rewrite
    # ambigua: no se usa `if` para directivas de contenido).
    if ($ape_ua_class = player) {
        add_header Cache-Control "no-store" always;
        add_header X-APE-Landing "player" always;
        return 302 /ape/landing/player-only/master.m3u8;
    }

    alias /var/www/html/ape/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-APE-Landing "browser" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# ── Landing (HTML estático) ───────────────────────────────────────────────────
location = /ape/landing/index.html {
    alias /var/www/html/ape/index.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-APE-Landing "browser" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# ── Manifiestos del frame estático (para players) ─────────────────────────────
location ^~ /ape/landing/player-only/ {
    alias /var/www/html/ape/player-only/;
    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-APE-Landing "player-manifest" always;
    autoindex off;
}

# ── Sin listados ni acceso al resto del árbol de landing ──────────────────────
location ^~ /ape/ {
    return 404;
}
