
# APE/Omega open: records zap metadata, then redirects player to provider URL. No segment proxy.
location = /omega/open {
    proxy_pass http://127.0.0.1:45732/omega/open;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, X-APE-Session-ID, X-APE-Channel-ID" always;
    add_header Cache-Control "no-store" always;
    add_header X-APE-Metadata-Only "true" always;
    add_header X-APE-No-Video-Proxy "true" always;
    add_header X-APE-Quality-Contract "quality-up-only" always;
    # A2 — device->canal por IP real (autopista, fase log: jamas bloquea, jamas toca el 302).
    log_by_lua_file /etc/nginx/lua/ape_device_state_writer.lua;
    if ($request_method = OPTIONS) { return 204; }
}


