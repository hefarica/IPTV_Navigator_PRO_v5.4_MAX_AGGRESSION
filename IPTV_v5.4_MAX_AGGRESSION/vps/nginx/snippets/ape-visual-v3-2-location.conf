# APE Visual Engine V3.2.1 — session/zapping orchestration API.
# Metadata-only: no video proxying, no stream rewriting, no transcoding.
location = /omega/session/create {
    proxy_pass http://127.0.0.1:3322/omega/session/create;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Range, Content-Type, Accept, Cache-Control, x-playback-session-id, X-APE-Session-ID, X-APE-Channel-ID" always;
    add_header X-APE-Visual-Engine "v3.2-session-orchestrated" always;
    add_header X-APE-Metadata-Mode "session-create" always;
}

location ^~ /omega/session/ {
    proxy_pass http://127.0.0.1:3322/omega/session/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Range, Content-Type, Accept, Cache-Control, x-playback-session-id, X-APE-Session-ID, X-APE-Channel-ID" always;
    add_header X-APE-Visual-Engine "v3.2-session-orchestrated" always;
    add_header X-APE-Metadata-Mode "session-zapping-telemetry" always;
}

# APE Visual Engine V3.2 metadata endpoints — accumulative, non-destructive.
# These locations serve JSON metadata only. They never proxy, transcode or modify provider streams.

location ^~ /omega/package/ {
    alias /opt/ape/visual-engine-v3-2/runtime/package/;
    default_type application/json;
    charset utf-8;
    gzip on;
    etag off;
    open_file_cache off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Range, Content-Type, Accept, Cache-Control, If-None-Match, If-Modified-Since, x-playback-session-id, x-ape-signature, ape-security-token, x-request-profile, X-Prisma-Key" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Cache-Control, Last-Modified, X-APE-Visual-Engine, X-APE-Metadata-Mode" always;
    add_header Cache-Control "public, max-age=2, stale-while-revalidate=2, must-revalidate" always;
    add_header X-APE-Visual-Engine "v3.2" always;
    add_header X-APE-Metadata-Mode "package" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET HEAD OPTIONS { deny all; }
}

