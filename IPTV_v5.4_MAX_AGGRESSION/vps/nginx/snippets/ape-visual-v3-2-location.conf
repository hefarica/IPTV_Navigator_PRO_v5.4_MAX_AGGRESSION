# APE universal M3U8 V3.3: polymorphic list recognition and metadata-only tune endpoints.
# This proxies only JSON/control metadata to the local daemon. It never proxies provider video URLs.
location ^~ /omega/m3u8/ {
    proxy_pass http://127.0.0.1:3322;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-APE-Media-Path-Policy "provider-direct,no-vps-video-proxy,no-transcode";
    add_header X-APE-Universal-M3U8 "polymorphic-idempotent-heuristic" always;
    add_header X-APE-Media-Path-Policy "provider-direct,no-vps-video-proxy,no-transcode" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Range, Content-Type, Accept, Cache-Control, x-playback-session-id, X-APE-Session-ID, X-APE-Channel-ID" always;
}
