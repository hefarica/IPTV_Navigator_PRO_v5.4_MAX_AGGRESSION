# ══════════════════════════════════════════════════════════════════════════
# APE — Installer + Wake locations (incluir DENTRO del server{} de prisma)
#   include snippets/prisma-ape-installer-location.conf;
# Sirve el bootstrap por URL (curl|sh desde host con ADB) + el wake beacon.
# Autopista-safe: solo sirve archivos estáticos + un log_by_lua NO bloqueante.
# Deploy: colocar los .sh bajo /var/www/html/prisma/install/ (root abajo).
# ══════════════════════════════════════════════════════════════════════════

# Instalador one-shot (curl -fsSL .../prisma/install/ape-daemon.sh | sh)
location = /prisma/install/ape-daemon.sh {
    default_type text/x-shellscript;
    add_header Cache-Control "no-cache" always;
    alias /var/www/html/prisma/install/ape-daemon-bootstrap.sh;
}

# Perfil/daemon polimórfico que el bootstrap descarga si no está local
location = /prisma/install/generic_player.sh {
    default_type text/x-shellscript;
    add_header Cache-Control "no-cache" always;
    alias /var/www/html/prisma/install/generic_player.sh;
}

# Wake beacon explícito (opcional): el anchor del .m3u8 puede apuntar aquí.
# PHP localhost-only escribe la cola de wake. NUNCA bloquea reproducción.
location = /prisma/api/ape-wake.php {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;   # ajustar al socket real del VPS
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/ape-wake.php;
    add_header Cache-Control "no-store" always;
}
