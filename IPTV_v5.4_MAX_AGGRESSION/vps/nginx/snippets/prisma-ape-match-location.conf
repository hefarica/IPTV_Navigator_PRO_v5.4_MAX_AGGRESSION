# ══════════════════════════════════════════════════════════════════════════
# APE — MATCH endpoint location (iData loop esperado-vs-real). RATE-LIMIT OBLIGATORIO.
# El daemon postea OUTBOUND el iData (esperado+real) y recibe la carga China Box en la respuesta.
#
# 1) En http{} (nginx.conf), UNA vez:
#      limit_req_zone $binary_remote_addr zone=ape_match:1m rate=120r/m;
#    (más alto que ape_pull: hay 1 MATCH por zap; burst cubre ráfagas de zapping)
# 2) Dentro del server{} de prisma (443):
#      include snippets/prisma-ape-match-location.conf;
# ══════════════════════════════════════════════════════════════════════════
location = /prisma/api/ape-match.php {
    limit_req zone=ape_match burst=20 nodelay;       # anti fuerza-bruta token + anti FPM-exhaustion
    limit_req_status 429;
    access_log off;                                  # el token (header Bearer) NO debe quedar en logs
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;      # ajustar al socket real del VPS
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/ape-match.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # pasar el header Bearer al PHP-FPM
    fastcgi_read_timeout 8s;                         # cap < SLO; no retener worker (autopista)
    add_header Cache-Control "no-store" always;      # nunca cachear la carga (es per-zap, real-time)
}
