# ══════════════════════════════════════════════════════════════════════════
# APE — Pull endpoint location (canal de comandos outbound). RATE-LIMIT OBLIGATORIO.
# [sec review 2026-06-09 HIGH#3] — sin este bloque el long-poll puede agotar PHP-FPM.
#
# 1) En http{} (nginx.conf), UNA vez:
#      limit_req_zone $binary_remote_addr zone=ape_pull:1m rate=30r/m;
# 2) Dentro del server{} de prisma (443):
#      include snippets/prisma-ape-pull-location.conf;
# ══════════════════════════════════════════════════════════════════════════
location = /prisma/api/ape-pull.php {
    limit_req zone=ape_pull burst=10 nodelay;        # anti fuerza-bruta de token + anti FPM-exhaustion
    limit_req_status 429;
    access_log off;                                  # [HIGH#1] el token (header) NO debe quedar en logs
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;      # ajustar al socket real del VPS
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/ape-pull.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # pasar el header Bearer al PHP-FPM
    fastcgi_read_timeout 8s;                         # cap < wait máx (5s) + margen; no retener worker
    add_header Cache-Control "no-store" always;
}
