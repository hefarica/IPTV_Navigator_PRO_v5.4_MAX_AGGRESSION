# OMEGA ARA — distribucion del APK launcher-shield (F0).
# ═══════════════════════════════════════════════════════════════════════
# Incluir DENTRO del server-block publico HTTPS vivo (sites-available/default):
#     include snippets/prisma-ara-dist.conf;
#   `nginx -t` antes de reload. Archivos servidos desde /var/www/html/ara/.
#
#   /ara/install    -> landing para el navegador del TV (descarga + pasos 1a vez)
#   /ara/agent.apk  -> el APK firmado (publicado al hacer build)
#   /ara/version    -> {versionCode,versionName,sha256}  (self-update del APK)
# ═══════════════════════════════════════════════════════════════════════

location = /ara/install {
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    alias /var/www/html/ara/install.html;
}

location = /ara/agent.apk {
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    alias /var/www/html/ara/agent.apk;
}

location = /ara/version {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    alias /var/www/html/ara/version.json;
}
