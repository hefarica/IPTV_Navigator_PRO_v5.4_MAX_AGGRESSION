# OMEGA ARA URL-2 — endpoint de auto-enrolamiento WireGuard /ara/enroll (F0).
# ═══════════════════════════════════════════════════════════════════════
# CONTEXT: SERVER — incluir DENTRO del server-block publico HTTPS vivo (sites-available/default):
#     include snippets/prisma-ara-enroll.conf;
#   Correr `nginx -t` antes de reload. Modelado 1:1 sobre prisma-ara-events.conf.
#
# El secreto NO esta aqui: lo valida ara-enroll.php contra env APE_ENROLL_SECRET del pool php-fpm.
#   echo 'env[APE_ENROLL_SECRET] = <secreto-largo-random>' >> /etc/php/8.3/fpm/pool.d/www.conf && systemctl reload php8.3-fpm
# El worker root (ape-enroll-worker.service) hace el `wg set` + persistencia. www-data NO toca root.
# ═══════════════════════════════════════════════════════════════════════

location = /ara/enroll {
    limit_except POST OPTIONS { deny all; }
    limit_conn  prisma_stream_per_ip 4;     # reusa zona existente (prisma-stream-zone.conf)

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    if ($request_method = OPTIONS) { return 204; }

    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/ara-enroll.php;
    fastcgi_param SCRIPT_NAME     /ara/enroll;
    fastcgi_read_timeout 15s;               # el worker es sub-segundo; el php hace poll ~6s
}
