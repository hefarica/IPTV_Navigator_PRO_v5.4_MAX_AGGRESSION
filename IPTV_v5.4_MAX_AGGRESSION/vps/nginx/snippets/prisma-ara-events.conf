# OMEGA ARA URL-2 — SSE endpoint /ara/events (Council-safe snippet).
# ═══════════════════════════════════════════════════════════════════════
# CONTEXT: SERVER — include INSIDE the live public HTTPS server block:
#     include snippets/prisma-ara-events.conf;
#   Do NOT redeclare /prisma/api/conviva-event here. Run `nginx -t` before reload.
#   Modeled 1:1 on the proven prisma-conviva-stream.conf (long-lived SSE).
#
# AUTOPISTA SOP: read-only, never touches shield traffic, buffering OFF (SSE flush),
#   GET-only, auth enforced in PHP (Bearer), bounded execution (3600s PHP cap).
# MUST-FIX applied vs the raw cherry-pick:
#   - socket /run/php/php-fpm.sock -> /run/php/php8.3-fpm.sock (real VPS socket)
#   - limit_conn (DoS cap) + GET-only + HTTP_AUTHORIZATION passthrough
# ═══════════════════════════════════════════════════════════════════════

location = /ara/events {
    limit_except GET OPTIONS { deny all; }
    limit_conn  prisma_stream_per_ip 4;   # reuse existing zone (prisma-stream-zone.conf)

    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-APE-ARA-Events "v1.0" always;

    # SSE requires keepalive + zero buffering on every layer
    proxy_buffering off;
    proxy_cache off;
    fastcgi_buffering off;
    fastcgi_request_buffering off;
    fastcgi_keep_conn on;
    fastcgi_read_timeout 3700s;
    fastcgi_send_timeout 90s;
    send_timeout 90s;
    chunked_transfer_encoding on;
    gzip off;

    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/events-sse.php;
    fastcgi_param SCRIPT_NAME     /ara/events;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param PHP_VALUE "max_execution_time=3700\noutput_buffering=0\nzlib.output_compression=Off\nimplicit_flush=1";
}
