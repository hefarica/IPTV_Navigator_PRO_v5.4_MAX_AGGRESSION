# APE PRISMA v2.0 — Conviva QoE Event Endpoint Location
# ═══════════════════════════════════════════════════════════════════════
# CONTEXT: SERVER — included INSIDE the public HTTPS server block.
# Companion: /etc/nginx/conf.d/prisma-public-api-zone.conf defines prisma_api zone.
#
# PURPOSE: Expose POST endpoint for Conviva QoE telemetry events from ADB push.
#   Receiver: /var/www/html/prisma/api/conviva-event.php (PHP-FPM 8.3)
#   Handler:  ConvivaQoEServer + ConvivaPersistence (SQLite + /dev/shm buffer)
#
# AUTOPISTA SOP COMPLIANT (per feedback_autopista_doctrine):
#   ✅ Telemetry-only — no body mutation, no upstream traffic, no shield interference
#   ✅ Rate limited 10r/s burst=10 nodelay (per device · enough for legitimate ADB push)
#   ✅ POST-only — GET/HEAD/etc rejected with 403 (via limit_except)
#   ✅ CORS scoped to https://iptv-ape.duckdns.org (local frontend)
#   ✅ No ngx.exit, no blocking, no interference with shield traffic
# ═══════════════════════════════════════════════════════════════════════

# ── Conviva QoE Event POST API ───────────────────────────────────────
location = /prisma/api/conviva-event {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=prisma_api burst=10 nodelay;

    # CORS headers (preflight + actual response)
    add_header Access-Control-Allow-Origin "https://iptv-ape.duckdns.org" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-APE-Device-Id" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header X-Conviva-Endpoint "v1.0-phase2" always;

    # OPTIONS preflight short-circuit
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://iptv-ape.duckdns.org";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-APE-Device-Id";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        return 204;
    }

    # Body size limit — events are small JSON (~1 KB typical · 16 KB headroom)
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # Direct fastcgi_pass — bypass fastcgi-php.conf's try_files (URI has no .php suffix).
    # SCRIPT_FILENAME is set explicitly to the receiver file.
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/conviva-event.php;
    fastcgi_param SCRIPT_NAME     /prisma/api/conviva-event.php;
    fastcgi_param PHP_VALUE       "max_execution_time=10";
}
