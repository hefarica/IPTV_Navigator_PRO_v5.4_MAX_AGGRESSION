# APE PRISMA v2.0 — Conviva QoE Live Stream (SSE) Location
# ═══════════════════════════════════════════════════════════════════════
# CONTEXT: SERVER — included INSIDE the public HTTPS server block.
# Companion zone: /etc/nginx/conf.d/prisma-stream-zone.conf (limit_conn_zone)
#
# PURPOSE: SSE bridge that pushes Conviva events from /dev/shm/conviva-events.log
#   (Phase 2 producer) to a browser dashboard widget (Phase 3.2 consumer).
#   Receiver: /var/www/html/prisma/api/conviva-stream.php (PHP-FPM 8.3, long-lived)
#
# AUTOPISTA SOP COMPLIANT (per feedback_autopista_doctrine):
#   ✅ Read-only — never touches shield traffic, no upstream calls, no body mutation.
#   ✅ NO limit_req — streams hold one connection for ~5 min, rate limiting causes
#      spurious 503s on legitimate reconnects. Use limit_conn instead.
#   ✅ limit_conn 4/IP — caps concurrent SSE per client (4 tabs max), no DoS surface.
#   ✅ GET-only — POST/PUT/etc rejected with 403.
#   ✅ CORS scoped to https://iptv-ape.duckdns.org.
#   ✅ proxy/fastcgi buffering OFF + X-Accel-Buffering:no header — SSE requires flush.
#   ✅ fastcgi_read_timeout 300s ≥ MAX_STREAM_SECONDS (290s) in PHP receiver.
#   ✅ Bounded execution at PHP layer (290s hard cap + EventSource auto-reconnect).
# ═══════════════════════════════════════════════════════════════════════

# ── Conviva QoE Live Stream (SSE) ────────────────────────────────────
location = /prisma/api/conviva-stream {
    limit_except GET OPTIONS { deny all; }
    limit_conn  prisma_stream_per_ip 4;

    # CORS headers (preflight + actual response)
    add_header Access-Control-Allow-Origin "https://iptv-ape.duckdns.org" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Last-Event-ID, Cache-Control" always;
    add_header Cache-Control "no-cache, no-store" always;
    add_header X-Accel-Buffering "no" always;
    add_header X-Conviva-Stream "v1.0" always;

    # OPTIONS preflight short-circuit
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://iptv-ape.duckdns.org";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Last-Event-ID, Cache-Control";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        return 204;
    }

    # SSE requires keepalive + zero buffering on every layer
    proxy_buffering off;
    proxy_cache off;
    fastcgi_buffering off;
    fastcgi_keep_conn on;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    chunked_transfer_encoding on;
    gzip off;

    # Direct fastcgi_pass — explicit SCRIPT_FILENAME bypasses fastcgi-php.conf's
    # try_files trap (URI has no .php suffix).
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/conviva-stream.php;
    fastcgi_param SCRIPT_NAME     /prisma/api/conviva-stream.php;
    fastcgi_param PHP_VALUE       "max_execution_time=300\noutput_buffering=0\nzlib.output_compression=Off\nimplicit_flush=1";
}
