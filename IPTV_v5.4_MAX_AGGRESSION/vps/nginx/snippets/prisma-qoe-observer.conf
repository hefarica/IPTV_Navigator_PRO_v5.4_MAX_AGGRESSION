# ═══════════════════════════════════════════════════════════════════════════
# Server-Side QoE Observer Activation Block — Conviva-equivalent for native players
# ═══════════════════════════════════════════════════════════════════════════
#
# This snippet activates the qoe_server_side_observer.lua hook on stream
# locations (manifest .m3u8 + segments .ts/.m4s). It runs in log_by_lua phase
# so it CANNOT affect request latency — strict autopista compliance.
#
# WHAT IT DOES:
#   1. Per request, observes URI pattern + timing + status + bytes
#   2. Computes VST_proxy (manifest fetch → first segment) per (client, channel)
#   3. Detects rebuffer (gap between segments > 15s)
#   4. Tracks error rate + bitrate per channel
#   5. Flags HDCP-fail channels (3 consecutive VST > 3000ms)
#   6. Periodic flush to /prisma/api/qoe-flush.php via qoe_flush_worker.lua
#
# ACTIVATION (1 of 2 patterns):
#
#  Pattern A — chained from bandwidth_reactor.lua (REQUIRED for single log_by_lua_file rule):
#    Since Nginx only allows a single log_by_lua_file directive per location,
#    the observer is dynamically chained at the end of bandwidth_reactor.lua via:
#
#      pcall(dofile, "/etc/nginx/lua/qoe_server_side_observer.lua")
#
#    Do NOT add log_by_lua_file for the observer directly.
#
# DEPENDENCIES:
#   - lua_shared_dict qoe_metrics 8m;            ← http block, BEFORE this snippet
#   - init_worker_by_lua_file qoe_flush_worker.lua; ← http block
#   - libnginx-mod-http-lua installed (already on this VPS per phase35 deploy)
#
# DEPLOY CHECKLIST (per iptv-vps-touch-nothing):
#   1. Snapshot nginx config: `nginx -T > /tmp/nginx-pre-qoe-$(date +%s).conf`
#   2. scp the 2 .lua files to /etc/nginx/lua/
#   3. scp this snippet to /etc/nginx/snippets/
#   4. Add `lua_shared_dict qoe_metrics 8m;` to nginx.conf http block
#   5. Add `init_worker_by_lua_file /etc/nginx/lua/qoe_flush_worker.lua;` after it
#   6. (Observer is chained dynamically inside bandwidth_reactor.lua, no location changes needed)
#   7. `nginx -t` (NOT reload yet)
#   8. `nginx -s reload` (NOT restart — no proxy_cache_path change)
#   9. 15-min observation window: `tail -f /var/log/nginx/error.log`
#  10. Verify shared_dict populates: `curl localhost/prisma/api/qoe-flush.php`
#      should return localhost_only=403 (means endpoint reachable)
# ═══════════════════════════════════════════════════════════════════════════

# The direct directive is disabled because it conflicts with bandwidth_reactor.lua's log_by_lua_file.
# The observer is automatically chained from bandwidth_reactor.lua.
# log_by_lua_file /etc/nginx/lua/qoe_server_side_observer.lua;

