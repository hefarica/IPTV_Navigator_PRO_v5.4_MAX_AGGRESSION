# URL-2 cartucho — "todo embebido en una URL".
#
# /url2/<cualquier-cosa>.m3u8?u=<url_verbatim>&p=P0..P5[&n=&g=&id=&logo=&mode=]
#   -> reescribe a /prisma/api/url2-cartridge.php y preserva el query string.
#
# POR QUÉ LA EXTENSIÓN .m3u8 ES OBLIGATORIA
#   VLC (y otros) eligen el demux por EXTENSIÓN, no por Content-Type:
#   con .php => "MOD validation failed (ext=php)" / "couldn't guess format"
#   y el cartucho se descarga (200) pero NO se reproduce. Con .m3u8 => demux HLS.
#
# Precedencia: ^~ evita que el regex `location ~* \.m3u8$` (gzip_static de las
# listas en disco) capture esta ruta. Aditivo: no toca /lists/, ni /sync, ni /ara.
location ^~ /url2/ {
    rewrite ^/url2/[^/]+\.m3u8$ /prisma/api/url2-cartridge.php last;
    return 404;
}
