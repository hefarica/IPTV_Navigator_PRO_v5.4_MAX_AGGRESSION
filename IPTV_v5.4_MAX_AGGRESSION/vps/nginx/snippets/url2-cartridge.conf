# URL-2 cartucho — "todo embebido en una URL".
#
# /url2/<cualquier-cosa>.m3u8?u=<url_verbatim>&p=P0..P5[&n=&g=&id=&logo=&mode=]
#   -> reescribe a /prisma/api/url2-cartridge.php y preserva el query string.
#
# POR QUÉ LA EXTENSIÓN .m3u8 ES OBLIGATORIA
#   VLC (y otros) eligen el demux por EXTENSIÓN, no por Content-Type:
#   con .php => "MOD validation failed (ext=php)" / "couldn't guess format"
#   y el cartucho se descarga (200) pero NO se reproduce. Con .m3u8 => demux HLS.
#
# Precedencia: ^~ evita que el regex `location ~* \.m3u8$` (gzip_static de las
# listas en disco) capture esta ruta. Aditivo: no toca /lists/, ni /sync, ni /ara.
location ^~ /url2/ {
    rewrite ^/url2/[^/]+\.m3u8$ /prisma/api/url2-cartridge.php last;
    return 404;
}

# /pulse/<canal>.m3u8?u=...&d=...&z=1&m=redirect|cartridge
#   -> /prisma/api/pulse.php: registra el pulso y responde 302 (redirect) o el
#      cartucho completo (200). Misma razón de la extensión: el player elige el
#      demux por EXTENSIÓN; en mode=cartridge la URL DEBE acabar en .m3u8.
# El canary one-shot está APAGADO por defecto (flag /etc/ara/pulse/canary.enabled).
location ^~ /pulse/ {
    rewrite ^/pulse/[^/]+\.m3u8$ /prisma/api/pulse.php last;
    return 404;
}

# Listas YA envueltas con /pulse (las genera ape-pulse-sync.timer cada 5 min
# para TODA lista servida). Sólo lectura; los originales no se tocan.
location ^~ /pulse-lists/ {
    alias /var/www/lists/pulse/;
    index off;
    autoindex off;
    default_type application/vnd.apple.mpegurl;
    types { application/vnd.apple.mpegurl m3u8; }
    gzip_static on;
    gzip off;
    add_header Cache-Control "no-store" always;
}

# /lists/<lista>.m3u8 -> sirve la versión ENVUELTA con /pulse si existe; si no,
# la original. Dos motivos medidos 2026-11-05:
#   1) El player reproduce la URL de /lists/ (la que el operador ya usa), así que
#      sin esto /pulse NUNCA ve el zapping y no hay telemetría ni canary.
#   2) Las listas "placeholder" (8 B + .gz) devolvían 8 B (#EXTM3U) a cualquier
#      cliente sin Accept-Encoding gzip => lista vacía. La envuelta es un fichero
#      real completo, así que ese fallo desaparece.
# Va ANTES del `location ~* \.m3u8$` del server block (regex en orden de aparición).
location ~ ^/lists/(?<ape_list>[A-Za-z0-9._-]+)\.m3u8$ {
    root /var/www;
    try_files /lists/pulse/$ape_list.m3u8 /lists/$ape_list.m3u8 =404;
    default_type application/vnd.apple.mpegurl;
    gzip_static on;
    gzip off;
    add_header Cache-Control "no-store" always;
    add_header X-APE-List-Source "pulse-wrapped-if-present" always;
}

