# 10-ape-restart.conf — drop-in de nginx (NO sustituye el unit del paquete)
#
# MOTIVO MEDIDO (2026-11-15): `systemctl show nginx -p Restart` devolvia `no`. nginx
# sirve las listas y los segmentos del flujo entero; si el proceso muere (OOM, fallo
# de un worker, reload roto) systemd NO lo levanta y el VPS se queda sin plano de
# servicio hasta que alguien entra. Eso es exactamente el "se caen de manera
# inadvertida" que el operador denuncia.
#
# Se hace por drop-in para no tocar /lib/systemd/system/nginx.service del paquete: un
# upgrade de nginx no pisa este fichero, y quitarlo (rm) revierte el comportamiento.

[Service]
Restart=on-failure
RestartSec=5s
# Un nginx que falla, se levanta y vuelve a fallar en bucle es peor que uno parado:
# se limita a 5 intentos en 60 s y luego se deja en failed para que se vea en el gate.
StartLimitIntervalSec=60s
StartLimitBurst=5