# 10-ape-restart.conf — drop-in de php8.3-fpm (NO sustituye el unit del paquete)
#
# MOTIVO MEDIDO (2026-11-15): `systemctl show php8.3-fpm -p Restart` devolvia `no`.
# php-fpm ejecuta TODOS los endpoints del flujo (pulse.php, los feedforward, los
# endpoints de estado). Si el master muere, los workers se van y cada /pulse/ empieza a
# dar 502: el reproductor se queda sin manifest. Igual que con nginx, systemd no lo
# levantaba.
#
# Drop-in, no edicion del unit: sobrevive a los upgrades del paquete y se revierte con rm.

[Service]
Restart=on-failure
RestartSec=5s
StartLimitIntervalSec=60s
StartLimitBurst=5