# ═══════════════════════════════════════════════════════════════════════════
# ape-meta-staging.conf · [t104] STAGING del gateway con EGRESS del resolver
#
# PROPÓSITO: probar el cableado del egress (407 -> reintento con srv/ctx) SIN
# tocar el 8088/443 en servicio. Este vhost escucha SOLO en 127.0.0.1:8089.
#
# REGLAS:
#   · NO se copia a conf.d/ hasta que el propietario apruebe el deploy.
#   · Si se copia, el servicio vivo (8088/443) NO se reinicia: solo se recarga.
#   · Rollback: borrar este fichero + `nginx -t` + `nginx -s reload`.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 127.0.0.1:8089;
    server_name _;

    # Mismo handler Lua que producción, pero servido desde el fichero de staging
    # para poder comparar comportamiento sin alterar el vivo.
    location /cdn/ {
        content_by_lua_file /etc/nginx/lua/ape_gateway.lua;
    }

    # Health propio del staging: permite comprobar que el vhost responde sin
    # tocar los endpoints del servicio vivo.
    location = /staging/health {
        default_type text/plain;
        return 200 "staging-8089-ok\n";
    }
}