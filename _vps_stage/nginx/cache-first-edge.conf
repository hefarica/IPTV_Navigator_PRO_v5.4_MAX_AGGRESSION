# ═══════════════════════════════════════════════════════════════════════════════
# APE CACHE-FIRST EDGE — motor de continuidad 24/7 SIN TRANSCODE
# ═══════════════════════════════════════════════════════════════════════════════
# Mandato del propietario: «reproducción fluida sin cortes, sin lags, sin
# freezeos y continua 24/7 365 días». Lo que da eso es CACHE-FIRST, no transcode.
#
# HECHOS MEDIDOS QUE MANDAN (no re-discutir):
#   · El VPS no tiene GPU utilizable (VAAPI init failed -5).
#   · Transcode 1080p→2160p a 0.356x ⇒ 1 stream necesita ~2.8x CPU en tiempo real.
#   ⇒ Cualquier diseño con FFmpeg en el path de petición se cae con 2 usuarios.
#   ⇒ Aquí NO hay FFmpeg, ni exec, ni shell en la ruta caliente. Solo cache.
#
# QUÉ RESUELVE CADA PIEZA
#   1. COALESCING      → `proxy_cache_lock`. N clientes pidiendo el mismo
#                        segmento ⇒ 1 sola petición al origen mientras la primera
#                        está en vuelo. El resto espera el resultado cacheado.
#                        Backstop en Lua (`ape_fanout` + single-flight) para las
#                        rutas que no pasan por la cache (manifests no-store).
#   2. PROXY_CACHE     → segmentos en /dev/shm (tmpfs = RAM, sin I/O de disco),
#                        TTL largo; manifests TTL 2-4 s. `proxy_cache_use_stale`
#                        para 500/502/503/504/timeout y
#                        `proxy_cache_background_update` = stale-while-revalidate.
#   3. PREFETCH        → `ape_prefetch_next.lua` (body_filter del manifest) pide
#                        en segundo plano el siguiente segmento por `ngx.timer`,
#                        sin bloquear la respuesta.
#   4. FAILOVER        → `proxy_next_upstream` SOLO en error/timeout/5xx.
#                        JAMÁS en 401/403/429: eso es auth, no red.
#   5. WATCHDOG        → `ape_edge_health.lua` (/ape/health) + scripts/ape-edge-watchdog.sh
#                        + nginx/logrotate-ape-edge.conf. El watchdog corre FUERA
#                        del path: nunca bloquea a un cliente.
#   6. AUTOPISTA       → CERO `ngx.exit(503)` en la ruta. CERO circuit breaker.
#                        CERO limit_conn/limit_req en la ruta caliente.
#
# HIGIENE DE HEADERS (enlaza con T25-H1): el catálogo emite los 10 tóxicos en el
# 100 % de los canales (`Range: bytes=0-`, `If-None-Match: *`, `TE: trailers`…).
# Aquí el edge los NEUTRALIZA antes de hablar con el proveedor: si no se limpian,
# el origen devuelve 304/403 y el segmento llega vacío.
#
# USO: este archivo se incluye dentro de un bloque `http { }`. Los marcadores
# __CACHE_SEG__ / __CACHE_MAN__ / __ORIGIN_1..3__ los sustituye el banco de
# pruebas por rutas y puertos reales; en producción los sustituye el instalador.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Estado compartido del edge (single-flight + telemetría) ───────────────────
lua_shared_dict ape_fanout 8m;

# ── Caches: segmentos (TTL largo) y manifests (TTL 2-4 s) ────────────────────
# use_temp_path=off ⇒ escribe DIRECTO al tmpfs, sin pasar por disco.
proxy_cache_path __CACHE_SEG__ keys_zone=ape_seg:32m levels=1:2
                 max_size=256m inactive=120s use_temp_path=off
                 min_free=64m;
proxy_cache_path __CACHE_MAN__ keys_zone=ape_man:8m levels=1:2
                 max_size=32m inactive=20s use_temp_path=off
                 min_free=32m;

# ── Orígenes ─────────────────────────────────────────────────────────────────
# max_fails=0 desactiva el marcado pasivo de host caído (equivale a "sin circuit
# breaker que frene"): el failover se decide POR PETICIÓN con proxy_next_upstream,
# no por un estado global que penalice a todos los clientes.
upstream ape_origin_single {
    server __ORIGIN_1__ max_fails=0;
    keepalive 16;
}

# Los 3 hosts del catálogo (espejos del mismo canal) para el failover de red.
upstream ape_origin_trio {
    server __ORIGIN_1__ max_fails=0;
    server __ORIGIN_2__ max_fails=0;
    server __ORIGIN_3__ max_fails=0;
    keepalive 16;
}

log_format ape_cf '$remote_addr "$request" $status $body_bytes_sent '
                  'cs=$upstream_cache_status rt=$request_time '
                  'urt=$upstream_response_time up=$upstream_addr';

server {
    listen __EDGE_PORT__;
    server_name _;

    access_log __LOG_DIR__/access.log ape_cf;
    error_log  __LOG_DIR__/error.log warn;

    # ── Higiene de headers tóxicos (T25-H1) ─────────────────────────────────
    # Se emiten en el 100 % de los canales del catálogo y provocan 304+0 B,
    # 400 y 403 en el origen. El edge los neutraliza SIEMPRE.
    proxy_set_header Range                     "";
    proxy_set_header If-None-Match             "";
    proxy_set_header If-Modified-Since         "";
    proxy_set_header TE                        "";
    proxy_set_header Priority                  "";
    proxy_set_header Upgrade-Insecure-Requests "";
    proxy_set_header Sec-Fetch-Dest            "";
    proxy_set_header Sec-Fetch-Mode            "";
    proxy_set_header Sec-Fetch-Site            "";
    proxy_set_header Sec-Fetch-User            "";
    proxy_set_header Connection                "";
    proxy_http_version 1.1;

    # ── SEGMENTOS: cache larga + coalescing + stale ─────────────────────────
    location ~ ^/live/seg[0-9]+\.(ts|m4s)$ {
        proxy_pass http://ape_origin_single;

        proxy_cache            ape_seg;
        proxy_cache_key        "$scheme$proxy_host$uri";
        proxy_cache_valid      200 206 10m;      # segmento: TTL largo
        proxy_cache_valid      302 301 0;        # NO se cachea el 302
        proxy_cache_valid      403 401 0;        # auth no se cachea
        proxy_cache_methods    GET HEAD;

        # COALESCING: mientras la primera petición está en vuelo, el resto
        # espera y recibe el mismo objeto. 1 conexión upstream por segmento.
        proxy_cache_lock            on;
        proxy_cache_lock_timeout    5s;
        proxy_cache_lock_age        10s;

        # STALE-WHILE-REVALIDATE: si el origen falla o tarda, se sirve lo que
        # hay y se refresca en segundo plano. Nunca un hueco.
        proxy_cache_use_stale       error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate      off;         # nunca If-None-Match al origen

        add_header X-APE-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── MANIFEST: TTL 2-4 s + no-store al cliente + prefetch ────────────────
    location ~ ^/live/index\.m3u8$ {
        proxy_pass http://ape_origin_single;

        proxy_cache            ape_man;
        proxy_cache_key        "$scheme$proxy_host$uri";
        proxy_cache_valid      200 206 3s;       # 2-4 s
        proxy_cache_valid      302 301 0;        # NO se cachea el 302
        proxy_cache_valid      403 401 0;
        proxy_cache_methods    GET HEAD;

        proxy_cache_lock            on;
        proxy_cache_lock_timeout    5s;
        proxy_cache_use_stale       error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # PREFETCH del siguiente segmento (no bloquea: ngx.timer + cosocket)
        body_filter_by_lua_file /etc/nginx/lua/ape_prefetch_next.lua;

        # no-store al cliente: el player debe repreguntar (manifest vivo)
        add_header Cache-Control "no-store" always;
        add_header X-APE-Cache $upstream_cache_status always;
    }

    # ── FAILOVER de red (3 hosts del catálogo) ──────────────────────────────
    # SOLO error/timeout/5xx. Nunca 401/403/429: eso es auth del proveedor y
    # reintentarlo contra otro host es contraproducente (y enmascara el fallo).
    location ~ ^/fo/seg[0-9]+\.(ts|m4s)$ {
        proxy_pass http://ape_origin_trio;

        proxy_next_upstream         error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 8s;

        proxy_cache            ape_seg;
        proxy_cache_key        "$scheme$proxy_host$uri";
        proxy_cache_valid      200 206 10m;
        proxy_cache_valid      302 301 0;
        proxy_cache_valid      403 401 0;
        proxy_cache_lock            on;
        proxy_cache_lock_timeout    5s;
        proxy_cache_use_stale       error timeout updating http_500 http_502 http_503 http_504;

        add_header X-APE-Cache $upstream_cache_status always;
    }

    # ── HEALTH + contadores (watchdog, fuera del path de cliente) ───────────
    location = /ape/health {
        allow 127.0.0.1;
        deny all;
        content_by_lua_file /etc/nginx/lua/ape_edge_health.lua;
    }

    # ── Todo lo demás: passthrough sin cache (no interferir) ────────────────
    location / {
        proxy_pass http://ape_origin_single;
    }
}
