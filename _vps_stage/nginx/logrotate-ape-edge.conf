# ═══════════════════════════════════════════════════════════════════════════
# APE CACHE-FIRST EDGE — rotación de logs (24/7)
# Instalar en: /etc/logrotate.d/ape-edge
# Modo: 0644 root:root · logrotate diario o por tamaño, con compress
# ═══════════════════════════════════════════════════════════════════════════
# Por qué importa: la cache vive en /dev/shm (RAM). Si los logs de acceso
# crecen sin control y /dev/shm se llena, la cache deja de escribir y el edge
# pierde su función. La rotación no es cosmética: protege el motor.
#
# `copytruncate` se usa a propósito: nginx mantiene el descriptor abierto y no
# queremos un `postrotate` con `nginx -s reopen` que, si falla, deje el log
# creciendo en el inodo viejo. copytruncate no interrumpe ni una petición.
# ═══════════════════════════════════════════════════════════════════════════

/var/log/ape-edge/access.log
/var/log/ape-edge/error.log
{
    su www-data www-data
    daily
    rotate 14
    maxsize 64M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%dT%H%M%S
}
