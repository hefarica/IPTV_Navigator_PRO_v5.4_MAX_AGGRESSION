# ═════════════════════════════════════════════════════════════════════════════
# APE MEDIA-FANOUT — coordinador (I1) + FAN-OUT de segmentos desde tmpfs (I3)
# ═════════════════════════════════════════════════════════════════════════════
# Fichero:  _vps_stage/nginx/media-fanout.conf
# Contexto: incluir DENTRO de un bloque `http {}` (declara lua_shared_dict y map).
#           Instancia nginx DEDICADA de staging (:8090), con su propio prefijo,
#           pid y logs. NO se incluye en el http{} de producción.
# Módulo:   ape_session.lua (ngx_http_lua puro; sin lua-resty-lock/http).
#
# I3 (fan-out) en una frase: los bytes de la sesión salen DIRECTOS de tmpfs con
# `sendfile`/`aio threads` en una location estática; el coordinador sólo aporta
# la GENERACIÓN VIGENTE (una lectura de shared dict, sin locks) y el borde
# desvía al directo (302 + X-MF-Jump-To-Live) cuando el cliente pide una
# generación muerta o un segmento que ya salió de la ventana. Nunca se proxya
# el worker de ingesta (no hay `proxy_buffering`, no hay `proxy_pass`).
#
# ── MAPA DE RUTAS ───────────────────────────────────────────────────────────
#   GET /mf/health                              → health JSON saneado (público)
#   GET /mf/metrics                             → Prometheus (sólo loopback)
#   POST /mf/ctl?op=...                         → control del worker (loopback)
#   GET /mf/src/<proveedor>/<canal>/live.m3u8   → 302 a la forma canónica
#   GET /sess/<proveedor>/<canal>/live.m3u8     → entrada alias → /mf/src/...
#   GET /mf/<key16>/<gen>/index.m3u8            → PLAYLIST desde tmpfs (no-store)
#   GET /mf/<key16>/<gen>/segNNNNN.ts           → SEGMENTO desde tmpfs (max-age corto)
#   GET /mf/<key16>/<gen>/<seg>.m4s|.mp4|.aac   → ídem fMP4/AAC
#   GET /mf/<key16>/live.m3u8                   → coordinador: playlist ABSOLUTA (O2)
#        (URIs /mf/<key16>/<gen>/<file> + X-MF-Gen; el player no conoce el gen)
#   GET /mf/<key16>/<gen>/4k/...                → coordinador (perfil 4K gateado)
#
# ── INVARIANTES DEL FAN-OUT ─────────────────────────────────────────────────
#   F1  Sólo se sirve la generación VIGENTE: el access handler compara el gen de
#       la URL con el gen del coordinador. Un fichero viejo que aún exista en
#       tmpfs NO se sirve.
#   F2  Generación obsoleta / sesión cerrada → 302 al borde del directo con
#       `X-MF-Jump-To-Live: 1` (jamás 500 en bucle, jamás basura). Los clientes
#       de API pueden pedir `?strict=1` y reciben 410 con `X-APE-Reason:
#       stale_generation` (misma decisión, sin seguir redirect).
#   F3  Hueco de ventana (fichero borrado por el worker) → 302 al live con
#       `X-APE-Reason: window_gap`; nunca se bloquea el request.
#   F4  Aislamiento: no hay locks compartidos en la ruta caliente; cada cliente
#       tiene su conexión, su socket y sus timeouts. `sendfile_max_chunk` acota
#       cada escritura; un lector lento sólo se frena a sí mismo. `limit_conn`
#       queda DOCUMENTADO Y APAGADO por defecto (si se enciende, alto y por IP).
#   F5  El candado de vídeo del plano público NO se reutiliza: bajo /mf/ no hay
#       `proxy_pass`, ni zona `limit_conn` de prod, ni reglas del shield.
#
# ── REQUISITOS DEL DESPLIEGUE ───────────────────────────────────────────────
#   * lua_package_path debe incluir el directorio de ape_session.lua (en el VPS
#     ya está global en /etc/nginx/nginx.conf; en una instancia aislada se
#     declara en SU http{}, nunca aquí: duplicarlo rompe nginx -t).
#   * tmpfs de ventanas: `$mf_window_root` = /dev/shm/mf (esta tarea). El worker
#     escribe <root>/<key>/<gen>/index.m3u8 + segNNNNN.ts. Alternativa W1 §6:
#     /run/mediafanout (montaje dedicado de 1.2 GiB); cambiar SÓLO esta línea.
#     OJO: /dev/shm es compartido con otras cachés del VPS; en producción se
#     recomienda el montaje dedicado (W1 §5.2) para no competir con nginx_cache.
#   * El SUPERVISOR (mf-supervisor.service) sigue siendo la autoridad de
#     lifecycle y publica su UDS. Este plano NO lanza FFmpeg.
#
# ── VALIDACIÓN AISLADA (staging, sin tocar prod) ────────────────────────────
#   sed -e 's#/etc/nginx/lua/ape_session.lua#/tmp/mf_i3/ape_session.lua#g' \
#       -e 's#unix:/run/mediafanout/supervisor.sock#unix:/tmp/mf_i3/sup.sock#g' \
#       -e 's#"/dev/shm/mf"#"/tmp/mf_i3/window"#g' \
#       -e 's#listen 8090;#listen 127.0.0.1:18093;#g' media-fanout.conf
#   nginx -t -p /tmp/mf_i3/ -c /tmp/mf_i3/nginx-i3.conf
# ═════════════════════════════════════════════════════════════════════════════

# ── estado del coordinador (nombres propios: no colisionan con prod) ─────────
# mf_sessions: registro de sesión + marcas de espectador por cliente (TTL 30 s)
lua_shared_dict mf_sessions 16m;
# mf_locks: lock single-flight por key + rate-limit del sweep
lua_shared_dict mf_locks 4m;
# mf_stats: contadores, índice de sesiones e gauges
lua_shared_dict mf_stats 4m;

# ── mapas del fan-out (contexto http) ───────────────────────────────────────
# El worker publica la playlist como index.m3u8; los players piden live.m3u8 o
# playlist.m3u8. Se sirve SIEMPRE el mismo fichero, sin copias ni symlinks.
map $mf_file $mf_store_file {
    default          $mf_file;
    "live.m3u8"      "index.m3u8";
    "playlist.m3u8"  "index.m3u8";
    "index.m3u8"     "index.m3u8";
}
# 1 = playlist (no-store); 0 = segmento (max-age corto, cacheable en el borde).
map $mf_file $mf_is_playlist {
    default          "0";
    "live.m3u8"      "1";
    "playlist.m3u8"  "1";
    "index.m3u8"     "1";
}
map $mf_is_playlist $mf_cache_control {
    default  "public, max-age=4";
    "1"      "no-store";
}
# Ruta interna del coordinador (/_mfwin/...): misma política por extensión.
map $uri $mf_cache_for_uri {
    default      "public, max-age=4";
    ~*\.m3u8$    "no-store";
}

# ── limit_conn OPCIONAL (apagado por defecto) ───────────────────────────────
# No se declara ni se aplica: en la ruta caliente no debe haber un lock compartido
# que acople clientes. Si un operador necesita techo anti-abuso, descomentar la
# zona y el `limit_conn mf_edge 64;` en la location del fan-out: es POR IP, alto
# (64 conexiones) y jamás afecta a otras IPs. `limit_conn_status 429` para no
# confundirlo con un error del worker.
# limit_conn_zone $binary_remote_addr zone=mf_edge:10m;
# limit_conn_log_level warn;

server {
    # Staging dedicado. En la instancia aislada este listen se reescribe a
    # 127.0.0.1:<puerto alto> por sed (nunca 443/8088 de producción).
    listen 8090;
    server_name _;

    # ── dirección del plano ─────────────────────────────────────────────────
    # mf_handler=1 le dice a ape_session.lua "me están ejecutando como handler"
    # (el access del fan-out lo pone a 0 mientras hace require del módulo).
    set $mf_handler "1";

    # Raíz tmpfs de la ventana deslizante del worker (I3). Un solo sitio.
    set $mf_window_root "/dev/shm/mf";

    # Endpoint del supervisor. UDS por defecto (W1 §6.1). Alternativa TCP
    # loopback: "127.0.0.1:9011" (el coordinador soporta ambos formatos).
    # t9 (supervisor) escucha DOS sockets con el mismo handler: canónico
    # /run/mediafanout/mf.sock y ALIAS /run/mediafanout/supervisor.sock. Aquí se
    # usa el alias a propósito: es la ruta que ya validó I1 y sobrevive al
    # contrato nuevo sin tocar este fichero. Permisos: root:www-data 0660.
    set $mf_sup_endpoint "unix:/run/mediafanout/supervisor.sock";

    # Sal opcional de la clave hash (defensa en profundidad; "" = sin sal).
    # Debe ser idéntica entre recargas para no invalidar URLs ya emitidas.
    set $mf_key_salt "";

    # Límites (W1 §6.6). Staging puede bajar max_sessions a 6–8.
    set $mf_max_sessions "12";              # techo medido 16; recomendado 12
    set $mf_max_viewers_per_session "24";   # egress y aislamiento
    set $mf_max_total_viewers "120";        # 120 × 5,5 Mbps < 1 Gbit/s
    set $mf_linger_ttl "25";                # s tras el último espectador
    set $mf_linger_max "90";                # tope duro anti-sesión-zombi
    set $mf_lock_ttl "8";                   # backstop del single-flight
    set $mf_session_ttl "180";              # refresco por heartbeat/publish
    set $mf_gen_ttl "3600";                 # el gen sobrevive al cierre (fencing)
    set $mf_viewer_ttl "30";                # marca por cliente
    set $mf_spawn_wait_ms "2000";           # espera acotada del perdedor del lock
    set $mf_manifest_wait_ms "2500";        # espera acotada a manifest LIVE
    set $mf_poll_ms "50";
    set $mf_spawn_timeout "15";             # STARTING estancado → cerrar caché
    set $mf_sweep_interval "10";
    set $mf_sup_timeout_ms "250";           # UDS: timeout 250 ms
    set $mf_caps_ttl "10";                  # cache del probe de hardware

    # Variables que Lua escribe antes del redirect interno a la ventana; las
    # consumen los add_header del location /_mfwin/ (los headers de Lua se
    # pierden en el redirect interno, las variables no).
    set $mf_key "";
    set $mf_gen "";
    set $mf_jump "";

    # Generación vigente que resuelve el access del fan-out (para cabeceras y
    # para que el operador pueda correlacionar una respuesta con su gen).
    set $mf_gen_current "";
    # Capturas del fan-out que sobreviven al redirect interno a @mf_jump.
    set $mf_saved_key "";
    set $mf_saved_gen "";

    # ── timeouts POR CONEXIÓN (aislamiento; documentados) ───────────────────
    # Un cliente lento consume SU conexión: nginx no serializa clientes y aquí
    # no hay locks compartidos ni buffer de proxy. Los timeouts acotan la vida
    # de sockets abandonados sin tocar a los demás.
    client_body_timeout   5s;    # sin cuerpo en GET; corta clientes colgados
    client_header_timeout 5s;    # cabeceras incompletas no ocupan worker
    send_timeout          15s;   # escritura estancada (cliente que no lee)
    keepalive_timeout     20s;   # recicla conexiones ociosas por cliente
    reset_timedout_connection on; # libera buffers de sockets muertos
    sendfile_max_chunk    1m;    # techo por escritura: fairness entre clientes
    output_buffers        2 32k; # sólo cabeceras/colas; el cuerpo va por sendfile

    # Cuerpos pequeños: la API de control es de línea/queries, no de ficheros.
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # ── salud (público, saneado: sin hosts, sin rutas, sin credenciales) ────
    location = /mf/health {
        add_header Cache-Control "no-store" always;
        content_by_lua_file /etc/nginx/lua/ape_session.lua;
    }

    # ── métricas Prometheus (sólo loopback; defensa en profundidad) ─────────
    location = /mf/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        add_header Cache-Control "no-store" always;
        content_by_lua_file /etc/nginx/lua/ape_session.lua;
    }

    # ── API de control del worker (sólo loopback; token opcional por env
    #    MF_CTL_TOKEN, comparado en Lua con el header X-MF-Ctl) ──────────────
    location = /mf/ctl {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        add_header Cache-Control "no-store" always;
        content_by_lua_file /etc/nginx/lua/ape_session.lua;
    }

    # ── FAN-OUT DE SEGMENTOS DESDE TMPFS (I3, ruta caliente) ────────────────
    # URL: /mf/<key16>/<gen>/<fichero>
    # Fichero real: $mf_window_root/<key>/<gen>/<fichero>   (root + $uri)
    #
    # Se sirve con el módulo estático de nginx: sendfile directo desde tmpfs,
    # sin proxy y sin buffering que acople al worker. `aio threads` cubre el
    # caso de lecturas que el kernel no resuelva con sendfile sin bloquear el
    # worker; si el build no tuviera --with-threads, basta quitar esa línea.
    location ~ "^/mf/(?<mf_req_key>[0-9a-f]{16})/(?<mf_req_gen>[0-9]{1,9})/(?<mf_file>[A-Za-z0-9][A-Za-z0-9._-]{0,63})$" {
        # Persistimos key/gen para @mf_jump (las capturas de regex no cruzan el
        # redirect interno de try_files).
        set $mf_saved_key $mf_req_key;
        set $mf_saved_gen $mf_req_gen;

        # ── GENERACIÓN VIGENTE (resuelta por el coordinador, sin locks) ─────
        # Una lectura de shared dict por request. No adquiere single-flight ni
        # ningún lock de sesión; no puede acoplar clientes entre sí.
        #   - gen != vigente  → 302 al live (o 410 si ?strict=1)
        #   - sin sesión      → 302 al live (el coordinador re-crea la sesión)
        # Si el módulo no estuviera desplegado, se falla CERRADO (503): servir
        # una generación sin comprobar rompería el fencing (F1).
        access_by_lua_block {
            local key  = ngx.var.mf_req_key
            local asked = tonumber(ngx.var.mf_req_gen) or 0

            local prev = ngx.var.mf_handler
            ngx.var.mf_handler = "0"  -- evita que el require se autodespache
            local ok, ses = pcall(require, "ape_session")
            ngx.var.mf_handler = prev or "1"

            if not ok or type(ses) ~= "table" or type(ses.get_session) ~= "function" then
                ngx.log(ngx.ERR, "mf_fanout: coordinador no disponible: ", tostring(ses))
                ngx.header["X-APE-Reason"] = "coordinator_unavailable"
                ngx.header["Cache-Control"] = "no-store"
                ngx.header["Retry-After"] = "1"
                return ngx.exit(503)
            end

            local rec = ses.get_session(key)
            local cur = rec and tonumber(rec.gen) or 0
            ngx.var.mf_gen_current = (cur > 0) and tostring(cur) or ""

            -- Sin sesión en el coordinador: el borde manda al live; el
            -- coordinador decide si re-crea (single-flight) o responde 503
            -- acotado. Nunca se sirve un fichero huérfano de una sesión cerrada.
            if cur <= 0 then
                ngx.header["X-APE-Reason"] = "session_closed"
                ngx.header["X-MF-Jump-To-Live"] = "1"
                ngx.header["Cache-Control"] = "no-store"
                ngx.header["Location"] = "/mf/" .. key .. "/live.m3u8"
                return ngx.exit(302)
            end

            if asked ~= cur then
                ngx.header["X-APE-Reason"] = "stale_generation"
                ngx.header["X-MF-Jump-To-Live"] = "1"
                ngx.header["Cache-Control"] = "no-store"
                ngx.header["Link"] =
                    '</mf/' .. key .. '/live.m3u8>; rel="live"'
                if ngx.var.arg_strict == "1" then
                    -- Modo API/diagnóstico: misma decisión sin redirect.
                    ngx.header["Content-Type"] = "application/json"
                    ngx.status = 410
                    ngx.print('{"error":"stale_generation","current_gen":',
                        tostring(cur), ',"jump_to_live":"/mf/', key, '/live.m3u8"}')
                    return ngx.exit(410)
                end
                ngx.header["Location"] = "/mf/" .. key .. "/live.m3u8"
                return ngx.exit(302)
            end
        }

        # URI interna = <key>/<gen>/<fichero>; root = tmpfs.
        # `break` mantiene la location actual (estático) y no vuelve a enrutar.
        rewrite ^ /$mf_saved_key/$mf_saved_gen/$mf_store_file break;
        root $mf_window_root;
        try_files $uri @mf_jump;
        error_page 404 = @mf_jump;   # carrera borrado-entre-try_files-y-open

        # Vídeo ya en RAM: cero compresión, cero listados, cero caché de FDs
        # (los ficheros se borran al rodar la ventana; cachear FDs sería un bug).
        gzip off;
        autoindex off;
        open_file_cache off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;                 # ver nota de build arriba
        directio off;

        # MIME por extensión (range-friendly: no se transforma el cuerpo).
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                     ts;
            video/mp4                      mp4 m4s m4v;
            audio/aac                      aac m4a;
        }
        default_type application/octet-stream;

        # Política de caché: playlist no-store, segmento max-age corto.
        # Accept-Ranges: bytes lo emite el módulo estático de nginx para estas
        # respuestas (verificado con curl -I / -r en staging); no se duplica
        # con add_header para no enviar dos cabeceras Accept-Ranges.
        add_header Cache-Control $mf_cache_control always;
        add_header X-MF-Key $mf_saved_key always;
        add_header X-MF-Gen $mf_saved_gen always;
        add_header X-MF-Gen-Current $mf_gen_current always;
        add_header X-MF-Window "tmpfs" always;

        # (opcional, OFF) limit_conn mf_edge 64;  # por IP, nunca por sesión
    }

    # ── hueco de ventana / carrera de borrado → jump-to-live (nunca 500) ────
    location @mf_jump {
        add_header Cache-Control "no-store" always;
        add_header X-MF-Jump-To-Live "1" always;
        add_header X-APE-Reason "window_gap" always;
        add_header Link '</mf/$mf_saved_key/live.m3u8>; rel="live"' always;
        # 302 relativo: el player re-resuelve el live y el coordinador decide
        # sesión/generación. No hay bucle: el live no vuelve a @mf_jump.
        return 302 /mf/$mf_saved_key/live.m3u8;
    }

    # ── router de sesión del coordinador (sin generación en la URL) ────────
    # OJO al orden: una location de prefijo normal pierde frente a las regex
    # (arriba); `^~ /mf/` la habría ganado y habría dejado el fan-out muerto.
    # Aquí caen: /mf/<key>/live.m3u8, /mf/src/..., /mf/<key>/<gen>/4k/... y la
    # API de sesión. Toda la lógica (single-flight, fencing, límites, linger,
    # métricas) vive en Lua; aquí sólo se enruta.
    location /mf/ {
        add_header Cache-Control "no-store" always;
        content_by_lua_file /etc/nginx/lua/ape_session.lua;
    }

    # ── entrada alias /sess/<proveedor>/<canal>/... ────────────────────────
    # Compatibilidad con la forma "legible" del enunciado. Sólo es la ENTRADA:
    # el coordinador aprende el idem y responde 302 a la forma canónica
    # /mf/<key16>/<gen>/...; los segmentos viven únicamente bajo /mf/ (F5).
    location ~ "^/sess/(?<sess_provider>[^/]+)/(?<sess_channel>[^/]+)/(?:live|playlist|index)\.m3u8$" {
        add_header Cache-Control "no-store" always;
        add_header X-APE-Sess-Alias "1" always;
        return 302 /mf/src/$sess_provider/$sess_channel/live.m3u8;
    }
    location /sess/ {
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"session_segments_are_canonical","use":"/mf/<key16>/<gen>/<segment>"}';
    }

    # ── ventana deslizante servida al coordinador (manifests / 4K) ──────────
    # Sólo alcanzable por redirect interno de Lua (`ngx.exec`), nunca desde
    # fuera. `root` + rewrite del prefijo: /_mfwin/<key>/<gen>/<file> se sirve
    # como $mf_window_root/<key>/<gen>/<file> (misma raíz que el fan-out).
    location ^~ /_mfwin/ {
        internal;
        root $mf_window_root;
        rewrite ^/_mfwin/(.*)$ /$1 break;
        try_files $uri =404;

        gzip off;
        autoindex off;
        open_file_cache off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;

        add_header Cache-Control $mf_cache_for_uri always;
        add_header X-MF-Key $mf_key always;
        add_header X-MF-Gen $mf_gen always;
        add_header X-MF-Jump-To-Live $mf_jump always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                     ts;
            video/mp4                      mp4 m4s m4v;
            audio/aac                      aac m4a;
        }
        default_type application/octet-stream;
    }

    # Raíz: no exponer nada más en este server de staging.
    location = / {
        return 404;
    }
}
