# ═════════════════════════════════════════════════════════════════════════════
# /a v2 — atributos por canal (`#EXTATTRFROMURL`) · REPO-ONLY, NO desplegado
# ═════════════════════════════════════════════════════════════════════════════
# Contrato y diccionario: docs/rea/14_APE_A_CONTRACT.md
# Se incluye en el vhost 443 (snippet). El plano 8088 tiene su propio location
# en conf.d/meta-plane.conf (loopback).
#
# Propiedades de esta location:
#   · GET/HEAD solamente (limit_except) — un POST se diseña aparte (POST /a/cfg).
#   · access_log off: la URL lleva payload y HMAC; no se loguea.
#   · Sin caché: la respuesta depende del payload y del estado del plano.
#   · Fail-open: el handler SIEMPRE responde 200 (nunca 4xx). Si la clave falta o
#     el HMAC no valida, devuelve el fragmento mínimo `#EXT-X-APE-STALE:1`.
#   · Sin upstream: no hay proxy_pass; no toca los providers.
# ═════════════════════════════════════════════════════════════════════════════

location ^~ /a/ {
    limit_except GET {
        deny all;
    }

    access_log off;                       # payload/HMAC no van al log
    default_type 'text/plain; charset=us-ascii';

    add_header Cache-Control "no-store" always;
    add_header X-APE-A "endpoint" always;

    # El módulo decide en <80 ms leyendo sólo ngx.shared (ape_qoe/ape_flags).
    content_by_lua_file /etc/nginx/lua/ape_attr.lua;
}

# POST /a/cfg — DISEÑADO, NO IMPLEMENTADO (ver docs/rea/14 §POST /a/cfg).
# Deliberadamente ausente: si algún día se habilita, debe ir con token por sesión,
# cuerpo máximo pequeño y rate-limit propio. No se deja un `location` abierto.
