# I3-LUA · `/sync` en Lua — snippet STAGED (NO desplegado)
#
# Deploy target (solo con ventana + autorización; fuera de este entregable):
#   /etc/nginx/snippets/ara-sync-lua.conf   (644 root:root)
# Include DENTRO del server 443 vivo, con el mismo patrón que el snippet PHP:
#   include snippets/ara-sync-lua.conf;
# NO en el :80 (solo 443) y NUNCA sobre /lists/ ni paths de playback.
#
# Requisitos de contexto http que añade el dueño del nginx (NO van aquí):
#   lua_shared_dict ara_sync_lua 1m;
#   limit_req_zone $binary_remote_addr zone=ara_sync_lua:1m rate=3r/m;
#   limit_req_status 429;
#   lua_package_path "/etc/nginx/lua/?.lua;;";   # ya existe en nginx.conf:22
#
# `nginx -t` = NOT_RUN (requiere ventana). `luac -p` = NOT_RUN (sin Lua local).

location = /sync {
    limit_req zone=ara_sync_lua burst=6 nodelay;
    client_max_body_size 16k;
    content_by_lua_file /etc/nginx/lua/ara_x_sync.lua;
    # V3-F-07: el 429 de `limit_req` no trae Retry-After; el 429 propio del módulo sí.
    add_header Retry-After 30 always;
}
