# D3 · `/sync` rate-limit zone (http context) — STAGED, NOT DEPLOYED.
#
# Deploy target (when the owner authorizes a window):
#   /etc/nginx/conf.d/00-ara-sync-zone.conf        (644 root:root)
#
# R6-D3-RATE-01/02: `limit_req_zone` lives in http context and `limit_req` is used ONLY
# inside `location = /sync`. Playback keeps zero rate limits: /lists/, *.m3u8, *.ts,
# *.m4s, /cdn/, /meta/ are untouched by this file.
#
# Cadence is 30 s +/-20 % (2..2.5 req/min). rate=3r/m + burst=6 tolerates jitter and a
# few retries; anything above becomes 429 with Retry-After (see ara-sync.conf).

limit_req_zone $binary_remote_addr zone=ara_sync:1m rate=3r/m;
# V3-F-06: zona dedicada de la variante Lua; sin esto `limit_req zone=ara_sync_lua`
# rompe `nginx -t`. Solo /sync la usa; playback sigue sin límites.
limit_req_zone $binary_remote_addr zone=ara_sync_lua:1m rate=3r/m;
limit_req_status 429;

# V3-F-07: nginx `limit_req` no añade Retry-After por sí solo. Los snippets de /sync
# añaden `add_header Retry-After 30 always;` SOLO dentro de `location = /sync`.
# La variante Lua además devuelve Retry-After en su propio 429 (rate 6/60 s).

# Minimal log format for /sync: timestamp, status, duration. NO client IP, NO query,
# NO body, NO secrets (R6-D3-DATA-04).
log_format ara_sync_log '$time_iso8601 $status $request_time';
