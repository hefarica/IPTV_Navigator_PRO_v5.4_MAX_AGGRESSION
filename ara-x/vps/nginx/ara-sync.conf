# D3 · `/sync` location (server context) — STAGED, NOT DEPLOYED.
#
# Deploy targets (owner window required):
#   /etc/nginx/snippets/prisma-ara-sync.conf       (644 root:root)  <- this file
#   /etc/nginx/conf.d/00-ara-sync-zone.conf        (644 root:root)  <- ara-sync-zone.conf
# Include it INSIDE the live 443 server, after the ARA block of
# `snippets/ape-meta-public.conf` (after the `include snippets/prisma-ara-enroll.conf;` line):
#
#   include snippets/prisma-ara-sync.conf;
#
# DO NOT include this file in the :80 server (no plaintext POST; R6-D3-NET-01) nor in the
# :8088 meta-plane (that plane is loopback-only and has no PHP consumer for /sync).
#
# Security invariants (R6-D3-*):
#   * POST only -> 405 for GET/PUT/HEAD/OPTIONS
#   * rate-limit only here, 3r/m burst 6, status 429 + Retry-After produced by nginx
#   * body limit 16 KB (matches the PHP hard cap)
#   * no CORS headers, no redirects, no proxy_pass, no resolver
#   * no-store + nosniff; PHP sets its own JSON content-type
#   * access_log without IP/body/query; X-Powered-By hidden

location = /sync {
    if ($request_method !~ ^(POST)$) {
        return 405;
    }

    limit_req zone=ara_sync burst=6 nodelay;

    client_max_body_size 16k;
    client_body_buffer_size 16k;

    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/prisma/api/ara-sync.php;
    fastcgi_param SCRIPT_NAME     /sync;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 10s;
    fastcgi_send_timeout 10s;

    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-APE-ARA-Sync "v2" always;
    # V3-F-07: `limit_req` devuelve 429 sin Retry-After; el header se emite SOLO aquí.
    add_header Retry-After 30 always;

    access_log /var/log/nginx/ara_sync_access.log ara_sync_log;
}
