<?xml version="1.0" encoding="UTF-8"?>
<!--
  Badge de upscaling activo — APE
  Para OTT Navigator: se usa como tvg-logo de un canal, o como marca en el
  overlay. Fondo transparente, lectura a 20-40 px, alto contraste.
  Se percibe a distancia de sofa: barra ascendente + "4K" + punto verde.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Upscaling activo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="318" height="94" rx="14" fill="url(#fondo)" stroke="#10b981" stroke-width="2"/>

  <!-- escalera ascendente: el gesto de "esto se esta escalando" -->
  <g transform="translate(20,26)">
    <rect x="0"  y="30" width="12" height="16" rx="2" fill="#10b981"/>
    <rect x="16" y="22" width="12" height="24" rx="2" fill="#22d3a5"/>
    <rect x="32" y="13" width="12" height="33" rx="2" fill="#38bdf8"/>
    <rect x="48" y="4"  width="12" height="42" rx="2" fill="#7dd3fc"/>
    <!-- flecha hacia arriba-derecha -->
    <path d="M64 6 L82 6 L82 24" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- texto -->
  <text x="118" y="42" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">UPSCALING</text>
  <text x="118" y="66" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="1.2">ACTIVO · 4K</text>

  <!-- punto de estado -->
  <circle cx="292" cy="48" r="9" fill="#10b981"/>
  <circle cx="292" cy="48" r="16" fill="none" stroke="#10b981" stroke-width="2" opacity="0.45"/>
</svg>
