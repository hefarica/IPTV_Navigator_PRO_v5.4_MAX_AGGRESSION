# Loader patch: inserts the APE Stability Console bundle row.
# The Host half (index.js) owns the two read-only JSON routes and the single
# whitelisted read-only ssh probe; the Client half (client.js) owns the left
# sidebar entry and the `ape-stability-console` panel.
- insert:
    - id: ape-stability-console
      name: '@local/ape-stability-console'
