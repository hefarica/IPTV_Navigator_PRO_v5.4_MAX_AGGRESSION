<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Reglas de superresolucion IPTV">
  <title>Reglas de superresolucion IPTV</title>
  <desc>Tres escalones ascendentes que representan la resolucion reconstruida, y un cuarto trazo discontinuo que representa lo que solo la interpolacion rellena.</desc>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#14202b"/>
  <rect x="10" y="42" width="9" height="12" rx="2" fill="#3f7fb5"/>
  <rect x="23" y="32" width="9" height="22" rx="2" fill="#4f9ad4"/>
  <rect x="36" y="20" width="9" height="34" rx="2" fill="#67b6ea"/>
  <rect x="49" y="10" width="5" height="44" rx="2.5" fill="#9fd4f5" opacity="0.45"/>
  <g stroke="#9fd4f5" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <line x1="49" y1="13" x2="49" y2="16"/>
    <line x1="49" y1="22" x2="49" y2="25"/>
    <line x1="49" y1="31" x2="49" y2="34"/>
    <line x1="49" y1="40" x2="49" y2="43"/>
    <line x1="49" y1="49" x2="49" y2="52"/>
  </g>
  <circle cx="14.5" cy="36" r="2.6" fill="#eaf4fb"/>
  <circle cx="27.5" cy="26" r="2.6" fill="#eaf4fb"/>
  <circle cx="40.5" cy="14" r="2.6" fill="#eaf4fb"/>
</svg>
