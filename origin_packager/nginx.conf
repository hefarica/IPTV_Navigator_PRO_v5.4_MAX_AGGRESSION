# Authorized-origin CMAF edge. Serve only the packager output directory.
server {
    listen 8080;
    server_name _;

    root /srv/ape-cmaf;
    index index.m3u8;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"ape-origin-cmaf"}';
    }

    location ~ \.m3u8$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Accept-Encoding" always;
        types { application/vnd.apple.mpegurl m3u8; }
        try_files $uri =404;
    }

    location ~ \.(m4s|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            video/iso.segment m4s;
            video/mp4 mp4;
        }
        try_files $uri =404;
    }
}
