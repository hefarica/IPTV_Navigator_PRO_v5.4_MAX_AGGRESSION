# [2026-11-19] ape-jit-reconcile abortaba con status=6/ABRT (OOM de V8).
# Medido: "FATAL ERROR: Ineffective mark-compacts near heap limit" a ~1,9 GB.
# Causa doble, ambas corregidas en reconcile.js:
#   1) leia 4 MB de /var/log/nginx/playlist_access.log y les pasaba matchAll global
#      (string + array gigantes) para quedarse con la ULTIMA lista servida.
#      -> ahora Buffer.lastIndexOf('l=APE_LISTA_') nativo, ventana de 1 MB.
#   2) verificaba leyendo APE_JIT_LIST.m3u8 entero + match(/^#EXTINF/gm).
#      -> ahora cuenta en streaming con readline.
# Con el heap por defecto seguia sin caber (parsea 22.204.717 lineas / 21.224 canales);
# se le da heap explicito. Resultado medido tras el cambio:
#   PARSE lineas=22204717 canales=21224 sin_url=0
#   PUBLISH release=20261119191358-tofh verificado=21224/21224
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=2560
