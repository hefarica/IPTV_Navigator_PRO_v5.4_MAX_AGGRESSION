location = /_shield_auth {
    internal;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/html/api/shield-auth.php;
    fastcgi_param SCRIPT_NAME /api/shield-auth.php;
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param QUERY_STRING "";
    fastcgi_param CONTENT_TYPE "";
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param DOCUMENT_ROOT /var/www/html;
    fastcgi_param REQUEST_URI /api/shield-auth.php;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
    fastcgi_param HTTP_X_ORIGINAL_HOST $host;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTPS on;
}
location ~ ^/shield/([a-f0-9]+)/([^/]+)/(.*)$ {
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    auth_request /_shield_auth;
    auth_request_set $shield_owner $upstream_http_x_shield_owner;

    # ═══ FASE REWRITE: TELESCOPE + CRYSTAL 8K EXTREME ════════════════════════
    # Wrapper que ejecuta: decision_engine.lua + ape_ts_crystal_hook.lua (v3.0)
    rewrite_by_lua_file /etc/nginx/lua/ape_crystal_rewrite.lua;

    # ═══ FASE ACCESS: UPSTREAM GATE ══════════════════════════════════════════
    access_by_lua_file /etc/nginx/lua/upstream_gate.lua;

    # ═══ FASE HEADER FILTER: ANTI-403 + LCEVC ENHANCEMENT ═══════════════════
    # CAPA 1: Interceptar 403 upstream en segmentos .ts/.m4s → nunca llega al player
    # CAPA 2: Inyectar headers HDR/LCEVC/DV/OLED (Crystal 8K Extreme v8.0.1)
    # NOTA: Solo 1 header_filter_by_lua_file permitido → usar wrapper
    header_filter_by_lua_file /etc/nginx/lua/ape_shield_header_filter.lua;

    # ═══ FASE BODY FILTER: MANIFIESTOS + NULL PACKET ═════════════════════════
    # CAPA 1: Floor-Lock + Prefetch + Crystal Fortify (manifiestos .m3u8)
    # CAPA 2: Null packet para segmentos con 403 interceptado
    # NOTA: Solo 1 body_filter_by_lua_file → usar wrapper
    body_filter_by_lua_file /etc/nginx/lua/ape_shield_body_filter.lua;

    # ═══ FASE LOG: PREFETCH PREDICTIVO ANTI-403 ══════════════════════════════
    # Guardian: aprende patrón de numeración + pre-calienta N+1, N+2, N+3
    # bandwidth_reactor: telemetría TELESCOPE
    # NOTA: Solo 1 log_by_lua_file → usar wrapper
    log_by_lua_file /etc/nginx/lua/ape_shield_log.lua;

    # ═══ RATE LIMITING ═══════════════════════════════════════════════════════
    limit_conn xtream_slot 24;
    limit_conn_status 429;
    limit_req      zone=hard_cap   burst=200 nodelay;
    limit_req_status 429;

    # ═══ GUARD: upstream no reconocido → 403 ═════════════════════════════════
    if ($shield_upstream = "") { return 403; }

    # ═══ PROXY PASS ══════════════════════════════════════════════════════════
    proxy_pass http://$shield_upstream$shield_path$is_args$args$ape_nonce;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^https?://([^/]+)(/.*)$  https://iptv-ape.duckdns.org/shield/f54d65f5e6af35ec19d075b84aaf37ee0cc89e8303ae602e/$1$2;

    # ═══ FAILOVER UPSTREAM ═══════════════════════════════════════════════════
    # ANTI-403: incluir http_403 en next_upstream → Nginx reintenta en otra IP
    # antes de devolver el 403 al Lua interceptor (doble protección)
    proxy_next_upstream         error timeout http_403 http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries   3;
    proxy_next_upstream_timeout 5s;

    # ═══ HEADERS AL UPSTREAM ═════════════════════════════════════════════════
    proxy_pass_request_headers off;
    proxy_set_header Accept "*/*";
    proxy_set_header Host $shield_host;
    set $sentinel_ua "Mozilla/5.0 (Linux; Android 10; AFTKA) ExoPlayerLib/2.18.1";
    proxy_set_header User-Agent $sentinel_ua;

    # ═══ CACHE OPTIMIZADO ANTI-403 ═══════════════════════════════════════════
    proxy_cache iptv_cache;
    proxy_no_cache $shield_manifest;
    proxy_cache_bypass $shield_manifest;
    proxy_cache_key "$scheme$shield_host$shield_path";

    # SEGMENTOS .ts/.m4s: cache 45s (cubre 15 segmentos de 3s = buffer de 45s)
    # Antes era 30s → token expiraba antes de que el player pidiera el segmento
    proxy_cache_valid 200 206 45s;
    proxy_cache_valid 302 301 0;
    # CRÍTICO ANTI-403: NO cachear el 403 del upstream
    # Antes: proxy_cache_valid 403 401 0 → el 403 se cacheaba brevemente
    # Ahora: excluir 403/401 del cache → siempre reintenta upstream en nueva IP
    proxy_cache_valid 403 0;
    proxy_cache_valid 401 0;

    proxy_cache_lock on;
    proxy_cache_lock_timeout 3s;
    proxy_cache_min_uses 1;
    proxy_cache_methods GET HEAD;
    # ANTI-403: incluir http_403 en stale → si hay versión cacheada, servirla
    proxy_cache_use_stale error timeout updating http_403 http_404 http_429 http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;

    # No cache para signed token paths
    set $shield_no_cache 0;
    if ($request_uri ~* "/hlsr/") { set $shield_no_cache 1; }
    proxy_cache_bypass $shield_no_cache;
    proxy_no_cache $shield_no_cache;

    # PRISMA FLOOR-LOCK: Bypass cache when profile specified
    proxy_cache_bypass $arg_profile $http_x_ape_profile;
    proxy_no_cache $arg_profile $http_x_ape_profile;

    # ═══ AUTOPISTA MODE — Max throughput buffers ══════════════════════════════
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 16 128k;
    proxy_busy_buffers_size 256k;
    output_buffers 4 128k;

    # TIMEOUTS ANTI-403: más generosos para dar tiempo al prefetch
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Shield-Owner $shield_owner always;
    add_header X-Shield-Host $shield_host always;
    access_log /var/log/nginx/shield_access.log iptv_intercept;
    error_log /var/log/nginx/shield_error.log warn;
}
# Crystal UHD 2026 — Location interno para upscaler
include /etc/nginx/snippets/ape-crystal-upscaler-location.conf;
