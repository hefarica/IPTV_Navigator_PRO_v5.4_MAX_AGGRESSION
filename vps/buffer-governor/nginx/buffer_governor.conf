# ═══════════════════════════════════════════════════════════════════════════
# APE Buffer Governor v2.0 — Configuración Nginx CORREGIDA (SSRF-safe, /shield/, :8090)
# ═══════════════════════════════════════════════════════════════════════════
# CORRIGE el buffer_governor.conf entregado:
#   1. Puerto :8084 → :8090 (NO colisiona con ape-crystal-rust, el motor vivo).
#   2. proxy_pass http://$arg_upstream_host$uri (OPEN PROXY / SSRF) → ELIMINADO.
#      El Buffer Governor NO proxia tráfico de video; el shield-location.conf existente
#      sigue siendo la ÚNICA frontera (/shield/{TOKEN}/{HOST}/{PATH}). Este conf SOLO
#      expone los endpoints de CONTROL del Governor (loopback) + los shared dicts.
#   3. 403→200 ciego e infinito → ELIMINADO. El 403 lo clasifica el segment_fetcher.rs
#      (auth / provider-block / temporary) y el no_repeat_guard decide HOLD/RESYNC.
#
# INTEGRACIÓN: este conf se INCLUYE en http{} (shared dicts + upstream + locations de
# control). Los Lua snipers se llaman DESDE el shield-location.conf existente (no aquí),
# preservando SHIELDED. Validar: nginx -t. NUNCA reemplaza el server block del shield.

# ── Shared memory zones (ledger no-repeat + índice de caché) ─────────────────
lua_shared_dict ape_ledger 10m;
lua_shared_dict ape_cache_index 50m;
lua_shared_dict ape_prefetch_ctrl 5m;     # contadores de concurrencia del prefetch planner
lua_shared_dict ape_pattern 5m;           # patrones de numeración aprendidos por canal

# Pool de conexiones Lua → Rust Governor
lua_socket_pool_size 30;
lua_socket_keepalive_timeout 60s;
lua_code_cache on;

# ── Upstream del Buffer Governor (Rust en :8090, loopback) ───────────────────
upstream ape_buffer_governor {
    server 127.0.0.1:8090 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── Server de CONTROL (loopback only) — NO sirve video, NO toca /shield/ ──────
# Endpoints de control/telemetría del Governor. Bind a 127.0.0.1 para que NO sea
# alcanzable desde fuera. El tráfico IPTV real sigue por el shield-location.conf.
server {
    listen 127.0.0.1:8091;          # puerto de control local (distinto de :8090 del Rust)
    server_name ape-buffer-governor.local;

    # Solo loopback puede hablar con el control (defensa en profundidad)
    allow 127.0.0.0/8;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /buffer/state    { proxy_pass http://ape_buffer_governor; }
    location /buffer/report   { proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /prefetch/plan   { proxy_pass http://ape_buffer_governor; }
    location /prefetch/enqueue{ proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /prefetch/status { proxy_pass http://ape_buffer_governor; }
    location /segment/fetch   { proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /segment/probe   { proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /live-edge/probe { proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /qoe/event       { proxy_pass http://ape_buffer_governor; proxy_request_buffering off; }
    location /metrics         { proxy_pass http://ape_buffer_governor; access_log off; }
    location /health          { proxy_pass http://ape_buffer_governor; access_log off; }
}

# ═══════════════════════════════════════════════════════════════════════════
# SNIPPET DE INTEGRACIÓN con el shield-location.conf EXISTENTE (referencia, NO duplicar).
# Estas líneas se AÑADEN dentro del `location ~ ^/shield/` ya existente, en las fases
# Lua que ya están enganchadas (wrappers). NO crear un server block nuevo de /shield/.
#
#   rewrite_by_lua  (dentro del wrapper ape_crystal_rewrite.lua):
#       require("ape_buffer_sniper").intercept_request()
#       require("ape_prefetch_planner").plan(ngx.ctx.bg_state)
#   header_filter_by_lua (dentro de ape_shield_header_filter.lua):
#       -- el 403 se CLASIFICA, no se convierte a 200 ciego (lo hace el Governor)
#   body_filter_by_lua (dentro de ape_shield_body_filter.lua):
#       require("ape_no_repeat_guard").intercept_cached_response()
#       require("ape_variant_escape").downgrade(...)   -- solo en master + headroom bajo
#   log_by_lua (dentro de ape_shield_log.lua):
#       require("ape_buffer_sniper").intercept_response()  -- reporta a :8090, no bloqueante
#
# Cache (ya en el shield): proxy_cache_use_stale SOLO misma URI, jamás stale como futuro.
# ═══════════════════════════════════════════════════════════════════════════
