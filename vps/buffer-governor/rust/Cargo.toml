[package]
name = "ape-buffer-governor"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "ape-buffer-governor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
hyper = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
dashmap = "5.5"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
bytes = "1.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
