# ape-crystal-8k-overlay.conf — FIXED (FREEZELESS) overlay for 8K/4K Crystal delivery.
# Owner Virtual-4K + Transcode overrides apply; FREEZELESS invariants are NOT waived.
# Council audit 2026-06-20 (S6/S8/S10) removed/repaired 6 freeze vectors vs the original.
#
# Include AFTER the base vps_nginx.conf:  include /etc/nginx/conf.d/ape-crystal-8k-overlay.conf;
# Validate on the VPS:  nginx -t  &&  nginx -T | grep -E 'proxy_cache_valid|use_stale|background_update'

# ── 8K segment buffers (KEPT — genuinely useful) ──────────────────────────────
proxy_buffer_size       256k;
proxy_buffers           16 512k;
proxy_busy_buffers_size 1024k;
proxy_temp_file_write_size 1024k;
proxy_connect_timeout   10s;
proxy_read_timeout      60s;      # autopista: never below 30s
proxy_send_timeout      60s;

# ── RAMdisk cache (KEPT) ──────────────────────────────────────────────────────
proxy_cache_path /dev/shm/nginx_cache_8k levels=1:2
                 keys_zone=iptv_cache_8k:100m max_size=4096m
                 inactive=30m loader_threshold=200 loader_files=1000;

http2_push_preload on;

# ── KEEPALIVE — FIX: sane DOWNSTREAM (client) keepalive only. ──────────────────
# Root cause of the doctrine ban is UPSTREAM keepalive to Xtream (stale reuse -> 509).
# These directives are client-facing; NO `keepalive N;` is set in any Xtream upstream{}.
keepalive_timeout  75s;
keepalive_requests 1000;        # FIX: was 500000 (excessive)
# DO NOT add `keepalive` inside an Xtream `upstream {}` block. (FREEZELESS)

# ── TCP tuning (KEPT) ─────────────────────────────────────────────────────────
tcp_nodelay on; tcp_nopush on; sendfile on;
aio threads; aio_write on; output_buffers 4 512k;

# ── 8K M3U8 manifest location ─────────────────────────────────────────────────
location ~ \.m3u8$ {
    # existing intercept proxy_pass chain ...
    access_by_lua_file      /etc/nginx/lua/ape_http_headers_agent.lua;     # A1 forge (no AF41/keepalive)
    header_filter_by_lua_file /etc/nginx/lua/ape_metadata_injector.lua;    # A1 X-APE-* private headers
    body_filter_by_lua_file /etc/nginx/lua/combined_body_filter.lua;       # existing FLOOR-LOCK + PREFETCH
    body_filter_by_lua_file /etc/nginx/lua/ape_manifest_rewriter.lua;      # A4 hvc1/L153 rewrite
    body_filter_by_lua_file /etc/nginx/lua/ape_lcevc_color_agent.lua;      # A5 HDR/LCEVC signaling
    log_by_lua_file         /etc/nginx/lua/ape_bandwidth_reactor_v3_8k.lua; # reactor (post-response)

    proxy_cache iptv_cache_8k;
    proxy_cache_valid 200 3s;
    proxy_cache_valid 302 0;        # FIX: never cache redirects (was missing)
    proxy_cache_valid 404 1s;
    proxy_cache_use_stale error timeout;   # FIX: removed `updating` (stale-manifest -> 404 -> freeze)
    # proxy_cache_background_update OFF on live manifests (FIX: was on)
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;

    set $crystal_tier "2";
    if ($arg_crystal_tier) { set $crystal_tier $arg_crystal_tier; }
    # NO `proxy_set_header Range` / `If-Range` here (toxic).
}

# ── 8K video segment location ─────────────────────────────────────────────────
location ~ \.(ts|m4s|mp4)$ {
    # existing intercept proxy_pass chain ...
    log_by_lua_file /etc/nginx/lua/ape_bandwidth_reactor_v3_8k.lua;

    proxy_cache iptv_cache_8k;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 206 0;        # FIX: was 206 10m (token-rotated segments -> stale/corrupt)
    proxy_cache_use_stale error timeout;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    proxy_buffer_size 512k;
    proxy_buffers 32 1024k;
    proxy_busy_buffers_size 2048k;
    proxy_set_header Accept-Encoding "identity";
    # FIX: removed `proxy_set_header Range $http_range;` and `If-Range` (toxic -> EOF on OkHttp/ExoPlayer)
}
