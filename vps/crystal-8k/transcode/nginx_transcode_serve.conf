# nginx_transcode_serve.conf — serve transcoded HLS with FREEZELESS passthrough fallback.
# Owner override 2026-06-20 (DIRECTIVA TRANSCODE VPS PERMITIDO).
# Include inside the streaming server {} block. Validate: nginx -t  (then reload OR restart).
#
# CONCEPT (the whole safety of this feature):
#   The supervisor writes transcoded HLS to /dev/shm/crystal/<chId>/index.m3u8.
#   The player asks for /crystal/<chId>/...  ->  try_files serves the transcoded file
#   IF it exists, ELSE @crystal_passthrough proxies the ORIGINAL provider (verbatim).
#   So a transcode that is not ready / lagging / crashed degrades to passthrough.
#   It can NEVER freeze: a missing transcoded segment just falls back.

# Transcoded variant (flagship channels only). RAMdisk-backed, no disk I/O.
location /crystal/ {
    root /dev/shm;                      # /crystal/<chId>/index.m3u8 -> /dev/shm/crystal/<chId>/index.m3u8
    try_files $uri @crystal_passthrough;

    add_header X-APE-Crystal-Transcode "active" always;
    add_header X-APE-Visual-Engine "CRYSTAL-UHD-TRANSCODE" always;
    add_header Cache-Control "no-cache" always;   # live: never cache the playlist
    # NO toxic headers (no Range/If-Range forwarded here), single URL per channel.
}

# FREEZELESS fallback: transcoded output absent -> serve the verbatim provider passthrough.
location @crystal_passthrough {
    add_header X-APE-Crystal-Transcode "fallback-passthrough" always;

    # Reuse the existing shield/upstream. Replace with the real upstream/variable.
    # (autopista: passthrough, no circuit breaker, no 302 cache, no Xtream keepalive)
    proxy_pass http://ape_shield_upstream;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_cache_valid 302 0;
    proxy_set_header Accept-Encoding "identity";
    # Do NOT set Range / If-Range here (toxic).
}
