# ═══════════════════════════════════════════════════════════════════════════════
# APE JIT CATALOG — snippet nginx DESPLEGADO en producción
# Ruta pública: https://iptv-ape.duckdns.org/jit/...
# Upstream:     127.0.0.1:3099 (servidor de catálogo JIT)
# Fichero real: /etc/nginx/snippets/ape-jit.conf
# Include:      /etc/nginx/sites-available/default:46 → `include snippets/ape-jit.conf;`
# ═══════════════════════════════════════════════════════════════════════════════
# ESTE ARCHIVO ES LA COPIA DE REFERENCIA DEL SNIPPET QUE CORRE EN EL VPS.
# El snippet no existía en el repo; se versiona aquí para que el estado de
# producción sea reproducible y auditable.
#
# ─── FIX 2026-11-06 (dos defectos medidos en vivo) ────────────────────────────
# 1) `Access-Control-Allow-Origin` DUPLICADO (`*, *`) → el navegador rechaza la
#    respuesta entera: "The 'Access-Control-Allow-Origin' header contains
#    multiple values '*, *', but only one is allowed". Causa: el upstream 3099
#    ya envía el header y nginx añadía el suyo encima. Medido:
#      curl -sSI http://127.0.0.1:3099/catalog.json  →  Access-Control-Allow-Origin: *
#      curl -sSI https://iptv-ape.duckdns.org/jit/catalog.json  →  *  y  *   (2)
#    Fix: `proxy_hide_header Access-Control-Allow-Origin;` — nginx queda como
#    ÚNICA fuente del header (mismo patrón ya usado en `default:97` y `default:186`).
#    Resultado medido: 1 solo header, 200 OK.
#
# 2) `add_header Keep-Alive "timeout=5, max=100" always;` es ilegal en HTTP/2
#    (RFC 7540 §8.1.2.2: cabeceras connection-specific PROHIBIDAS). nginx lo
#    reinyectaba sobre la respuesta del upstream y rompía el parseo:
#      curl: (92) Invalid HTTP header field was received: name: [keep-alive]
#    En Chrome/Firefox equivalentemente aborta la respuesta (ERR_HTTP2_PROTOCOL_ERROR),
#    así que `/jit/catalog.json` era inutilizable por fetch desde la UI.
#    Fix: `proxy_hide_header Keep-Alive;` + se elimina el `add_header Keep-Alive`.
#    La gestión de conexión es del servidor, no de una cabecera inyectada.
#
# Rollback: /var/backups/ape-deploy/<stamp>/ape-jit.conf
# Verificación obligatoria tras cualquier edición:
#   nginx -t && systemctl reload nginx
#   curl -sSI https://iptv-ape.duckdns.org/jit/catalog.json | grep -ci access-control-allow-origin   # == 1
#   curl -sSI https://iptv-ape.duckdns.org/jit/catalog.json | grep -ci keep-alive                    # == 0
# ═══════════════════════════════════════════════════════════════════════════════
# Include inside the HTTPS server for iptv-ape.duckdns.org
# Public route: https://iptv-ape.duckdns.org/jit/...
location ^~ /jit/ {
    proxy_pass http://127.0.0.1:3099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Keep-Alive;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
}
